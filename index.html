<!doctype html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Dr Mike — Training Command</title>
<meta name="theme-color" content="#06080B" />
<!-- v10: this document must never be served from a stale cache. A previous build of the
     persistence layer could destroy completed workouts, so running an old index.html is a
     data-safety issue, not just a cosmetic one. Meta tags are advisory (GitHub Pages sets
     its own headers) — the authoritative check is the deployed-build comparison in JS. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<!-- home-screen / PWA naming. Display name only — storage keys, the Supabase project and
     every other internal identifier keep their original iron_arc names on purpose, so the
     rename carries zero migration risk. -->
<meta name="application-name" content="Dr Mike" />
<meta name="apple-mobile-web-app-title" content="Dr Mike" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0B0F15; --panel:#161D27; --panel2:#1E2733; --line:#28323F; --line2:#34404E;
  --text:#F4F7FB; --muted:#94A0AE; --faint:#5E6976;
  --accent:#3B82F6; --accent-ink:#FFFFFF; --hot:#FF8A4C;
  --grey:#3A4654; --green:#34C759; --amber:#FF9F0A; --red:#FF5A52; --blue:#5AC8FA; --gold:#E0A53C; --violet:#BF7AF0;
  --r:18px; --rs:12px; --ui:'Inter'; --display:'Sora';
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 18px 40px -26px rgba(0,0,0,.8);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:var(--ui),system-ui,sans-serif; font-size:15px; line-height:1.5; padding-bottom:86px;
}
.mono{font-family:'JetBrains Mono',monospace;}
.app{max-width:520px; margin:0 auto; padding:0 16px; position:relative; z-index:1;}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.015em; font-family:var(--display),var(--ui),sans-serif;}
button{font-family:inherit; cursor:pointer; border:none; color:inherit;}
.muted{color:var(--muted);} .tiny{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
.top{display:flex; align-items:center; justify-content:space-between; padding:18px 0 8px;}
.brand{display:flex; align-items:center; gap:10px; font-weight:800;}
.brand .dot{width:11px; height:11px; border-radius:3px; background:var(--accent);}
.brand small{display:block; font-weight:500; font-size:10px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase;}
.modepill{font-size:11px; font-weight:600; padding:6px 11px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:var(--panel2);}
.weekstrip{display:flex; gap:6px; margin:10px 0 4px;}
.day{flex:1; text-align:center; padding:9px 0 8px; border-radius:var(--rs); background:var(--panel); border:1px solid var(--line);}
.day b{display:block; font-size:11px; color:var(--muted);} .day .pip{margin:5px auto 0; width:9px; height:9px; border-radius:50%; background:var(--grey);}
.day.done .pip{background:var(--green);} .day.today{border-color:var(--accent); background:rgba(59,130,246,.08);} .day.today b{color:var(--accent);}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:12px 0;}
.card{box-shadow:var(--shadow);} .card.glow{border-color:var(--line2); background:linear-gradient(180deg,var(--panel2),var(--panel));}
.cta{width:100%; padding:17px; border-radius:14px; font-family:var(--display); font-weight:800; font-size:16px; color:var(--accent-ink); background:var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;}
.cta:active{transform:translateY(1px);} .cta .sub{display:block; font-size:11px; font-weight:600; letter-spacing:.06em; opacity:.7; text-transform:uppercase;}
.cta.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--line); box-shadow:none; font-size:14px; font-weight:600; padding:14px; font-family:var(--ui);}
.btn{padding:11px 14px; border-radius:var(--rs); background:var(--panel2); border:1px solid var(--line); font-weight:600; font-size:14px;}
.btn.accent{background:var(--accent); color:var(--accent-ink); border-color:transparent;} .btn.ghost{background:transparent;}
.btn.sm{padding:7px 10px; font-size:12px;} .btn.full{width:100%;} .btn.danger{color:var(--red); border-color:rgba(255,77,109,.3);}
.row{display:flex; gap:8px;} .row.wrap{flex-wrap:wrap;}
.resume{background:linear-gradient(135deg,rgba(255,106,61,.16),rgba(255,106,61,.05)); border:1px solid rgba(255,106,61,.5);}
.exline{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-top:1px solid var(--line);} .exline:first-child{border-top:none;}
.exline .nm{font-weight:600;} .exline .meta{font-size:12px; color:var(--muted);}
.sets{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text); background:var(--panel2); border:1px solid var(--line); padding:3px 9px; border-radius:8px; white-space:nowrap;}
.tag{display:inline-block; font-size:10px; padding:2px 7px; border-radius:6px; background:var(--panel2); color:var(--muted); margin-left:6px;}
.tag.love{color:var(--gold);} .tag.avoid{color:var(--red);}
.logex{margin:12px 0;} .logex .hd{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;} .logex .hd .nm{font-weight:700; font-size:16px;}
.exacts{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.exacts button{font-size:11px; padding:6px 9px; border-radius:8px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); display:flex; align-items:center; gap:4px;}
.exacts button.swap{color:var(--accent);} .exacts button.rm{color:var(--red);}
.histline{font-size:12px; color:var(--muted); margin-top:3px;} .histline b{color:#AEB9C7; font-weight:600;} .target{color:var(--accent); font-weight:600;}
.setgrid{margin-top:11px;}
.sethead,.setrow{display:grid; grid-template-columns:24px 42px 1fr 1fr 52px; gap:7px; align-items:center;}
.setrow.cur{background:rgba(59,130,246,.10); border-radius:12px; box-shadow:inset 0 0 0 1px rgba(59,130,246,.28); padding:5px 6px; margin:7px -6px 0;}
.prevc{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--faint); text-align:center; white-space:nowrap; overflow:hidden;}
.sethead{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin-bottom:5px; padding:0 2px;}
.setrow{margin-bottom:7px;} .setrow .sn{cursor:pointer; -webkit-user-select:none; user-select:none; font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:13px; text-align:center;}
.setrow.warm .sn{color:var(--amber);}
.inp{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:9px; color:var(--text); padding:11px 8px; font-family:'JetBrains Mono',monospace; font-size:16px; text-align:center;}
.inp:focus{outline:none; border-color:var(--accent);}
.chk{width:52px; height:48px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--faint);}
.chk.on{background:var(--green); border-color:transparent; color:#04190E;}
.wbtn{width:38px; height:40px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); color:var(--faint); font-size:11px; font-weight:700;}
.wbtn.on{color:var(--amber); border-color:var(--amber);}
.win{display:inline-flex; gap:6px; flex-wrap:wrap; margin-top:9px;}
.badge{font-size:10.5px; padding:4px 9px; border-radius:999px; font-weight:700;}
.badge.pr{background:var(--gold); color:#241B02;} .badge.beat{background:rgba(47,210,122,.16); color:var(--green); border:1px solid rgba(47,210,122,.4);}
.badge.warnb{background:rgba(255,77,109,.14); color:var(--red); border:1px solid rgba(255,77,109,.35);}
/* v14 — the rest timer is DOCKED TO THE TOP of the screen, always above the fold.
   It used to be a card fixed at bottom:86px — the same slot as the Finish button (z-index 45 over
   the timer's 40, so Finish covered the controls once a set was logged) and the slot the iOS
   keyboard sits over while you type a weight. Either way the countdown vanished exactly when it
   mattered. The top edge is never covered by the keyboard, the tab bar or the Finish button.
   --resttop is the bar's measured height; .app is padded by it so nothing hides underneath, and
   the sticky logger header sticks just below it. */
:root{--resttop:0px;}
.rest{position:fixed; left:0; right:0; top:0; z-index:55; display:flex; justify-content:center; pointer-events:none; padding-top:env(safe-area-inset-top,0px); will-change:transform; background:linear-gradient(var(--bg),var(--bg)) no-repeat top / 100% env(safe-area-inset-top,0px);}
.rest .pill{pointer-events:auto; background:var(--panel2); border:1px solid var(--accent); border-radius:999px; padding:10px 14px; display:flex; align-items:center; gap:12px; box-shadow:0 10px 30px rgba(0,0,0,.5);}
.rest .t{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--accent); min-width:62px; text-align:center;}
.rest button{background:transparent; color:var(--muted); font-size:13px; padding:4px 8px;}
.app{padding-top:var(--resttop);}
.sheet-wrap{position:fixed; inset:0; z-index:60; background:rgba(2,4,7,.7); display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:var(--panel); border:1px solid var(--line); border-radius:20px 20px 0 0; width:100%; max-width:520px; max-height:85vh; overflow-y:auto; padding:18px 16px calc(20px + env(safe-area-inset-bottom));}
.sheet .grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 12px;}
.opt{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--panel2);}
.opt .nm{font-weight:600;} .opt .meta{font-size:11.5px; color:var(--muted);}
.mgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
.mcard{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:11px; cursor:pointer; position:relative; overflow:hidden;}
.mcard{padding:0;} .mcard .bartop{position:absolute; top:0; left:0; right:0; height:4px;} .mcard .mbody{padding:13px;}
.mcard .mlabel{font-weight:600; font-size:13.5px; margin-top:3px;}
.mcard .stat{font-family:'JetBrains Mono',monospace; font-size:18px; margin-top:4px;}
.mcard .gb{font-size:9px; padding:2px 6px; border-radius:5px; margin-top:6px; display:inline-block; font-weight:700;}
.statuspill{font-size:10px; padding:3px 8px; border-radius:999px; font-weight:700; white-space:nowrap;}
.bar{height:7px; border-radius:4px; background:var(--panel2); overflow:hidden; position:relative; margin-top:5px;} .bar i{display:block; height:100%; border-radius:4px;} .bar .capmark{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--faint);}
.kpi{display:flex; gap:10px;} .kpi .k{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:var(--rs); padding:12px; text-align:center; cursor:pointer;}
.kpi .k b{display:block; font-family:'JetBrains Mono',monospace; font-size:24px; color:var(--accent);} .kpi .k span{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:50; background:rgba(8,11,15,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line);}
.tabbar .inner{max-width:520px; margin:0 auto; display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.tab{flex:1; background:transparent; padding:7px 0; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10px;}
.tab svg{width:22px; height:22px;} .tab.on{color:var(--accent);}
.empty{text-align:center; color:var(--muted); padding:26px 10px; font-size:14px;}
.reveal{animation:rise .45s both;} @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.divider{height:1px; background:var(--line); margin:14px 0;} hr.sub{border:none; border-top:1px dashed var(--line); margin:14px 0;}
.note{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:9px; color:var(--text); padding:9px; font-family:inherit; font-size:13px; resize:vertical;}
.quote{font-style:italic; color:#AEB9C7; font-size:13.5px;} .scale{display:flex; gap:6px;}
.scale button{flex:1; padding:10px 0; border-radius:9px; background:var(--panel2); border:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-weight:700;}
.scale button.on{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.field{margin:13px 0;} .field label{display:block; font-size:13px; margin-bottom:7px; color:#C6D0DC;}
.contrib{display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px dashed var(--line); font-size:13px;}
.contrib:first-child{border-top:none;} .contrib .c-ef{font-family:'JetBrains Mono',monospace; color:var(--accent);}
.seg{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px;}
.seg button{flex:1; padding:8px; border-radius:8px; background:transparent; font-size:12px; font-weight:600; color:var(--muted);}
.seg button.on{background:var(--accent); color:var(--accent-ink);}
.seg.mini button{padding:6px 4px; font-size:11px;}
.srch{width:100%;}
.recgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
.recgrid .rc{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
.recgrid .rc span{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.recgrid .rc b{display:block; font-family:'JetBrains Mono',monospace; font-size:20px; color:var(--accent); margin-top:2px;}
.recgrid .rc b i{font-style:normal; font-size:12px; color:var(--muted);}
.recgrid .rc small{display:block; font-size:10px; color:var(--faint); margin-top:2px;}
.chartwrap{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 8px 4px; margin-top:8px;}
.badge.rm5{background:var(--accent); color:var(--accent-ink);}
.badge.rm10{background:rgba(91,140,255,.18); color:var(--blue); border:1px solid rgba(91,140,255,.4);}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 6px; -webkit-overflow-scrolling:touch;}
.chips button{white-space:nowrap; font-size:12px; padding:7px 11px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-weight:600;}
.chips button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.achrow{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-top:1px dashed var(--line);}
.achrow:first-child{border-top:none;}
.achrow .am{font-size:12.5px; font-weight:600;} .achrow .ad{font-size:11px; color:var(--muted); margin-top:2px;}
/* --- live logger v3 (Fable polish) --- */
.lhead{position:sticky; top:var(--resttop); z-index:30; background:linear-gradient(180deg,var(--panel),rgba(14,18,24,.94)); border:1px solid var(--line); border-radius:var(--r); padding:13px 16px; margin:12px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; backdrop-filter:blur(8px);}
.lhead .ttl{font-weight:700; font-size:16px; letter-spacing:-.01em;}
.lhead .meta{font-size:12px; color:var(--muted); margin-top:2px;}
.lhead .clk{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--accent); text-align:right; line-height:1;}
.lhead .prog{font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:right; margin-top:3px;}
.collapsed{display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer;}
.collapsed .smry{font-size:12px; color:var(--accent); margin-top:3px; font-family:'JetBrains Mono',monospace;}
.exmenu{display:flex; gap:6px; align-items:center;}
.exmenu .swap{font-size:12px; padding:8px 11px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); color:var(--accent); font-weight:600;}
.exmenu .more{width:38px; height:38px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-size:18px; line-height:1;}
.recwarn{font-size:11.5px; color:var(--amber); background:rgba(255,194,61,.10); border:1px solid rgba(255,194,61,.3); border-radius:9px; padding:7px 10px; margin:8px 0 2px;}
.inp.ghosted::placeholder{color:var(--accent); opacity:.5; font-weight:600;}
.stickfin{position:fixed; left:0; right:0; bottom:86px; z-index:45; display:flex; justify-content:center; pointer-events:none; padding:0 16px;}
.stickfin .b{pointer-events:auto; width:100%; max-width:488px; padding:15px; border-radius:14px; font-weight:800; font-size:16px; color:var(--accent-ink); background:var(--accent); box-shadow:0 10px 30px -10px rgba(0,0,0,.6);}
.stickfin .b:active{transform:translateY(1px);}
/* --- Insights v5 --- */
.icard{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:12px; padding:12px 14px; margin:10px 0;}
.icard.tap{cursor:pointer;}
.icard .ihd{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.ibadge{font-size:9px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap;}
.imetric{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; white-space:nowrap;}
.ititle{font-weight:700; font-size:14px; margin-top:7px; letter-spacing:-.01em;}
.ibody{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.5;}
.ibody b{color:#AEB9C7;}
.momwrap{display:flex; align-items:center; gap:15px;}
.momring{width:76px; height:76px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
.momring .inner{width:62px; height:62px; border-radius:50%; background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;}
.spark{display:flex; align-items:flex-end; gap:3px; height:30px; margin-top:8px;}
.spark i{flex:1; min-height:2px; background:var(--grey); border-radius:2px 2px 0 0; display:block;}
.spark i.cur{background:var(--accent);}
/* v14 — scrollable weekly chart. Ten weeks fill the card; everything older sits to the LEFT and
   is reached by swiping. Column width is a share of the card so the visible window is always
   exactly ten weeks, whatever the screen width. */
.wscroll{overflow-x:auto; overflow-y:hidden; margin:10px 0 0; padding:0 0 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; scroll-snap-type:x proximity; overscroll-behavior-x:contain;}
.wscroll::-webkit-scrollbar{display:none;}
.wgrid{display:grid; grid-auto-flow:column; grid-auto-columns:calc((100% - 9*4px)/10); gap:4px; align-items:end; width:100%;}
.wcol{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; scroll-snap-align:end;}
.wcol .wb{height:56px; width:100%; display:flex; align-items:flex-end;}
.wcol .wb i{width:100%; min-height:3px; background:var(--grey); border-radius:4px 4px 0 0; display:block;}
.wcol.cur .wb i{background:var(--accent);}
.wcol.zero .wb i{background:transparent; border-top:2px dashed var(--line2); min-height:0;}
.wcol .wv{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); line-height:1.2;}
.wcol.cur .wv{color:var(--accent); font-weight:700;}
.wcol .wd{font-family:'JetBrains Mono',monospace; font-size:8.5px; color:var(--faint); line-height:1.2; white-space:nowrap; letter-spacing:-.02em;}
.wcol.cur .wd{color:var(--accent);}
.wcol.mstart .wd{color:var(--muted);}
.wavg{position:relative;}
.wfoot{display:flex; justify-content:space-between; gap:8px; margin-top:8px; font-size:11px; color:var(--muted);}
.wfoot b{color:#AEB9C7; font-weight:600;}
.scorechips{display:flex; gap:8px; margin-top:10px;}
.scorechips .sc{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 6px; text-align:center;}
.scorechips .sc b{display:block; font-family:'JetBrains Mono',monospace; font-size:18px;}
.scorechips .sc span{font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
/* v8 library filter chips (Add / Swap / Exercise management) */
.fchips{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:7px 0 2px; margin:0 -2px; scrollbar-width:none;}
.fchips::-webkit-scrollbar{display:none;}
.fchip{flex:none; white-space:nowrap; font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:999px;
  background:var(--panel); border:1px solid var(--line); color:var(--muted);}
.fchip.on{border-color:var(--accent); color:var(--accent); background:rgba(59,130,246,.12);}
@media (min-width:560px){ .fchips{flex-wrap:wrap; overflow:visible;} }
/* v8 exercise setup / machine settings strip */
.setupline{display:flex; align-items:flex-start; gap:8px; width:100%; text-align:left; margin:8px 0 2px; padding:8px 10px; border-radius:10px;

@media (max-width:379px){ .restt{font-size:22px; min-width:56px;} .restctl button{padding:8px 7px; font-size:11px;} }

.cov-scroll{flex:1; min-width:0; margin:0; padding:0;}
table.cov{border-collapse:separate; border-spacing:2px 0; font-family:'JetBrains Mono',monospace; font-size:10px; table-layout:fixed;}

  if(i>=0) S.sessions[i]=sess; else S.sessions.push(sess); S.sessions=normaliseSessions(S.sessions,"upsert"); }
function exById(id){ return S.exercises.find(e=>e.id===id); }
function inputOrder(){ return (S.settings&&S.settings.inputOrder)==="rw"?"rw":"wr"; }
/* v7: every "previous / last" pair is shown in YOUR logging order (Settings → Set logging order).
   Weight → Reps shows 60×8 (kg×reps); Reps → Weight shows 8×60 (reps×kg). */
function fmtSet(w,r){ const a=(w==null||w==="")?0:w, b=(r==null||r==="")?0:r; return inputOrder()==="rw"?(b+"×"+a):(a+"×"+b); }
/* v7: map a set-row index to its working-set ordinal (warm-ups don't shift the prev column) */
function workIndex(en,si){ let n=0; for(let k=0;k<si&&k<en.sets.length;k++){ if(en.sets[k].type!=="warm") n++; } return n; }
function uid(){ try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return "id-"+Date.now()+"-"+Math.random().toString(16).slice(2); }

/* active-workout autosave (P1) — separate key, written on EVERY change.
   v15: saveActive() only ever WRITES. It no longer removes the draft when activeSession happens to
   be null — a background tab's blur/visibilitychange flush used to delete the draft the foreground
   tab was still logging into. Removal is explicit (clearActive) and only follows a verified finish
   or a deliberate discard. A write failure (quota) is recorded instead of swallowed. */
let lastDraftError=null, draftSavedAt=0;
function saveActive(){ if(!activeSession) return true;
  try{ localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSession)); lastDraftError=null; draftSavedAt=Date.now(); return true; }
  catch(e){ const err=String((e&&e.name)||e); if(lastDraftError!==err) plog("draft.fail",{id:activeSession.id, err:err}); lastDraftError=err; return false; } }
function clearActive(reason){ try{ localStorage.removeItem(ACTIVE_KEY); }catch(e){} plog("draft.clear",{why:reason||"?"}); }
function loadActive(){ try{ const r=localStorage.getItem(ACTIVE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
/* v15 — the draft is adopted back into memory if this tab has none (another tab wrote it, or the
   page was restored from the back-forward cache after a sign-out wiped memory). */
function adoptDraft(){ if(activeSession) return false; const d=loadActive(); if(!d||!d.id) return false; activeSession=d; viewingLogger=false; plog("draft.adopt",{id:d.id}); return true; }
/* v15 — ask the browser not to evict this origin's storage under pressure (Chromium honours it for
   engaged/installed sites; Safari ignores it). Best effort, never awaited on the critical path. */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().then(function(g){ if(!g) plog("storage.persist",{granted:false}); }).catch(function(){}); }catch(e){}
/* ============================================================================ SUPABASE ============================================================================ */
let sb=null, authUser=null, authProfile=null, pushTimer=null, syncing=false, authMode="magic", authMsg="";
function cloudReady(){ return !!(sb && authUser); }
/* v10 — THE root cause of the lost-workout bug.
   supabase-js v2 PostgREST calls RESOLVE with {data,error}; they do not throw, not even
   on a network fault. The old code awaited them bare inside a try/catch, so the catch was
   dead code and every workout was stamped synced:true whether or not it reached the
   server. sbq() turns an error response back into a real exception so failure is visible. */
async function sbq(builder){
  const r=await builder;
  if(r&&r.error) throw new Error((r.error.message||r.error.details||"supabase write failed"));
  return r;
}
try{ if(window.supabase && SUPABASE_KEY.indexOf("sb_publishable_")===0){
  sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:"iron_arc_auth" } }); }
}catch(e){ sb=null; }
function redirectURL(){ return window.location.origin + window.location.pathname; }
function isApproved(email){ return !!ALLOWED_USERS[(email||"").toLowerCase()]; }
function rateLimited(err){ const m=((err&&err.message)||"").toLowerCase(); return m.indexOf("rate")>=0||m.indexOf("limit")>=0||m.indexOf("too many")>=0; }

async function sendMagicLink(email){ if(!sb) throw new Error("offline");
  const { error }=await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo:redirectURL(), shouldCreateUser:true } }); if(error) throw error; }

  /* wipe in-memory state + rescope so the next sign-in on this device sees nothing of this account.
     The user-scoped keys on disk (history, journal, open draft) are left exactly as they are. */
  try{ clearRest(); }catch(e){}

/* v15 — workouts finished while the sync library had not loaded (sb null) were written under the
   UNSCOPED keys and became invisible once the user-scoped store took over. Adopt any such completed
   session the scoped store has never seen, provided it was finished AFTER this device was scoped
   (older unscoped entries are the legacy pre-multi-user snapshot and are already in the cloud). */
function scopedSinceKey(){ return "iron_arc_scoped_since:"+(authUser&&authUser.id); }
function adoptUnscopedJournal(){
  if(!authUser||!authUser.id) return 0;
  let sinceRaw=null; try{ sinceRaw=localStorage.getItem(scopedSinceKey()); }catch(e){} if(!sinceRaw) return 0;
  let list=[]; try{ const r=localStorage.getItem("iron_arc_journal_v1"); list=r?JSON.parse(r):[]; }catch(e){ return 0; }
  if(!Array.isArray(list)||!list.length) return 0;
  const since=new Date(sinceRaw).getTime();
  const have=new Set((S.sessions||[]).map(s=>s&&s.id).filter(Boolean)); let n=0;
  list.forEach(j=>{ if(!j||!j.id||!j.completedAt||have.has(j.id)||isTombstoned(j.id)) return;
    if(!(new Date(j.completedAt).getTime()>since)) return;
    S.sessions.push({...j, synced:false, recovered:true, adopted:"unscoped"}); have.add(j.id); n++; journalPut(j); });
  if(n){ S.sessions=normaliseSessions(S.sessions,"adopt").sort((a,b)=>new Date(a.completedAt)-new Date(b.completedAt)); persistLocal(); plog("journal.adopt-unscoped",{n:n}); }
  return n;
}
let afterAuthFor=null;
async function afterAuth(){

     run this whole routine concurrently (two profile upserts per launch in the server logs). Once. */
  if(afterAuthFor===authUser.id) return; afterAuthFor=authUser.id;
  if(!isApproved(authUser.email)){ authMsg="not_approved"; afterAuthFor=null; await sb.auth.signOut(); authUser=null; render(); return; }
  const meta=ALLOWED_USERS[authUser.email.toLowerCase()];

  /* Scope local data to this user id. One-time: the admin (original single-user install)
     adopts the legacy shared-key data; everyone else starts from their own clean cache. */
  const legacyRaw=(function(){ try{ return localStorage.getItem("iron_arc_v2"); }catch(e){ return null; } })();
  setStorageScope(authUser.id);
  if(legacyRaw && !localStorage.getItem(KEY) && authUser.email.toLowerCase()===ADMIN_EMAIL){
    try{ localStorage.setItem(KEY, legacyRaw); const la=localStorage.getItem("iron_arc_active_v2"); if(la) localStorage.setItem(ACTIVE_KEY, la); }catch(e){}
  }
  S=load(); try{ ensureSetupDefaults(); }catch(e){} try{ recoverFromJournal(); journalBackfill(); }catch(e){}

  try{ if(!localStorage.getItem(scopedSinceKey())) localStorage.setItem(scopedSinceKey(), iso(new Date())); adoptUnscopedJournal(); }catch(e){}
  /* v10: auth resolves asynchronously at boot. A workout already open under the pre-auth
     (unscoped) key must be carried into the user's scope, not silently replaced by null. */
  const preAuthActive=activeSession;
  activeSession=loadActive();
  if(!activeSession && preAuthActive && (preAuthActive.entries||[]).some(en=>(en.sets||[]).length)){ activeSession=preAuthActive; saveActive(); }
  if(activeSession) viewingLogger=false;
  try{ restState=null; resumeRest(); }catch(e){}      /* v8: rest timer is per-user scoped; re-read under the new key */
  try{ await sb.from("profiles").upsert({ user_id:authUser.id, email:authUser.email, display_name:meta.name, role:meta.role }, { onConflict:"user_id" }); }catch(e){}

/* v14 — a workout can only legitimately have ONE exercise row per order_index (pushWorkoutNow
   writes 0..n-1 exactly once). Extra rows at the same position are copies left by racing pushes
   on an older build. Keep the copy whose sets were written first, drop the rest, and report it so
   the caller can rewrite the workout cleanly. Pure, so it is unit-tested directly. */
function dedupeWorkoutExercises(rows,setByWe){
  const byPos={}; let dropped=0;
  const firstWrite=function(we){ const ss=(setByWe&&setByWe[we.id])||[]; let t=Infinity; ss.forEach(function(s){ const v=Date.parse(s.created_at||""); if(!isNaN(v)&&v<t) t=v; }); return t; };
  (rows||[]).slice().sort((a,b)=>a.order_index-b.order_index).forEach(function(we){
    const k=we.order_index+"|"+we.exercise_slug; const cur=byPos[k];
    if(!cur){ byPos[k]=we; return; }
    dropped++;
    if(firstWrite(we)<firstWrite(cur)) byPos[k]=we; });
  const out=Object.values(byPos).sort((a,b)=>a.order_index-b.order_index);
  return {rows:out, dropped:dropped}; }
/* v17.1 — a workout_exercise can only legitimately hold ONE set row per set_index (pushWorkoutNow
   writes 0..n-1 exactly once, with deterministic child ids). Two rows at the same index are a
   repeated insertion by racing pushes on an older build — deterministic evidence, so they are
   collapsed here (keep the row written first) and the workout is rewritten cleanly. Pure. */
function dedupeSetRows(rows){ const byIdx={}; let dropped=0; const t=function(r){ const v=Date.parse((r&&r.created_at)||""); return isNaN(v)?Infinity:v; };
  (rows||[]).forEach(function(r){ const k=String(r.set_index); const cur=byIdx[k]; if(!cur){ byIdx[k]=r; return; } dropped++; if(t(r)<t(cur)) byIdx[k]=r; });
  return {rows:Object.values(byIdx).sort(function(a,b){ return a.set_index-b.set_index; }), dropped:dropped}; }
async function hydrateFromCloud(){
  if(!cloudReady()||syncing) return; syncing=true;
  try{
    const u=authUser.id;
    const [stR,exR,wR,weR,setR,mR]=await Promise.all([
      sb.from("app_settings").select("data").eq("user_id",u).maybeSingle(),
      sb.from("exercises").select("*").eq("user_id",u),
      sb.from("workouts").select("*").eq("user_id",u).order("performed_at",{ascending:true}),
      sb.from("workout_exercises").select("*").eq("user_id",u),
      sb.from("sets").select("*").eq("user_id",u),
      sb.from("measurements").select("*").eq("user_id",u).order("taken_at",{ascending:true}) ]);
    /* v10 — if ANY of the six reads failed we do not know what the cloud actually holds.
       Rebuilding from a partial picture used to delete the entire local history (a single
       503 on the workouts query was enough). Abort, keep local, retry later. */
    const reads=[stR,exR,wR,weR,setR,mR];
    if(reads.some(r=>r&&r.error)){ syncing=false; try{ recoverFromJournal(); }catch(e){} retryUnsynced(); render(); return; }
    const hasCloud=(wR.data&&wR.data.length)||(exR.data&&exR.data.length)||stR.data;
    if(!hasCloud){ await migrateLocalToCloud(); syncing=false; return; }
    const rb=seed();
    if(stR.data&&stR.data.data){ const d=stR.data.data; rb.settings={...rb.settings,...(d.settings||{})}; if(d.muscles) rb.muscles=d.muscles; }
    /* tombstones are the union of both sides — a delete made anywhere stays deleted everywhere */
    rb.settings.deletedWorkouts={...((S.settings&&S.settings.deletedWorkouts)||{}), ...(rb.settings.deletedWorkouts||{})};
    if(exR.data&&exR.data.length){ const byId={}; exR.data.forEach(r=>byId[r.slug]=r);  // overlay saved prefs onto the full v2 library (keep new exercises)
      rb.exercises.forEach(e=>{ const r=byId[e.id]; if(r){ if(r.pref) e.pref=r.pref; if(r.muscles&&Object.keys(r.muscles).length) e.m=r.muscles; } }); }  // v6: avail+rec stay authoritative from seed
    const weByW={}; (weR.data||[]).forEach(we=>{(weByW[we.workout_id]=weByW[we.workout_id]||[]).push(we);});
    const setByWe={}; (setR.data||[]).forEach(s=>{(setByWe[s.workout_exercise_id]=setByWe[s.workout_exercise_id]||[]).push(s);});
    const repaired=[]; const setRepairs=[];
    rb.sessions=(wR.data||[]).map(w=>{ const dd=dedupeWorkoutExercises(weByW[w.id]||[],setByWe); const wes=dd.rows;
      if(dd.dropped) repaired.push(w.id);
      let setDropped=0;
      const entries=wes.map(we=>{ const ds=dedupeSetRows(setByWe[we.id]||[]);
        if(ds.dropped){ setDropped+=ds.dropped; setRepairs.push({sessionId:w.id, date:w.performed_at, workout:w.title||"Workout", exId:we.exercise_slug, name:(exById(we.exercise_slug)||{}).name||we.exercise_slug,
          k:null, len:ds.rows.length, before:(setByWe[we.id]||[]).length+" set rows", after:ds.rows.length+" sets", evidence:ds.dropped+" cloud set row"+(ds.dropped===1?"":"s")+" shared a set_index with another (repeated insertion) — the earlier-written row kept"}); }
        return { exId:we.exercise_slug, sets:ds.rows.map(s=>({weight:s.weight==null?"":Number(s.weight),reps:s.reps==null?"":s.reps,type:s.is_warmup?"warm":"work",done:!!s.completed})) }; });
      if(setDropped) repaired.push(w.id);
      return { id:w.id, completedAt:w.performed_at, startedAt:w.created_at||w.performed_at, title:w.title, mode:w.mode, synced:!(dd.dropped||setDropped), entries:entries }; });
    if(setRepairs.length){ try{ rb.settings.dqRepairs=(rb.settings.dqRepairs||[]).concat([{at:iso(new Date()),entries:setRepairs.length,items:setRepairs,source:"hydrate"}]).slice(-20); }catch(e){} }
    rb.bodyweight=[]; const snaps={};
    (mR.data||[]).forEach(r=>{ if(r.metric==="bodyweight") rb.bodyweight.push({id:r.id,date:r.taken_at,kg:Number(r.value),synced:true});
      else { (snaps[r.taken_at]=snaps[r.taken_at]||{date:r.taken_at,vals:{},synced:true}); snaps[r.taken_at].vals[r.metric]=Number(r.value); } });
    rb.measurements=Object.values(snaps); rb.photos=S.photos||[];
    /* local bodyweight rows the cloud has not got yet are carried over, not dropped */
    { const bwIds=new Set(rb.bodyweight.map(b=>b.id));
      (S.bodyweight||[]).forEach(b=>{ if(b&&b.id&&!bwIds.has(b.id)) rb.bodyweight.push({...b,synced:false}); });
      rb.bodyweight.sort((a,b)=>new Date(a.date)-new Date(b.date)); }

    /* ------------------------------------------------------------------ v10 SESSION MERGE
       Previously: S was replaced outright by the cloud rebuild, and the only local sessions
       that survived were those whose synced flag was strictly === false. Because pushWorkout
       stamped synced:true even when the write had failed, any workout that did not reach the
       server was deleted from the device on the next launch — permanently, and silently.
       Now the cloud is a peer, not an authority. A completed workout is only ever removed
       from the device by an explicit, tombstoned delete. */
    const tomb=(rb.settings.deletedWorkouts)||{};
    const cloudById={}; rb.sessions.forEach(s=>{ cloudById[s.id]=s; });
    const localById={}; (S.sessions||[]).forEach(s=>{ if(s&&s.id) localById[s.id]=s; });
    const merged=[], needPush=[];
    rb.sessions.forEach(cs=>{
      if(tomb[cs.id]) return;                                  // deleted on purpose elsewhere
      const ls=localById[cs.id];
      if(ls && ls.synced===false){ merged.push(ls); needPush.push(ls); }  // unpushed local edit wins
      else { merged.push(cs); if(cs.synced===false) needPush.push(cs); }   // v14: a de-duplicated cloud copy is rewritten cleanly
    });
    (S.sessions||[]).forEach(ls=>{
      if(!ls||!ls.id||!ls.completedAt) return;
      if(cloudById[ls.id]||tomb[ls.id]) return;
      ls.synced=false; merged.push(ls); needPush.push(ls);      // cloud never had it — keep it and push it
    });
    rb.sessions=normaliseSessions(merged,"hydrate").sort((a,b)=>new Date(a.completedAt)-new Date(b.completedAt));
    if(repaired.length) plog("hydrate.repaired",{ids:repaired.slice(0,10), n:repaired.length});

    S=rb; try{ ensureSetupDefaults(); }catch(e){}   /* v8: keeps cloud-hydrated accounts' machine settings intact */
    try{ rebuildCustomExercises(); }catch(e){}     /* v9: custom exercises ride app_settings, so re-apply them after a rehydrate */
    /* last line of defence: anything the journal has and S does not comes back here */
    try{ const n=recoverFromJournal()+adoptUnscopedJournal(); if(n) (S.sessions||[]).forEach(s=>{ if(s.recovered&&needPush.indexOf(s)<0) needPush.push(s); }); journalBackfill(); }catch(e){}
    persistLocal();
    for(const s of needPush){ await pushWorkout(s,"hydrate"); }
    if(needPush.length) pushSettings();             // tombstones + settings back up
    try{ dqAutoRepair(); }catch(e){}               // v16: exact repeated set blocks from a racing sync
  }catch(e){}
  syncing=false; render();
}

/* ---------------------------------------------------------------- RETRY QUEUE (v10)
   The "N workouts not yet synced · Retry" banner already existed but was unreachable,
   because synced was never left false. Now that failures are honest, back the banner
   with an automatic exponential retry that also fires when connectivity or focus returns. */
let retryTimer=null, retryDelay=8000, retrying=false;
const RETRY_MIN=8000, RETRY_MAX=300000;
function scheduleRetry(){
  if(retryTimer||!cloudReady()) return;
  retryTimer=setTimeout(()=>{ retryTimer=null; retryUnsynced("timer"); }, retryDelay);
  retryDelay=Math.min(retryDelay*2, RETRY_MAX);
}
/* v15 — retryUnsynced() is itself single-flight. It is fired by visibilitychange, focus, online,
   the retry timer and the Retry button, and on a phone several of those fire in the same tick.
   Before v15 each call started its own pushWorkout() pipeline for every unsynced session. */
async function retryUnsynced(source){
  if(!cloudReady()||syncing) return;
  if(retrying){ plog("retry.coalesced",{source:source||"?"}); return; }
  const list=(S.sessions||[]).filter(s=>s&&s.completedAt&&s.synced===false);
  if(!list.length){ retryDelay=RETRY_MIN; return; }
  retrying=true;
  try{
    let allOk=true;
    for(const s of list){ const done=await pushWorkout(s,"retry:"+(source||"?")); if(!done) allOk=false; }
    if(allOk) retryDelay=RETRY_MIN;
  }finally{ retrying=false; }
  render();
}
async function migrateLocalToCloud(){ if(!cloudReady()) return;
  try{ await pushSettings(); await pushAllExercises();
    for(const s of (S.sessions||[])){ if(s.completedAt){ if(!s.id) s.id=uid(); await pushWorkout(s,"migrate"); } }
    await pushAllMeasurements(); persistLocal(); }catch(e){}
  render();
}
function scheduleCloudPush(){ if(!cloudReady()) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushSettings(),1500); }
async function pushSettings(){ if(!cloudReady()) return; try{ await sb.from("app_settings").upsert({ user_id:authUser.id, data:{settings:S.settings,muscles:S.muscles}, updated_at:iso(new Date()) },{onConflict:"user_id"}); }catch(e){} }
function exRow(e){ return { user_id:authUser.id, slug:e.id, name:e.name, type:e.type, equip:e.equip, pref:e.pref, avail:e.avail, rest:e.rest, rep_low:e.rl, rep_high:e.rh, set_low:e.sl, set_high:e.sh, fatigue:e.fatigue, muscles:e.m }; }
async function pushAllExercises(){ if(!cloudReady()) return; try{ await sb.from("exercises").upsert(S.exercises.map(exRow),{onConflict:"user_id,slug"}); }catch(e){} }
async function pushExercisePref(ex){ if(!cloudReady()) return; try{ await sb.from("exercises").upsert(exRow(ex),{onConflict:"user_id,slug"}); }catch(e){} }

/* ============================================================================ PERSISTENCE CORE (v15)
   Incident, 13 Sep 2026: one finished workout reached Supabase with THREE copies of every exercise
   and set. Server logs show three pushWorkout() pipelines starting in the same tick (the Finish push
   had never reached the server from the gym; when the phone came back, visibilitychange + focus +
   the retry timer each called retryUnsynced() for the still-unsynced session). Each pipeline did
   delete → insert with fresh uuids across five HTTP round trips, so the interleaving
   (3× delete, then 3× insert) left three identical copies under one workout id.

   v15 closes the whole class of bug, in layers:
     1. ONE STABLE ID. activeSession.id is minted when the workout starts and is the workout's id
        for life (an edit keeps editingId). Every save of that id is an upsert, never an append.
     2. SINGLE-FLIGHT + DIRTY RE-RUN. Concurrent pushes of the same id coalesce into the one in-flight
        promise; a push requested mid-flight runs once more afterwards with the latest local copy.
     3. ATOMIC SERVER WRITE. save_workout(jsonb) is a Postgres function: advisory-locked per workout
        id, parent upsert + full child replace in ONE transaction, deterministic child ids. It either
        commits the whole workout or nothing. Legacy table writes remain only as a fallback (upsert
        by deterministic id, so still idempotent) if the RPC is ever missing.
     4. DATABASE UNIQUENESS. unique(workout_id, order_index) and unique(workout_exercise_id, set_index)
        mean a duplicate child row cannot exist, whatever any client sends.
     5. FINISH ORDER. journal → local → read-back verification → only then clear the draft → cloud.
        The draft is never deleted before the completed workout is provably on disk.
     6. INTEGRITY ON READ. Sessions are de-duplicated by id and k-fold repeated entries are collapsed
        before any stat is computed (normaliseSessions / dedupeWorkoutExercises).
     7. DIAGNOSTICS. Every attempt is logged (id, attempt, source, insert/update, ms, ok/err, retry)
        to a small ring buffer — Settings › build card › Diagnostics, or IronArcDiag.log(). */

/* ---------------------------------------------------------------- diagnostics ring buffer */
const PLOG_MAX=250;
function plogKey(){ let u=null; try{ u=authUser&&authUser.id; }catch(e){ /* called during boot, before the auth bindings exist */ } return u ? "iron_arc_plog_v1:"+u : "iron_arc_plog_v1"; }
function plogRead(){ try{ const r=localStorage.getItem(plogKey()); const a=r?JSON.parse(r):[]; return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function plogDebug(){ try{ return localStorage.getItem("iron_arc_debug")==="1"; }catch(e){ return false; } }
function plog(evt,fields){
  const rec=Object.assign({t:iso(new Date()), evt:evt}, fields||{});
  try{ const list=plogRead(); list.push(rec); while(list.length>PLOG_MAX) list.shift(); localStorage.setItem(plogKey(), JSON.stringify(list)); }catch(e){}
  if(plogDebug()){ try{ console.debug("[persist] "+evt, rec); }catch(e){} }
  return rec;
}
function plogClear(){ try{ localStorage.removeItem(plogKey()); }catch(e){} }
/* console access without touching the UI: IronArcDiag.log(), .tail(20), .enable(), .clear() */
try{ window.IronArcDiag={ log:plogRead, tail:function(n){ return plogRead().slice(-(n||20)); }, clear:plogClear,
  enable:function(){ try{ localStorage.setItem("iron_arc_debug","1"); }catch(e){} }, disable:function(){ try{ localStorage.removeItem("iron_arc_debug"); }catch(e){} },
  inflight:function(){ return Object.keys(pushInFlight); }, attempts:function(){ return Object.assign({},saveAttempts); } }; }catch(e){}

/* ---------------------------------------------------------------- stable ids for child rows
   Child rows get ids DERIVED from the workout id + position, so the same exercise/set row can only
   ever have one primary key however many times it is written. Kept byte-compatible with the 14 Sep
   hotfix build so already-repaired rows keep their ids. */
function childUuid(base,tag,n){ base=String(base||"");
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(base)) return uid();

/* The one payload both write paths use. Pure: unit-tested directly. */
function workoutPayload(session){
  const exercises=(session.entries||[]).map((en,i)=>{ const ex=exById(en.exId); const weId=childUuid(session.id,"e",i);
    return { id:weId, slug:en.exId, order_index:i, target_sets:(en.sets||[]).length, rep_low:ex?ex.rl:null, rep_high:ex?ex.rh:null,
      sets:(en.sets||[]).map((s,j)=>({ id:childUuid(session.id,"f",i*4096+j), set_index:j,
        weight:(s.weight===""||s.weight==null)?null:Number(s.weight), reps:(s.reps===""||s.reps==null)?null:parseInt(s.reps,10),
        rpe:null, is_warmup:s.type==="warm", completed:isLogged(s) })) }; });
  return { id:session.id, performed_at:session.completedAt||iso(new Date()), title:session.title||null, mode:session.mode||null, client_build:BUILD, exercises:exercises };

/* ---------------------------------------------------------------- single-flight push */
const pushInFlight={}, pushDirty={}, pushedSig={}, saveAttempts={};
function pushSig(session){ return sessionFingerprint(session)+"|"+(session.title||"")+"|"+(session.mode||"")+"|"+(session.completedAt||""); }
let rpcUnavailable=false;
function rpcMissing(err){ const m=String((err&&err.message)||""); const c=String((err&&err.code)||"");
  return c==="PGRST202"||c==="42883"||/could not find the function|schema cache|function [^ ]* does not exist/i.test(m); }
function pushWorkout(session,source){
  if(!session||!session.completedAt) return Promise.resolve(false);
  if(!session.id) session.id=uid();
  const id=session.id; source=source||"unspecified";
  if(pushInFlight[id]){
    /* a retry trigger (focus / visible / online / timer / button) carries no new data — it simply joins
       the in-flight push. Only a real save (finish, edit, hydrate repair) schedules the one re-run. */
    if(!/^retry:/.test(source)) pushDirty[id]=source;
    plog("push.coalesced",{id:id,source:source}); return pushInFlight[id]; }
  const run=async function(){
    let r=await pushWorkoutNow(session,source);
    /* a save requested while we were in flight runs once more ONLY if the latest local copy differs
       from what was just written (an edit landed mid-flight) — never a second concurrent pipeline,
       and never a pointless rewrite of identical data */
    let guard=0;
    while(pushDirty[id]&&guard++<3){ const src=pushDirty[id]; delete pushDirty[id];
      const latest=(S.sessions||[]).find(s=>s&&s.id===id)||session;
      if(pushSig(latest)===pushedSig[id]) break;
      r=await pushWorkoutNow(latest,src+"(rerun)"); }
    delete pushDirty[id]; return r; };
  const p=run().then(function(r){ delete pushInFlight[id]; return r; },function(e){ delete pushInFlight[id]; throw e; });
  pushInFlight[id]=p; return p; }
/* v10 contract kept: resolves true only when the workout is provably in the cloud, in full. */
async function pushWorkoutNow(session,source){
  const id=session.id; const attempt=saveAttempts[id]=(saveAttempts[id]||0)+1; const t0=Date.now();
  journalPut(session);                                    // write-ahead: on disk before we touch the network
  if(!cloudReady()){ if(session.synced!==false){ session.synced=false; persistLocal(); } plog("push.skip",{id:id,attempt:attempt,source:source,why:sb?"signed-out":"no-cloud"}); return false; }
  const payload=workoutPayload(session); pushedSig[id]=pushSig(session);
  const base={ id:id, attempt:attempt, retry:attempt-1, source:source, ex:payload.exercises.length, sets:payload.exercises.reduce((n,e)=>n+e.sets.length,0) };
  plog("push.start",base);
  try{
    let op="rpc", info=null;
    if(!rpcUnavailable && sb && typeof sb.rpc==="function"){
      const r=await sb.rpc("save_workout",{ p:payload });
      if(r&&r.error){
        if(rpcMissing(r.error)){ rpcUnavailable=true; plog("push.rpc-missing",{id:id,err:String(r.error.message||r.error.code)}); }
        else throw new Error(r.error.message||r.error.details||"save_workout failed");
      } else { info=(r&&r.data)||null; op=(info&&info.op)?info.op:"rpc"; }
    }
    if(rpcUnavailable || !sb || typeof sb.rpc!=="function"){ op=await pushWorkoutLegacy(payload); }
    session.synced=true; session.syncedAt=iso(new Date()); delete session.syncError; delete session.recovered;
    persistLocal(); journalPut(session);
    plog("push.ok",Object.assign({},base,{op:op, ms:Date.now()-t0, saves:info&&info.save_count}));
    return true;
  }catch(e){
    session.synced=false; session.syncError=String((e&&e.message)||e);
    persistLocal(); plog("push.fail",Object.assign({},base,{err:session.syncError, ms:Date.now()-t0}));
    scheduleRetry();
    return false;
  }
}
/* Fallback only (RPC absent). Still idempotent: deterministic ids + upsert, and this path is only
   ever entered from the single-flight wrapper, so two pipelines cannot interleave on one client. */
async function pushWorkoutLegacy(p){
  await sbq(sb.from("workouts").upsert({ id:p.id, user_id:authUser.id, performed_at:p.performed_at, title:p.title, mode:p.mode },{onConflict:"id"}));
  const weRows=[], setRows=[];
  p.exercises.forEach(e=>{ weRows.push({ id:e.id, user_id:authUser.id, workout_id:p.id, exercise_slug:e.slug, order_index:e.order_index, target_sets:e.target_sets, rep_low:e.rep_low, rep_high:e.rep_high });
    e.sets.forEach(s=>setRows.push({ id:s.id, user_id:authUser.id, workout_id:p.id, workout_exercise_id:e.id, set_index:s.set_index, weight:s.weight, reps:s.reps, rpe:null, is_warmup:s.is_warmup, completed:s.completed })); });
  await sbq(sb.from("sets").delete().eq("workout_id",p.id));
  await sbq(sb.from("workout_exercises").delete().eq("workout_id",p.id));
  if(weRows.length) await sbq(sb.from("workout_exercises").upsert(weRows,{onConflict:"id"}));
  if(setRows.length) await sbq(sb.from("sets").upsert(setRows,{onConflict:"id"}));
  return "legacy";
}

  try{ await sbq(sb.from("sets").delete().eq("workout_id",id));
       await sbq(sb.from("workout_exercises").delete().eq("workout_id",id));
       await sbq(sb.from("workouts").delete().eq("id",id)); plog("delete.ok",{id:id}); return true; }catch(e){ plog("delete.fail",{id:id,err:String(e&&e.message||e)}); return false; } }
async function pushCheckin(r,wid){ if(!cloudReady()||!r) return; try{ await sb.from("daily_checkins").insert({ user_id:authUser.id, workout_id:wid||null, sleep:r.sleep, energy:r.energy, soreness:r.soreness, motivation:r.motivation, time_available:r.time, avoid:r.avoid||[] }); }catch(e){} }
async function pushMeasurementRow(id,t,metric,value){ if(!cloudReady()) return; try{ await sb.from("measurements").upsert({ id, user_id:authUser.id, taken_at:t, metric, value },{onConflict:"id"}); }catch(e){} }

/* ============================================================================ DATE HELPERS ============================================================================ */
function startOfWeek(d=new Date()){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function iso(d){ return new Date(d).toISOString(); }
function dayKey(d){ const x=new Date(d); return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate(); }
function fmtDate(d){ return new Date(d).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"}); }
function hoursBetween(a,b){ return (new Date(b)-new Date(a))/36e5; }
function fmtAgo(date){ if(!date) return "never"; const h=hoursBetween(date,new Date()); if(h<1) return "just now"; if(h<72) return Math.round(h)+"h ago"; const d=Math.floor(h/24); return d>=7?"over a week ago":d+" days ago"; }
function fmtWhen(date){ const d=new Date(date); const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]; let h=d.getHours(); const ap=h<12?"am":"pm"; h=h%12; if(h===0) h=12; const mm=d.getMinutes(); return wd+" "+h+(mm?":"+String(mm).padStart(2,"0"):"")+ap; }
function lastTrainedStr(m){ const lt=lastTrainedMap()[m]; if(!lt) return "Never trained"; const h=hoursBetween(lt.date,new Date()); return (h<24*6?fmtWhen(lt.date)+" · ":"")+fmtAgo(lt.date); }
/* display-only recovery wording (engine windows unchanged) */
function recoveryDisplay(m){ const st=recoveryStatus(m); const lt=lastTrainedMap()[m];
  if(!lt||st==="untrained") return {label:"Fresh · ready", c:REC_META.untrained.c, st};
  if(st==="overloaded") return {label:"Overloaded", c:REC_META.overloaded.c, st};
  if(st==="recovering") return {label:"Recovering", c:REC_META.recovering.c, st};
  if(st==="caution") return {label:"Caution · nearly ready", c:REC_META.caution.c, st};
  const h=hoursBetween(lt.date,new Date()); if(h<72) return {label:"Ready · recently trained", c:REC_META.ready.c, st};
  return {label:"Fresh · ready", c:REC_META.ready.c, st}; }
function weekSessions(){ const s=startOfWeek(); const e=new Date(s); e.setDate(e.getDate()+7); return completedSessions().filter(x=>new Date(x.completedAt)>=s&&new Date(x.completedAt)<e); }
/* ============================================================================ DERIVED ENGINE ============================================================================ */
/* A set counts when it has weight + reps and isn't a warm-up. No RPE, no separate tick required (P4/P5). */
function isLogged(s){ return s.type!=="warm" && s.weight!=="" && s.weight!=null && s.reps!=="" && s.reps!=null && !isNaN(+s.weight) && !isNaN(+s.reps); }
function workingSets(entry){ return (entry.sets||[]).filter(isLogged); }
function primaryMuscle(ex){ let best=null; for(const [m,c] of Object.entries(ex.m)){ if(!best||c>best.c) best={m,c}; } return best?best.m:null; }

/* ------------------------------------------------------------------ v13 CANONICAL EFFECTIVE SETS
   ONE definition of "effective sets", used by every screen that shows the number:

       effective sets for a muscle = SUM over logged working sets of that muscle's credit
       coefficient for the exercise (1.0 direct, 0.5 indirect, 0.25 minor indirect)

   It is NOT a raw set count, and there is no separate weighting anywhere else in the app.
   The v12 audit finding (see UPDATE_NOTES) was that two Stats cards both said "effective sets"
   while showing DIFFERENT WINDOWS and DIFFERENT GRANULARITY, which is why totals and rankings
   disagreed. The maths was never the problem, so the numbers are unchanged — the labels now
   state the window and the granularity, and both cards route through this one helper.

   effectiveSetsByMuscle(sessions) -> { muscleKey: number }   individual muscles
   effectiveSetsByGroup(sessions)  -> { groupKey:  number }   MUSCLE_GROUPS roll-up of the above

   weeklyVolume() is kept as the historical alias so the recommender, snapshot, Body and every
   existing test keep working against the same function. */
function effectiveSetsByMuscle(sessions){ const list=sessions||weekSessions(); const vol={}; Object.keys(S.muscles).forEach(m=>vol[m]=0);
  list.forEach(sess=>{ (sess.entries||[]).forEach(en=>{ const ex=exById(en.exId); if(!ex) return; const n=workingSets(en).length;
    for(const [m,c] of Object.entries(ex.m)){ if(vol[m]!==undefined) vol[m]+=n*c; } }); }); return vol; }
function effectiveSetsByGroup(sessions){ const out={}; MUSCLE_GROUPS.forEach(function(g){ out[g.key]=0; });
  const vol=effectiveSetsByMuscle(sessions);
  Object.keys(vol).forEach(function(mus){ const g=MUSCLE_TO_GROUP[mus]; if(g!=null&&out[g]!=null) out[g]+=vol[mus]; });
  return out; }
/* historical name — same function, same numbers */
function weeklyVolume(sessions){ return effectiveSetsByMuscle(sessions); }
/* v17 — the same credit sum restricted to one contribution class, for the coverage matrix views:
   total = every credit (identical to effectiveSetsByMuscle), direct = 1.0-credit sets only,
   indirect = the 0.5 and 0.25 credits only. direct + indirect == total, always. */
const COV_VIEWS=[["total","Total"],["direct","Direct"],["indirect","Indirect"]];
function creditInView(c,view){ return view==="direct"?c>=1:view==="indirect"?c<1:true; }
function effectiveSetsByMuscleView(sessions,view){ if(!view||view==="total") return effectiveSetsByMuscle(sessions);
  const list=sessions||weekSessions(); const vol={}; Object.keys(S.muscles).forEach(m=>vol[m]=0);
  list.forEach(sess=>{ (sess.entries||[]).forEach(en=>{ const ex=exById(en.exId); if(!ex) return; const n=workingSets(en).length;
    for(const [m,c] of Object.entries(ex.m)){ if(vol[m]!==undefined&&creditInView(c,view)) vol[m]+=n*c; } }); }); return vol; }

/* P5/P8 — explainable attribution: who contributed to a muscle's number */
function muscleContrib(muscle, sessions){ const list=sessions||weekSessions(); const map={};
  list.forEach(sess=>{ (sess.entries||[]).forEach(en=>{ const ex=exById(en.exId); if(!ex||!ex.m[muscle]) return; const n=workingSets(en).length; if(!n) return;
    const c=ex.m[muscle]; const k=en.exId; if(!map[k]) map[k]={exId:k, name:entryName(en), credit:c, sets:0, effective:0, dates:[]};
    map[k].sets+=n; map[k].effective+=n*c; map[k].dates.push(sess.completedAt); }); });
  const rows=Object.values(map).sort((a,b)=>b.effective-a.effective);
  const direct=rows.filter(r=>r.credit>=1).reduce((s,r)=>s+r.effective,0);
  const secondary=rows.filter(r=>r.credit<1).reduce((s,r)=>s+r.effective,0);
  return { rows, direct, secondary, total:direct+secondary }; }

/* Most-recent hard exposure per muscle: keeps date, max credit, and total working sets
   (volume lengthens recovery a little). Only direct/indirect credit (>=0.5) counts; minor indirect (0.25) does not. */
function lastTrainedMap(){ const map={};
  completedSessions().sort((a,b)=>new Date(a.completedAt)-new Date(b.completedAt)).forEach(sess=>{
    const per={};
    (sess.entries||[]).forEach(en=>{ const ex=exById(en.exId); if(!ex) return; const n=workingSets(en).length; if(!n) return;
      for(const [m,c] of Object.entries(ex.m)){ if(c<0.5) continue; const p=per[m]||(per[m]={credit:0,sets:0}); p.credit=Math.max(p.credit,c); p.sets+=n; } });
    for(const [m,p] of Object.entries(per)) map[m]={date:sess.completedAt, credit:p.credit, sets:p.sets}; });
  return map; }
/* Exact-exercise and movement-pattern recency — drive cooldowns in the recommender. */
function lastExerciseMap(){ const map={};
  completedSessions().forEach(sess=>{ (sess.entries||[]).forEach(en=>{ if(!workingSets(en).length) return;
    const d=sess.completedAt; if(!map[en.exId]||new Date(d)>new Date(map[en.exId].date)) map[en.exId]={date:d}; }); }); return map; }
function lastPatternMap(){ const map={};
  completedSessions().forEach(sess=>{ (sess.entries||[]).forEach(en=>{ const ex=exById(en.exId); if(!ex||!workingSets(en).length) return;
    const d=sess.completedAt; if(!map[ex.pattern]||new Date(d)>new Date(map[ex.pattern].date)) map[ex.pattern]={date:d}; }); }); return map; }

/* LAYER 1 — recovery/training status (drives colour). No RPE: working sets assumed hard.
   Recovery is the gate: a muscle below its block window must NOT be a primary target,
   regardless of weekly-volume need. */
function recWindows(m,lt){ const cfg=S.muscles[m]; const rec=cfg.rec||[cfg.size==="large"?40:24, cfg.size==="large"?64:44];
  const scale=lt.credit>=1?1:0.62;                                   // indirect credit recovers faster
  const volMult=1+Math.max(-0.15,Math.min(0.28,(lt.sets-3)*0.06));   // higher volume → slightly longer
  return { block:rec[0]*scale*volMult, caution:rec[1]*scale*volMult }; }
function recoveryStatus(m){ const lt=lastTrainedMap()[m]; if(!lt) return "untrained";
  const cfg=S.muscles[m]; const vol=weeklyVolume()[m]; const h=hoursBetween(lt.date,new Date());
  const {block,caution}=recWindows(m,lt);
  if(vol>=cfg.cap && h<caution) return "overloaded";
  if(h<block) return "recovering";
  if(h<caution) return "caution";
  return "ready"; }
/* hours until a muscle clears its block window (for "wait ~Xh" copy) */
function readyInHours(m){ const lt=lastTrainedMap()[m]; if(!lt) return 0; const {block}=recWindows(m,lt); return Math.max(0,Math.round(block-hoursBetween(lt.date,new Date()))); }
const REC_META={ untrained:{label:"Untrained",c:"var(--grey)"}, ready:{label:"Ready",c:"var(--green)"}, caution:{label:"Caution",c:"var(--amber)"}, recovering:{label:"Recovering",c:"var(--violet)"}, overloaded:{label:"Overloaded",c:"var(--red)"} };

/* LAYER 2 — goal/volume status (shown as badges) */
function goalStatus(m){ const cfg=S.muscles[m]; const v=weeklyVolume()[m];
  if(v>=cfg.cap) return {label:"Over cap",c:"var(--red)"};
  if(v>=cfg.gh) return {label:"Above target",c:"var(--amber)"};

/* ============================================================================================
   v9 — EXERCISE-LEVEL PROGRESSION MODEL
   Every exercise declares how the number in its weight column relates to getting stronger:

     load:"ext"    (default)  the weight column IS the load. Higher = better.
     load:"assist"            the weight column is MACHINE ASSISTANCE. LOWER = better.
     load:"bw"                the weight column is ADDED load on top of bodyweight (0 = pure
                              bodyweight). Higher = better, and one exercise spans both the
                              bodyweight and the weighted stage.

   Everything downstream — trends, PRs, achievements, charts, recommendations, insights — ranks
   on setLoadScore(), never on the raw number, so the direction is handled in exactly one place
   and no exercise needs a hard-coded exception.

   Effective load = bodyweight − assistance (assist) or bodyweight + added (bw). Bodyweight is
   taken from the nearest logged reading at or before the session, so it tracks changes over
   time. With no bodyweight on record we never fabricate a figure: assisted exercises fall back
   to ranking on negated assistance (still the right direction) and the UI shows the assistance
   trend instead of an effective-load number.
   ============================================================================================ */

function isAssisted(ex){ return loadKind(ex)==="assist"; }

   Returns null when no bodyweight has ever been logged. */

  var list=(S.bodyweight||[]).filter(function(b){ return b&&+b.kg>0&&b.date; })
    .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });

/* Trend states, deliberately conservative:

     stalled     3 sessions inside a 3% band
     stable      everything else \u2014 i.e. normal session-to-session variation

   weaker session reads as variation, not regression. */
/* ---------------------------------------------------------------- v11 TREND METHODOLOGY
   Rewritten around three rules the previous version broke:

   1. ENOUGH HISTORY OR NO VERDICT. Below 5 logged exposures there is no verdict at all — the
      board says "Not enough data" rather than extrapolating from 2 or 3 sessions.
   2. A BIGGER BASELINE. The recent block is the last 2 exposures; the baseline is the 4-6 before
      them (previously only 3). One heavy or light session can no longer swing a verdict.
   3. NO CAUSAL CLAIMS. Performance moves with exercise order, fatigue, sleep, food and what was
      trained beforehand — none of which the app can observe. So the states describe the number,
      not the athlete: "below baseline", never "declining" or "you are losing strength".

   for six weeks cannot sit in "Biggest improvements" describing training you are not doing. */

/* v11 — evidence as NUMBERS, not a sentence. Scannable: two means and a percentage, in the unit

function trendEvidence(exId){

     rather than an "eff" abbreviation nobody should have to decode. */
  const kind=ex?loadKind(ex):"ext";
  const unit=kind==="assist"?(hasBodyweight()?"kg effective load":"strength score")
           :kind==="bw"?(hasBodyweight()?"kg effective load":"kg added"):"kg";
  /* v13 — the compact board repeated "effective load" on every row of every assisted movement:
     four words of noise per row on a phone, restating a fact that never changes. The board now

/* ---------------------------------------------------------------- v11 EXERCISE-ORDER CONTEXT
   Where an exercise sat in the session is recorded in the entry order, so we can surface it as
   context. Doing an exercise 6th when you normally do it 2nd plausibly explains a weaker number
   — but "plausibly" is as far as the data goes, so this is shown as a neutral chip and NEVER
   used to adjust the number. Any mathematical correction would be inventing a coefficient. */
function exerciseOrderStats(exId){
  const pos=[];
  completedSessions().forEach(function(s){
    const ents=(s.entries||[]).filter(function(en){ return workingSets(en).length; });
    const i=ents.findIndex(function(en){ return en.exId===exId; });
    if(i>=0) pos.push({date:s.completedAt, idx:i+1, of:ents.length});

  pos.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  return pos; }

  const pos=exerciseOrderStats(exId);
  if(pos.length<4) return null;
  const recent=pos.slice(0,TREND_RECENT_N), older=pos.slice(TREND_RECENT_N);
  if(!older.length) return null;
  const mean=function(a){ return a.reduce(function(x,y){ return x+y.idx; },0)/a.length; };
  const rm=mean(recent), om=mean(older);
  /* v13 BUGFIX — this used to hard-code "th", so a 2nd-vs-3rd comparison rendered as
     "2th vs 3th". The direction logic was already correct and is unchanged: a HIGHER mean
     index means the exercise now sits LATER in the session (5th vs a usual 2nd = later),
     a LOWER mean index means EARLIER (2nd vs a usual 3rd = earlier). Still purely contextual —
     no number is adjusted for it anywhere. */

    text:"Performed later than usual · "+ordinal(r)+" vs "+ordinal(o)};

  return v+({1:"st",2:"nd",3:"rd"}[v%10]||"th"); }

  if(d.state==="below") return "Next time: hold "+(p.weight===""?"the same load":p.weight+"kg")+" and rebuild the reps before adding load.";
  if(d.state==="steady") return p.note||"Change one variable next time — load or reps.";

const TREND_META={

  above:{label:"Above baseline", c:"var(--green)", icon:"\u25b2", note:"Recent exposures are averaging above the block before them."},
  steady:{label:"In line", c:"var(--accent)", icon:"\u25ac", note:"Recent exposures are in line with the block before them."},
  below:{label:"Below baseline", c:"var(--red)", icon:"\u25bc", note:"Recent exposures are averaging below the block before them. Performance moves with order, fatigue, sleep and recovery \u2014 this is the number, not a diagnosis."},
  stale:{label:"Not recently trained", c:"var(--muted)", icon:"\u25cb", note:"No exposure inside the last "+TREND_STALE_DAYS+" days, so this is history rather than current training."}

  const m=TREND_META[key]||TREND_META.insufficient;
  let note=m.note;
  if(key==="above"&&isAssisted(d.ex)) note="Assistance is coming down against your baseline \u2014 that is the right direction.";
  if(key==="below"&&isAssisted(d.ex)) note="More assistance than your baseline block. Order, fatigue and recovery all move this number.";
