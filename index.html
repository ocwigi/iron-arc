<!doctype html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Iron Arc — Training Command</title>
<meta name="theme-color" content="#06080B" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0B0F15; --panel:#161D27; --panel2:#1E2733; --line:#28323F; --line2:#34404E;
  --text:#F4F7FB; --muted:#94A0AE; --faint:#5E6976;
  --accent:#3B82F6; --accent-ink:#FFFFFF; --hot:#FF8A4C;
  --grey:#3A4654; --green:#34C759; --amber:#FF9F0A; --red:#FF5A52; --blue:#5AC8FA; --gold:#E0A53C; --violet:#BF7AF0;
  --r:18px; --rs:12px; --ui:'Inter'; --display:'Sora';
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 18px 40px -26px rgba(0,0,0,.8);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:var(--ui),system-ui,sans-serif; font-size:15px; line-height:1.5; padding-bottom:86px;
}
.mono{font-family:'JetBrains Mono',monospace;}
.app{max-width:520px; margin:0 auto; padding:0 16px; position:relative; z-index:1;}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.015em; font-family:var(--display),var(--ui),sans-serif;}
button{font-family:inherit; cursor:pointer; border:none; color:inherit;}
.muted{color:var(--muted);} .tiny{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
.top{display:flex; align-items:center; justify-content:space-between; padding:18px 0 8px;}
.brand{display:flex; align-items:center; gap:10px; font-weight:800;}
.brand .dot{width:11px; height:11px; border-radius:3px; background:var(--accent);}
.brand small{display:block; font-weight:500; font-size:10px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase;}
.modepill{font-size:11px; font-weight:600; padding:6px 11px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:var(--panel2);}
.weekstrip{display:flex; gap:6px; margin:10px 0 4px;}
.day{flex:1; text-align:center; padding:9px 0 8px; border-radius:var(--rs); background:var(--panel); border:1px solid var(--line);}
.day b{display:block; font-size:11px; color:var(--muted);} .day .pip{margin:5px auto 0; width:9px; height:9px; border-radius:50%; background:var(--grey);}
.day.done .pip{background:var(--green);} .day.today{border-color:var(--accent); background:rgba(59,130,246,.08);} .day.today b{color:var(--accent);}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:12px 0;}
.card{box-shadow:var(--shadow);} .card.glow{border-color:var(--line2); background:linear-gradient(180deg,var(--panel2),var(--panel));}
.cta{width:100%; padding:17px; border-radius:14px; font-family:var(--display); font-weight:800; font-size:16px; color:var(--accent-ink); background:var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;}
.cta:active{transform:translateY(1px);} .cta .sub{display:block; font-size:11px; font-weight:600; letter-spacing:.06em; opacity:.7; text-transform:uppercase;}
.cta.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--line); box-shadow:none; font-size:14px; font-weight:600; padding:14px; font-family:var(--ui);}
.btn{padding:11px 14px; border-radius:var(--rs); background:var(--panel2); border:1px solid var(--line); font-weight:600; font-size:14px;}
.btn.accent{background:var(--accent); color:var(--accent-ink); border-color:transparent;} .btn.ghost{background:transparent;}
.btn.sm{padding:7px 10px; font-size:12px;} .btn.full{width:100%;} .btn.danger{color:var(--red); border-color:rgba(255,77,109,.3);}
.row{display:flex; gap:8px;} .row.wrap{flex-wrap:wrap;}
.resume{background:linear-gradient(135deg,rgba(255,106,61,.16),rgba(255,106,61,.05)); border:1px solid rgba(255,106,61,.5);}
.exline{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-top:1px solid var(--line);} .exline:first-child{border-top:none;}
.exline .nm{font-weight:600;} .exline .meta{font-size:12px; color:var(--muted);}
.sets{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text); background:var(--panel2); border:1px solid var(--line); padding:3px 9px; border-radius:8px; white-space:nowrap;}
.tag{display:inline-block; font-size:10px; padding:2px 7px; border-radius:6px; background:var(--panel2); color:var(--muted); margin-left:6px;}
.tag.love{color:var(--gold);} .tag.avoid{color:var(--red);}
.logex{margin:12px 0;} .logex .hd{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;} .logex .hd .nm{font-weight:700; font-size:16px;}
.exacts{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.exacts button{font-size:11px; padding:6px 9px; border-radius:8px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); display:flex; align-items:center; gap:4px;}
.exacts button.swap{color:var(--accent);} .exacts button.rm{color:var(--red);}
.histline{font-size:12px; color:var(--muted); margin-top:3px;} .histline b{color:#AEB9C7; font-weight:600;} .target{color:var(--accent); font-weight:600;}
.setgrid{margin-top:11px;}
.sethead,.setrow{display:grid; grid-template-columns:24px 42px 1fr 1fr 52px; gap:7px; align-items:center;}
.setrow.cur{background:rgba(59,130,246,.10); border-radius:12px; box-shadow:inset 0 0 0 1px rgba(59,130,246,.28); padding:5px 6px; margin:7px -6px 0;}
.prevc{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--faint); text-align:center; white-space:nowrap; overflow:hidden;}
.sethead{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin-bottom:5px; padding:0 2px;}
.setrow{margin-bottom:7px;} .setrow .sn{cursor:pointer; -webkit-user-select:none; user-select:none; font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:13px; text-align:center;}
.setrow.warm .sn{color:var(--amber);}
.inp{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:9px; color:var(--text); padding:11px 8px; font-family:'JetBrains Mono',monospace; font-size:16px; text-align:center;}
.inp:focus{outline:none; border-color:var(--accent);}
.chk{width:52px; height:48px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--faint);}
.chk.on{background:var(--green); border-color:transparent; color:#04190E;}
.wbtn{width:38px; height:40px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); color:var(--faint); font-size:11px; font-weight:700;}
.wbtn.on{color:var(--amber); border-color:var(--amber);}
.win{display:inline-flex; gap:6px; flex-wrap:wrap; margin-top:9px;}
.badge{font-size:10.5px; padding:4px 9px; border-radius:999px; font-weight:700;}
.badge.pr{background:var(--gold); color:#241B02;} .badge.beat{background:rgba(47,210,122,.16); color:var(--green); border:1px solid rgba(47,210,122,.4);}
.badge.warnb{background:rgba(255,77,109,.14); color:var(--red); border:1px solid rgba(255,77,109,.35);}
.rest{position:fixed; left:0; right:0; bottom:86px; z-index:40; display:flex; justify-content:center; pointer-events:none;}
.rest .pill{pointer-events:auto; background:var(--panel2); border:1px solid var(--accent); border-radius:999px; padding:10px 14px; display:flex; align-items:center; gap:12px; box-shadow:0 10px 30px rgba(0,0,0,.5);}
.rest .t{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--accent); min-width:62px; text-align:center;}
.rest button{background:transparent; color:var(--muted); font-size:13px; padding:4px 8px;}
.sheet-wrap{position:fixed; inset:0; z-index:60; background:rgba(2,4,7,.7); display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:var(--panel); border:1px solid var(--line); border-radius:20px 20px 0 0; width:100%; max-width:520px; max-height:85vh; overflow-y:auto; padding:18px 16px calc(20px + env(safe-area-inset-bottom));}
.sheet .grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 12px;}
.opt{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--panel2);}
.opt .nm{font-weight:600;} .opt .meta{font-size:11.5px; color:var(--muted);}
.mgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
.mcard{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:11px; cursor:pointer; position:relative; overflow:hidden;}
.mcard{padding:0;} .mcard .bartop{position:absolute; top:0; left:0; right:0; height:4px;} .mcard .mbody{padding:13px;}
.mcard .mlabel{font-weight:600; font-size:13.5px; margin-top:3px;}
.mcard .stat{font-family:'JetBrains Mono',monospace; font-size:18px; margin-top:4px;}
.mcard .gb{font-size:9px; padding:2px 6px; border-radius:5px; margin-top:6px; display:inline-block; font-weight:700;}
.statuspill{font-size:10px; padding:3px 8px; border-radius:999px; font-weight:700; white-space:nowrap;}
.bar{height:7px; border-radius:4px; background:var(--panel2); overflow:hidden; position:relative; margin-top:5px;} .bar i{display:block; height:100%; border-radius:4px;} .bar .capmark{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--faint);}
.kpi{display:flex; gap:10px;} .kpi .k{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:var(--rs); padding:12px; text-align:center; cursor:pointer;}
.kpi .k b{display:block; font-family:'JetBrains Mono',monospace; font-size:24px; color:var(--accent);} .kpi .k span{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:50; background:rgba(8,11,15,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line);}
.tabbar .inner{max-width:520px; margin:0 auto; display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.tab{flex:1; background:transparent; padding:7px 0; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10px;}
.tab svg{width:22px; height:22px;} .tab.on{color:var(--accent);}
.empty{text-align:center; color:var(--muted); padding:26px 10px; font-size:14px;}
.reveal{animation:rise .45s both;} @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.divider{height:1px; background:var(--line); margin:14px 0;} hr.sub{border:none; border-top:1px dashed var(--line); margin:14px 0;}
.note{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:9px; color:var(--text); padding:9px; font-family:inherit; font-size:13px; resize:vertical;}
.quote{font-style:italic; color:#AEB9C7; font-size:13.5px;} .scale{display:flex; gap:6px;}
.scale button{flex:1; padding:10px 0; border-radius:9px; background:var(--panel2); border:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-weight:700;}
.scale button.on{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.field{margin:13px 0;} .field label{display:block; font-size:13px; margin-bottom:7px; color:#C6D0DC;}
.contrib{display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px dashed var(--line); font-size:13px;}
.contrib:first-child{border-top:none;} .contrib .c-ef{font-family:'JetBrains Mono',monospace; color:var(--accent);}
.seg{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px;}
.seg button{flex:1; padding:8px; border-radius:8px; background:transparent; font-size:12px; font-weight:600; color:var(--muted);}
.seg button.on{background:var(--accent); color:var(--accent-ink);}
.seg.mini button{padding:6px 4px; font-size:11px;}
.srch{width:100%;}
.recgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
.recgrid .rc{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
.recgrid .rc span{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.recgrid .rc b{display:block; font-family:'JetBrains Mono',monospace; font-size:20px; color:var(--accent); margin-top:2px;}
.recgrid .rc b i{font-style:normal; font-size:12px; color:var(--muted);}
.recgrid .rc small{display:block; font-size:10px; color:var(--faint); margin-top:2px;}
.chartwrap{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 8px 4px; margin-top:8px;}
.badge.rm5{background:var(--accent); color:var(--accent-ink);}
.badge.rm10{background:rgba(91,140,255,.18); color:var(--blue); border:1px solid rgba(91,140,255,.4);}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 6px; -webkit-overflow-scrolling:touch;}
.chips button{white-space:nowrap; font-size:12px; padding:7px 11px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-weight:600;}
.chips button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.achrow{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-top:1px dashed var(--line);}
.achrow:first-child{border-top:none;}
.achrow .am{font-size:12.5px; font-weight:600;} .achrow .ad{font-size:11px; color:var(--muted); margin-top:2px;}
/* --- live logger v3 (Fable polish) --- */
.lhead{position:sticky; top:0; z-index:30; background:linear-gradient(180deg,var(--panel),rgba(14,18,24,.94)); border:1px solid var(--line); border-radius:var(--r); padding:13px 16px; margin:12px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; backdrop-filter:blur(8px);}
.lhead .ttl{font-weight:700; font-size:16px; letter-spacing:-.01em;}
.lhead .meta{font-size:12px; color:var(--muted); margin-top:2px;}
.lhead .clk{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--accent); text-align:right; line-height:1;}
.lhead .prog{font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:right; margin-top:3px;}
.collapsed{display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer;}
.collapsed .smry{font-size:12px; color:var(--accent); margin-top:3px; font-family:'JetBrains Mono',monospace;}
.exmenu{display:flex; gap:6px; align-items:center;}
.exmenu .swap{font-size:12px; padding:8px 11px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); color:var(--accent); font-weight:600;}
.exmenu .more{width:38px; height:38px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-size:18px; line-height:1;}
.recwarn{font-size:11.5px; color:var(--amber); background:rgba(255,194,61,.10); border:1px solid rgba(255,194,61,.3); border-radius:9px; padding:7px 10px; margin:8px 0 2px;}
.inp.ghosted::placeholder{color:var(--accent); opacity:.5; font-weight:600;}
.stickfin{position:fixed; left:0; right:0; bottom:86px; z-index:45; display:flex; justify-content:center; pointer-events:none; padding:0 16px;}
.stickfin .b{pointer-events:auto; width:100%; max-width:488px; padding:15px; border-radius:14px; font-weight:800; font-size:16px; color:var(--accent-ink); background:var(--accent); box-shadow:0 10px 30px -10px rgba(0,0,0,.6);}
.stickfin .b:active{transform:translateY(1px);}
/* --- Insights v5 --- */
.icard{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:12px; padding:12px 14px; margin:10px 0;}
.icard.tap{cursor:pointer;}
.icard .ihd{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.ibadge{font-size:9px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap;}
.imetric{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; white-space:nowrap;}
.ititle{font-weight:700; font-size:14px; margin-top:7px; letter-spacing:-.01em;}
.ibody{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.5;}
.ibody b{color:#AEB9C7;}
.momwrap{display:flex; align-items:center; gap:15px;}
.momring{width:76px; height:76px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
.momring .inner{width:62px; height:62px; border-radius:50%; background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;}
.spark{display:flex; align-items:flex-end; gap:3px; height:30px; margin-top:8px;}
.spark i{flex:1; min-height:2px; background:var(--grey); border-radius:2px 2px 0 0; display:block;}
.spark i.cur{background:var(--accent);}
.scorechips{display:flex; gap:8px; margin-top:10px;}
.scorechips .sc{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 6px; text-align:center;}
.scorechips .sc b{display:block; font-family:'JetBrains Mono',monospace; font-size:18px;}
.scorechips .sc span{font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
/* v8 library filter chips (Add / Swap / Exercise management) */
.fchips{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:7px 0 2px; margin:0 -2px; scrollbar-width:none;}
.fchips::-webkit-scrollbar{display:none;}
.fchip{flex:none; white-space:nowrap; font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:999px;
  background:var(--panel); border:1px solid var(--line); color:var(--muted);}
.fchip.on{border-color:var(--accent); color:var(--accent); background:rgba(59,130,246,.12);}
@media (min-width:560px){ .fchips{flex-wrap:wrap; overflow:visible;} }
/* v8 exercise setup / machine settings strip */
.setupline{display:flex; align-items:flex-start; gap:8px; width:100%; text-align:left; margin:8px 0 2px; padding:8px 10px; border-radius:10px;
  background:rgba(212,175,55,.07); border:1px solid rgba(212,175,55,.28); color:var(--gold); cursor:pointer;}
.setupline .ic{font-size:13px; line-height:1.35;}
.setupline .bd{flex:1; min-width:0;}
.setupline .lb{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:700;}
.setupline .vl{font-size:12.5px; color:#D8D2C0; margin-top:2px; word-break:break-word; line-height:1.4;}
.setupline .ed{font-size:11px; color:var(--muted); flex:none; align-self:center;}
.setupline.empty2{background:transparent; border-style:dashed; border-color:var(--line);}
.setupline.empty2 .lb, .setupline.empty2 .ic{color:var(--muted);}
.setupchips{display:flex; flex-wrap:wrap; gap:4px; margin-top:3px;}
.setupchips span{font-size:11px; padding:2px 7px; border-radius:999px; background:rgba(212,175,55,.13); color:#E2D9BE;}
/* prominent rest timer (item 2) */
.restcard{pointer-events:auto; width:100%; max-width:488px; margin:0 16px; background:var(--panel2); border:1px solid var(--accent); border-radius:14px; padding:12px 14px; box-shadow:0 14px 40px rgba(0,0,0,.6);}
.rest.done .restcard{border-color:var(--green); background:linear-gradient(135deg,rgba(47,210,122,.24),rgba(47,210,122,.06)); animation:restpulse .6s ease-in-out 3;}
@keyframes restpulse{0%,100%{box-shadow:0 0 0 0 rgba(47,210,122,.55);}50%{box-shadow:0 0 0 7px rgba(47,210,122,0);}}
.restbar{height:6px; border-radius:3px; background:var(--panel); overflow:hidden; margin-bottom:9px;}
.restbar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width 1s linear;}
.rest.done .restbar i{background:var(--green);}
.restrow{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.resttitle{font-weight:700; font-size:14.5px;} .restmeta{font-size:12px; color:var(--muted); margin-top:2px;}
.restt{font-family:'JetBrains Mono',monospace; font-size:27px; font-weight:700; color:var(--accent); min-width:76px; text-align:right; line-height:1;}
.restctl{display:flex; gap:8px; margin-top:10px;}
.restctl button{flex:1; padding:8px; border-radius:9px; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-size:12px; font-weight:600;}

/* ===== v9 additions ===== */
.gchips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.gchip{font-size:12px; padding:7px 11px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-weight:600;}
.gchip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.opt.customadd{border-style:dashed; border-color:rgba(224,165,60,.5); background:rgba(224,165,60,.07);}
/* trend badge — one consistent visual language for progression vs variation vs decline */

  catch(e){ /* under quota, keep the most recent 120 sessions — recent data is what is at risk */

function journalPut(sess){

  let rec; try{ rec=JSON.parse(JSON.stringify(sess)); }catch(e){ return; }
  const list=journalRead(); const i=list.findIndex(x=>x&&x.id===rec.id);
  if(i>=0) list[i]=rec; else list.push(rec);

      sb.from("exercises").select("*").eq("user_id",u),
      sb.from("workouts").select("*").eq("user_id",u).order("performed_at",{ascending:true}),
      sb.from("workout_exercises").select("*").eq("user_id",u),

      sb.from("measurements").select("*").eq("user_id",u).order("taken_at",{ascending:true}) ]);

    const hasCloud=(wR.data&&wR.data.length)||(exR.data&&exR.data.length)||stR.data;
    if(!hasCloud){ await migrateLocalToCloud(); syncing=false; return; }
    const rb=seed();
    if(stR.data&&stR.data.data){ const d=stR.data.data; rb.settings={...rb.settings,...(d.settings||{})}; if(d.muscles) rb.muscles=d.muscles; }
    /* tombstones are the union of both sides — a delete made anywhere stays deleted everywhere */
    rb.settings.deletedWorkouts={...((S.settings&&S.settings.deletedWorkouts)||{}), ...(rb.settings.deletedWorkouts||{})};
    if(exR.data&&exR.data.length){ const byId={}; exR.data.forEach(r=>byId[r.slug]=r);  // overlay saved prefs onto the full v2 library (keep new exercises)
      rb.exercises.forEach(e=>{ const r=byId[e.id]; if(r){ if(r.pref) e.pref=r.pref; if(r.muscles&&Object.keys(r.muscles).length) e.m=r.muscles; } }); }  // v6: avail+rec stay authoritative from seed
    const weByW={}; (weR.data||[]).forEach(we=>{(weByW[we.workout_id]=weByW[we.workout_id]||[]).push(we);});
    const setByWe={}; (setR.data||[]).forEach(s=>{(setByWe[s.workout_exercise_id]=setByWe[s.workout_exercise_id]||[]).push(s);});
    rb.sessions=(wR.data||[]).map(w=>{ const wes=(weByW[w.id]||[]).sort((a,b)=>a.order_index-b.order_index);
      return { id:w.id, completedAt:w.performed_at, startedAt:w.created_at||w.performed_at, title:w.title, mode:w.mode, synced:true,
        entries:wes.map(we=>({ exId:we.exercise_slug, sets:(setByWe[we.id]||[]).sort((a,b)=>a.set_index-b.set_index).map(s=>({weight:s.weight==null?"":Number(s.weight),reps:s.reps==null?"":s.reps,type:s.is_warmup?"warm":"work",done:!!s.completed})) })) }; });
    rb.bodyweight=[]; const snaps={};
    (mR.data||[]).forEach(r=>{ if(r.metric==="bodyweight") rb.bodyweight.push({id:r.id,date:r.taken_at,kg:Number(r.value),synced:true});
      else { (snaps[r.taken_at]=snaps[r.taken_at]||{date:r.taken_at,vals:{},synced:true}); snaps[r.taken_at].vals[r.metric]=Number(r.value); } });
    rb.measurements=Object.values(snaps); rb.photos=S.photos||[];
    /* local bodyweight rows the cloud has not got yet are carried over, not dropped */
    { const bwIds=new Set(rb.bodyweight.map(b=>b.id));
      (S.bodyweight||[]).forEach(b=>{ if(b&&b.id&&!bwIds.has(b.id)) rb.bodyweight.push({...b,synced:false}); });
      rb.bodyweight.sort((a,b)=>new Date(a.date)-new Date(b.date)); }

    /* ------------------------------------------------------------------ v10 SESSION MERGE
       Previously: S was replaced outright by the cloud rebuild, and the only local sessions
       that survived were those whose synced flag was strictly === false. Because pushWorkout
       stamped synced:true even when the write had failed, any workout that did not reach the
       server was deleted from the device on the next launch — permanently, and silently.
       Now the cloud is a peer, not an authority. A completed workout is only ever removed
       from the device by an explicit, tombstoned delete. */
    const tomb=(rb.settings.deletedWorkouts)||{};
    const cloudById={}; rb.sessions.forEach(s=>{ cloudById[s.id]=s; });
    const localById={}; (S.sessions||[]).forEach(s=>{ if(s&&s.id) localById[s.id]=s; });
    const merged=[], needPush=[];
    rb.sessions.forEach(cs=>{
      if(tomb[cs.id]) return;                                  // deleted on purpose elsewhere
      const ls=localById[cs.id];
      if(ls && ls.synced===false){ merged.push(ls); needPush.push(ls); }  // unpushed local edit wins
      else merged.push(cs);
    });
    (S.sessions||[]).forEach(ls=>{
      if(!ls||!ls.id||!ls.completedAt) return;
      if(cloudById[ls.id]||tomb[ls.id]) return;
      ls.synced=false; merged.push(ls); needPush.push(ls);      // cloud never had it — keep it and push it
    });
    rb.sessions=merged.sort((a,b)=>new Date(a.completedAt)-new Date(b.completedAt));

    S=rb; try{ ensureSetupDefaults(); }catch(e){}   /* v8: keeps cloud-hydrated accounts' machine settings intact */
    try{ rebuildCustomExercises(); }catch(e){}     /* v9: custom exercises ride app_settings, so re-apply them after a rehydrate */
    /* last line of defence: anything the journal has and S does not comes back here */
    try{ const n=recoverFromJournal(); if(n) (S.sessions||[]).forEach(s=>{ if(s.recovered&&needPush.indexOf(s)<0) needPush.push(s); }); }catch(e){}
    persistLocal();
    for(const s of needPush){ await pushWorkout(s); }
    if(needPush.length) pushSettings();             // tombstones + settings back up
  }catch(e){}
  syncing=false; render();
}

/* ---------------------------------------------------------------- RETRY QUEUE (v10)
   The "N workouts not yet synced · Retry" banner already existed but was unreachable,
   because synced was never left false. Now that failures are honest, back the banner
   with an automatic exponential retry that also fires when connectivity or focus returns. */
let retryTimer=null, retryDelay=8000;
const RETRY_MIN=8000, RETRY_MAX=300000;
function scheduleRetry(){
  if(retryTimer||!cloudReady()) return;
  retryTimer=setTimeout(()=>{ retryTimer=null; retryUnsynced(); }, retryDelay);
  retryDelay=Math.min(retryDelay*2, RETRY_MAX);
}
async function retryUnsynced(){
  if(!cloudReady()||syncing) return;
  const list=(S.sessions||[]).filter(s=>s&&s.completedAt&&s.synced===false);
  if(!list.length){ retryDelay=RETRY_MIN; return; }
  let allOk=true;
  for(const s of list){ const done=await pushWorkout(s); if(!done) allOk=false; }
  if(allOk) retryDelay=RETRY_MIN;
  render();
}
async function migrateLocalToCloud(){ if(!cloudReady()) return;
  try{ await pushSettings(); await pushAllExercises();
    for(const s of (S.sessions||[])){ if(s.completedAt){ if(!s.id) s.id=uid(); await pushWorkout(s); } }
    await pushAllMeasurements(); persistLocal(); }catch(e){}
  render();
}
function scheduleCloudPush(){ if(!cloudReady()) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushSettings(),1500); }
async function pushSettings(){ if(!cloudReady()) return; try{ await sb.from("app_settings").upsert({ user_id:authUser.id, data:{settings:S.settings,muscles:S.muscles}, updated_at:iso(new Date()) },{onConflict:"user_id"}); }catch(e){} }
function exRow(e){ return { user_id:authUser.id, slug:e.id, name:e.name, type:e.type, equip:e.equip, pref:e.pref, avail:e.avail, rest:e.rest, rep_low:e.rl, rep_high:e.rh, set_low:e.sl, set_high:e.sh, fatigue:e.fatigue, muscles:e.m }; }
async function pushAllExercises(){ if(!cloudReady()) return; try{ await sb.from("exercises").upsert(S.exercises.map(exRow),{onConflict:"user_id,slug"}); }catch(e){} }
async function pushExercisePref(ex){ if(!cloudReady()) return; try{ await sb.from("exercises").upsert(exRow(ex),{onConflict:"user_id,slug"}); }catch(e){} }
/* v10 — returns true only when the workout is provably in the cloud, in full.
   Every call is error-checked (see sbq). The device copy and the journal are the source
   of truth until the server confirms; a failure marks the session unsynced and queues a
   retry instead of pretending the write worked. */
async function pushWorkout(session){
  if(!session||!session.completedAt) return false;
  if(!session.id) session.id=uid();
  journalPut(session);                                    // write-ahead: on disk before we touch the network
  if(!cloudReady()){ if(session.synced!==false){ session.synced=false; persistLocal(); } return false; }
  try{
    await sbq(sb.from("workouts").upsert({ id:session.id, user_id:authUser.id, performed_at:session.completedAt||iso(new Date()), title:session.title||null, mode:session.mode||null },{onConflict:"id"}));
    const weRows=[], setRows=[];
    (session.entries||[]).forEach((en,i)=>{ const ex=exById(en.exId); const weId=uid();
      weRows.push({ id:weId, user_id:authUser.id, workout_id:session.id, exercise_slug:en.exId, order_index:i, target_sets:en.sets.length, rep_low:ex?ex.rl:null, rep_high:ex?ex.rh:null });
      en.sets.forEach((s,j)=>setRows.push({ id:uid(), user_id:authUser.id, workout_id:session.id, workout_exercise_id:weId, set_index:j,
        weight:(s.weight===""||s.weight==null)?null:Number(s.weight), reps:(s.reps===""||s.reps==null)?null:parseInt(s.reps,10), rpe:null, is_warmup:s.type==="warm", completed:isLogged(s) })); });
    /* children before parents-of-children: deleting sets first is correct whether or not
       the FK cascades, and avoids leaving orphan set rows behind on a rewrite */
    await sbq(sb.from("sets").delete().eq("workout_id",session.id));
    await sbq(sb.from("workout_exercises").delete().eq("workout_id",session.id));
    if(weRows.length) await sbq(sb.from("workout_exercises").insert(weRows));
    if(setRows.length) await sbq(sb.from("sets").insert(setRows));
    session.synced=true; delete session.syncError; delete session.recovered;
    persistLocal(); journalPut(session);
    return true;
  }catch(e){
    session.synced=false; session.syncError=String((e&&e.message)||e);
    persistLocal(); scheduleRetry();
    return false;
  }
}
async function deleteWorkoutCloud(id){ if(!cloudReady()) return false;
  try{ await sbq(sb.from("sets").delete().eq("workout_id",id));
       await sbq(sb.from("workout_exercises").delete().eq("workout_id",id));
       await sbq(sb.from("workouts").delete().eq("id",id)); return true; }catch(e){ return false; } }
async function pushCheckin(r,wid){ if(!cloudReady()||!r) return; try{ await sb.from("daily_checkins").insert({ user_id:authUser.id, workout_id:wid||null, sleep:r.sleep, energy:r.energy, soreness:r.soreness, motivation:r.motivation, time_available:r.time, avoid:r.avoid||[] }); }catch(e){} }
async function pushMeasurementRow(id,t,metric,value){ if(!cloudReady()) return; try{ await sb.from("measurements").upsert({ id, user_id:authUser.id, taken_at:t, metric, value },{onConflict:"id"}); }catch(e){} }
async function pushAllMeasurements(){ if(!cloudReady()) return;
  for(const b of (S.bodyweight||[])){ if(!b.id) b.id=uid(); await pushMeasurementRow(b.id,b.date,"bodyweight",b.kg); }
  for(const m of (S.measurements||[])){ for(const [k,v] of Object.entries(m.vals||{})) await pushMeasurementRow(uid(),m.date,k,v); } }

/* ============================================================================ DATE HELPERS ============================================================================ */
function startOfWeek(d=new Date()){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function iso(d){ return new Date(d).toISOString(); }
function dayKey(d){ const x=new Date(d); return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate(); }
function fmtDate(d){ return new Date(d).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"}); }
function hoursBetween(a,b){ return (new Date(b)-new Date(a))/36e5; }
function fmtAgo(date){ if(!date) return "never"; const h=hoursBetween(date,new Date()); if(h<1) return "just now"; if(h<72) return Math.round(h)+"h ago"; const d=Math.floor(h/24); return d>=7?"over a week ago":d+" days ago"; }
function fmtWhen(date){ const d=new Date(date); const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]; let h=d.getHours(); const ap=h<12?"am":"pm"; h=h%12; if(h===0) h=12; const mm=d.getMinutes(); return wd+" "+h+(mm?":"+String(mm).padStart(2,"0"):"")+ap; }
function lastTrainedStr(m){ const lt=lastTrainedMap()[m]; if(!lt) return "Never trained"; const h=hoursBetween(lt.date,new Date()); return (h<24*6?fmtWhen(lt.date)+" · ":"")+fmtAgo(lt.date); }
/* display-only recovery wording (engine windows unchanged) */
function recoveryDisplay(m){ const st=recoveryStatus(m); const lt=lastTrainedMap()[m];
  if(!lt||st==="untrained") return {label:"Fresh · ready", c:REC_META.untrained.c, st};
  if(st==="overloaded") return {label:"Overloaded", c:REC_META.overloaded.c, st};
  if(st==="recovering") return {label:"Recovering", c:REC_META.recovering.c, st};
  if(st==="caution") return {label:"Caution · nearly ready", c:REC_META.caution.c, st};
  const h=hoursBetween(lt.date,new Date()); if(h<72) return {label:"Ready · recently trained", c:REC_META.ready.c, st};
  return {label:"Fresh · ready", c:REC_META.ready.c, st}; }
function weekSessions(){ const s=startOfWeek(); const e=new Date(s); e.setDate(e.getDate()+7); return S.sessions.filter(x=>x.completedAt&&new Date(x.completedAt)>=s&&new Date(x.completedAt)<e); }
/* ============================================================================ DERIVED ENGINE ============================================================================ */
/* A set counts when it has weight + reps and isn't a warm-up. No RPE, no separate tick required (P4/P5). */
function isLogged(s){ return s.type!=="warm" && s.weight!=="" && s.weight!=null && s.reps!=="" && s.reps!=null && !isNaN(+s.weight) && !isNaN(+s.reps); }
function workingSets(entry){ return (entry.sets||[]).filter(isLogged); }
function primaryMuscle(ex){ let best=null; for(const [m,c] of Object.entries(ex.m)){ if(!best||c>best.c) best={m,c}; } return best?best.m:null; }

function weeklyVolume(sessions){ const list=sessions||weekSessions(); const vol={}; Object.keys(S.muscles).forEach(m=>vol[m]=0);
  list.forEach(sess=>{ (sess.entries||[]).forEach(en=>{ const ex=exById(en.exId); if(!ex) return; const n=workingSets(en).length;
    for(const [m,c] of Object.entries(ex.m)){ if(vol[m]!==undefined) vol[m]+=n*c; } }); }); return vol; }

/* P5/P8 — explainable attribution: who contributed to a muscle's number */
function muscleContrib(muscle, sessions){ const list=sessions||weekSessions(); const map={};
  list.forEach(sess=>{ (sess.entries||[]).forEach(en=>{ const ex=exById(en.exId); if(!ex||!ex.m[muscle]) return; const n=workingSets(en).length; if(!n) return;
    const c=ex.m[muscle]; const k=en.exId; if(!map[k]) map[k]={exId:k, name:entryName(en), credit:c, sets:0, effective:0, dates:[]};
    map[k].sets+=n; map[k].effective+=n*c; map[k].dates.push(sess.completedAt); }); });
  const rows=Object.values(map).sort((a,b)=>b.effective-a.effective);
  const direct=rows.filter(r=>r.credit>=1).reduce((s,r)=>s+r.effective,0);
  const secondary=rows.filter(r=>r.credit<1).reduce((s,r)=>s+r.effective,0);
  return { rows, direct, secondary, total:direct+secondary }; }

/* Most-recent hard exposure per muscle: keeps date, max credit, and total working sets
   (volume lengthens recovery a little). Only direct/secondary credit (>=0.5) counts. */
function lastTrainedMap(){ const map={};
  S.sessions.filter(s=>s.completedAt).sort((a,b)=>new Date(a.completedAt)-new Date(b.completedAt)).forEach(sess=>{
    const per={};
    (sess.entries||[]).forEach(en=>{ const ex=exById(en.exId); if(!ex) return; const n=workingSets(en).length; if(!n) return;
      for(const [m,c] of Object.entries(ex.m)){ if(c<0.5) continue; const p=per[m]||(per[m]={credit:0,sets:0}); p.credit=Math.max(p.credit,c); p.sets+=n; } });
    for(const [m,p] of Object.entries(per)) map[m]={date:sess.completedAt, credit:p.credit, sets:p.sets}; });
  return map; }
/* Exact-exercise and movement-pattern recency — drive cooldowns in the recommender. */
function lastExerciseMap(){ const map={};
  S.sessions.filter(s=>s.completedAt).forEach(sess=>{ (sess.entries||[]).forEach(en=>{ if(!workingSets(en).length) return;
    const d=sess.completedAt; if(!map[en.exId]||new Date(d)>new Date(map[en.exId].date)) map[en.exId]={date:d}; }); }); return map; }
function lastPatternMap(){ const map={};
  S.sessions.filter(s=>s.completedAt).forEach(sess=>{ (sess.entries||[]).forEach(en=>{ const ex=exById(en.exId); if(!ex||!workingSets(en).length) return;
    const d=sess.completedAt; if(!map[ex.pattern]||new Date(d)>new Date(map[ex.pattern].date)) map[ex.pattern]={date:d}; }); }); return map; }

/* LAYER 1 — recovery/training status (drives colour). No RPE: working sets assumed hard.
   Recovery is the gate: a muscle below its block window must NOT be a primary target,
   regardless of weekly-volume need. */
function recWindows(m,lt){ const cfg=S.muscles[m]; const rec=cfg.rec||[cfg.size==="large"?40:24, cfg.size==="large"?64:44];
  const scale=lt.credit>=1?1:0.62;                                   // secondary credit recovers faster
  const volMult=1+Math.max(-0.15,Math.min(0.28,(lt.sets-3)*0.06));   // higher volume → slightly longer
  return { block:rec[0]*scale*volMult, caution:rec[1]*scale*volMult }; }
function recoveryStatus(m){ const lt=lastTrainedMap()[m]; if(!lt) return "untrained";
  const cfg=S.muscles[m]; const vol=weeklyVolume()[m]; const h=hoursBetween(lt.date,new Date());
  const {block,caution}=recWindows(m,lt);
  if(vol>=cfg.cap && h<caution) return "overloaded";
  if(h<block) return "recovering";
  if(h<caution) return "caution";
  return "ready"; }
/* hours until a muscle clears its block window (for "wait ~Xh" copy) */
function readyInHours(m){ const lt=lastTrainedMap()[m]; if(!lt) return 0; const {block}=recWindows(m,lt); return Math.max(0,Math.round(block-hoursBetween(lt.date,new Date()))); }
const REC_META={ untrained:{label:"Untrained",c:"var(--grey)"}, ready:{label:"Ready",c:"var(--green)"}, caution:{label:"Caution",c:"var(--amber)"}, recovering:{label:"Recovering",c:"var(--violet)"}, overloaded:{label:"Overloaded",c:"var(--red)"} };

/* LAYER 2 — goal/volume status (shown as badges) */
function goalStatus(m){ const cfg=S.muscles[m]; const v=weeklyVolume()[m];
  if(v>=cfg.cap) return {label:"Over cap",c:"var(--red)"};
  if(v>=cfg.gh) return {label:"Above target",c:"var(--amber)"};
  if(v<cfg.min) return {label:"Below min",c:"var(--blue)"};
  if(v>=cfg.gl) return {label:"On track",c:"var(--green)"};
  return {label:"Building",c:"var(--muted)"}; }

/* e1RM only trustworthy in low-rep ranges — ignore high-rep isolation sets (P10 trust fix). */
const E1RM_MAX_REPS=10;
function est1RM(w,r){ return (w>0&&r>0&&r<=E1RM_MAX_REPS)?+(w*(1+r/30)).toFixed(1):0; }
function topSetLoad(sets){ return Math.max(0,...sets.map(s=>+s.weight||0)); }
function bestSetVol(sets){ return Math.max(0,...sets.map(s=>(+s.weight||0)*(+s.reps||0))); }

   Every exercise declares how the number in its weight column relates to getting stronger:

     load:"ext"    (default)  the weight column IS the load. Higher = better.
     load:"assist"            the weight column is MACHINE ASSISTANCE. LOWER = better.
     load:"bw"                the weight column is ADDED load on top of bodyweight (0 = pure
                              bodyweight). Higher = better, and one exercise spans both the
                              bodyweight and the weighted stage.

   on setLoadScore(), never on the raw number, so the direction is handled in exactly one place
   and no exercise needs a hard-coded exception.

   Effective load = bodyweight − assistance (assist) or bodyweight + added (bw). Bodyweight is
   taken from the nearest logged reading at or before the session, so it tracks changes over

const TREND_META={

  early:{label:"Early signal", c:"var(--muted)", icon:"\u25cb", note:"Two sessions in \u2014 keep logging to confirm a trend."},
  progressing:{label:"Progressing", c:"var(--green)", icon:"\u25b2", note:"Clearly up on your recent baseline \u2014 keep the pressure on."},
  stable:{label:"Stable", c:"var(--accent)", icon:"\u25ac", note:"Holding steady inside normal variation \u2014 chase one more clean rep."},
  stalled:{label:"Stalled", c:"var(--amber)", icon:"\u25ac", note:"Flat for 3 sessions \u2014 change a variable: more reps, a small load change, or a fresh variation."},

/* rolling per-session averages over the N days before this session */
function baselineAvg(sess,days,offsetDays){
  const end=new Date(sess.completedAt).getTime()-(offsetDays||0)*864e5;
  const start=end-days*864e5;
  const list=completedSessions().filter(function(o){ if(o.id===sess.id) return false;
    const t=new Date(o.completedAt).getTime(); return t>=start&&t<end; });
  if(!list.length) return null;
  const tot=list.reduce(function(a,o){ const x=sessionTotals(o); a.sets+=x.sets; a.reps+=x.reps; a.vol+=x.vol; return a; },{sets:0,reps:0,vol:0});
  return {n:list.length, sets:tot.sets/list.length, reps:tot.reps/list.length, vol:tot.vol/list.length}; }
function deltaPct(now,base){ if(base==null||base===0) return null; return ((now-base)/Math.abs(base))*100; }
/* a delta chip: absolute change on top, percentage underneath, colour only when it is meaningful */
function deltaChip(now,base,unit){

  const sign=d>0?"+":(d<0?"−":"±");
  const mag=Math.abs(d)>=100?Math.round(Math.abs(d)):Math.round(Math.abs(d)*10)/10;

function incrementFor(e){ return (e.m.quads||e.m.hamstrings||e.m.glutes||e.m.back_lats>=1)?5:2.5; }
/* Next-session target. Direction comes from the exercise's own progression model, so an assisted
   movement is NEVER told to add assistance - progress there means taking assistance away, and at
   zero assistance it graduates to the bodyweight version of the movement. */
function progressionFor(exId){ const e=exById(exId); const last=exerciseHistory(exId)[0];
  if(!last||!last.sets.length) return {weight:"",reps:"",note:"Find a working "+loadNoun(e)+" in "+e.rl+"-"+e.rh+" reps.",add:false,dir:0};
  const ws=last.sets; const tr=Math.max(...ws.map(s=>+s.reps||0));
  const cur=bestRawLoad(e,ws);                       /* heaviest weight, or LOWEST assistance */
  const allTop=ws.length>=2&&ws.every(s=>(+s.reps||0)>=e.rh);
  let inc=incrementFor(e);
  if(isAssisted(e)){
    if(cur<=inc) inc=Math.min(inc,2.5);              /* ease the step down on the last stretch to zero */
    if(cur<=0){ const nx=PROG_CHAINS[e.id];

function recommend(r,opts){ r=r||{}; opts=opts||{}; const time=r.time||60; const maxEx=time<=30?3:time<=45?4:5;

  const scored=muscleScores(r); const wk=weekSessions().length; const remaining=S.settings.sessionsPerWeek-wk;

      if(!bestEx) break; const leadM=primaryMuscle(bestEx); const sc=scored.find(x=>x.m===leadM); let sets=2;

function swapSuggestions(exId){ const ex=exById(exId); if(!ex) return []; const pm=primaryMuscle(ex);

  return S.exercises.filter(e=>e.id!==exId && !inWorkout.has(e.id) && primaryMuscle(e)===pm && AVAIL_OK[e.avail] && e.pref!=="avoid" && !limBlock(e))   // never an exercise already in the workout; unavailable + avoided excluded (v7 — search still finds them)
    .map(e=>({e, dupPattern:patternsInWorkout.has(e.pattern)?1:0, recRank:(e.rec?0:1), samePatternAsCur:e.pattern===ex.pattern?1:0}))
    .sort((a,b)=>(a.dupPattern-b.dupPattern)                       // patterns not already in the workout first (no same-pattern duplicates)

                ||(a.samePatternAsCur-b.samePatternAsCur)          // prefer a meaningfully different variation than the one being swapped

/* ============================================================================ ANALYTICS ============================================================================ */
function completedSessions(){ return S.sessions.filter(s=>s.completedAt); }
function monthKey(d){ const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"); }
function monthLabel(k){ const [y,m]=k.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]+" "+y.slice(2); }
function periodRange(){ if(statsPeriod==="all") return null; if(statsPeriod==="week"){ const from=startOfWeek(); const to=new Date(from); to.setDate(to.getDate()+7); return {from,to}; } const to=new Date(); const from=new Date(); from.setDate(from.getDate()-(+statsPeriod)); return {from,to}; }
function inPeriod(d){ const p=periodRange(); if(!p) return true; const t=new Date(d); return t>=p.from&&t<=p.to; }
function periodSessions(){ return completedSessions().filter(s=>inPeriod(s.completedAt)); }
function setsByBodyPartP(){ return weeklyVolume(periodSessions()); }
function mostUsedExercises(limit){ const cnt={}; periodSessions().forEach(s=>s.entries.forEach(en=>{ if(workingSets(en).length) cnt[en.exId]=(cnt[en.exId]||0)+1; }));
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,limit||6).map(([id,n])=>({ex:exById(id),n})); }
function workoutsByMonth(){ const m={}; completedSessions().forEach(s=>{ const k=monthKey(s.completedAt); m[k]=(m[k]||0)+1; }); return m; }
function bestMonth(){ let b=null; for(const [k,v] of Object.entries(workoutsByMonth())){ if(!b||v>b.v) b={k,v}; } return b; }
function weeklyCounts(n){ const out=[]; const base=startOfWeek(); for(let i=n-1;i>=0;i--){ const s=new Date(base); s.setDate(s.getDate()-i*7); const e=new Date(s); e.setDate(e.getDate()+7);
  out.push({count:completedSessions().filter(x=>new Date(x.completedAt)>=s&&new Date(x.completedAt)<e).length, current:i===0}); } return out; }
/* Progression metric: e1RM for low-rep work; top-set load or best-set volume for
   isolation / high-rep movements where e1RM would be misleading (P10). */
/* First-vs-latest movement per exercise, always measured on the comparable (direction-aware)
   strength number, so an assisted movement shedding assistance reads as a GAIN, not a loss. */
function exerciseProgression(){ return S.exercises.map(e=>{ const h=exerciseHistory(e.id); if(h.length<2) return null;
  const fh=h[h.length-1], lh=h[0];
  let first=sessionStrength(e,fh.sets,fh.bw), latest=sessionStrength(e,lh.sets,lh.bw);
  let metric=(exE1RM(e,bestRawLoad(e,lh.sets),Math.max(...lh.sets.map(s=>+s.reps||0)),lh.bw)>0)?"e1RM":(loadKind(e)==="ext"?"top set":"effective load");
  if(loadKind(e)==="ext"&&first<=0&&latest<=0){ first=bestSetVol(fh.sets); latest=bestSetVol(lh.sets); metric="best vol"; }
  if(first===0) return null;
  const td=exerciseTrendData(e.id);
  return {ex:e, first, latest, n:h.length, metric, pct:(latest-first)/Math.abs(first)*100,
          state:td.state, recentPct:td.pct, kind:loadKind(e),
          firstRaw:bestRawLoad(e,fh.sets), latestRaw:bestRawLoad(e,lh.sets)}; })
  .filter(Boolean).sort((a,b)=>b.pct-a.pct); }
function calcStreak(){ let streak=0,cursor=startOfWeek(); for(let i=0;i<26;i++){ const s=new Date(cursor); const e=new Date(s); e.setDate(e.getDate()+7);
  const n=S.sessions.filter(x=>x.completedAt&&new Date(x.completedAt)>=s&&new Date(x.completedAt)<e).length;
  if(i===0&&n<S.settings.sessionsPerWeek){ cursor.setDate(cursor.getDate()-7); continue; } if(n>=S.settings.sessionsPerWeek) streak++; else break; cursor.setDate(cursor.getDate()-7); } return streak; }

/* ============================================================================ INSIGHTS ENGINE (v5)
   All derived client-side from completedAt (canonical workout time), set data and mode.
   Threshold-guarded — no fake precision on small data. ============================================================================ */
function weekKeyOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate(); }
function sessionSets(s){ return (s.entries||[]).reduce((a,en)=>a+workingSets(en).length,0); }
function sessionVol(s){ return (s.entries||[]).reduce((a,en)=>a+workingSets(en).reduce((x,st)=>x+(+st.weight||0)*(+st.reps||0),0),0); }
function needsAttentionPrimary(){ const vol=weeklyVolume(); return Object.entries(S.muscles).filter(([m,c])=>c.tier==="primary"&&vol[m]<c.min&&(function(){const st=recoveryStatus(m);return st!=="recovering"&&st!=="overloaded";})()).map(([m])=>m); }
function secondaryDominant(){ const wk=weekSessions(); const vol=weeklyVolume(wk); const out=[];
  Object.entries(S.muscles).forEach(([m,cfg])=>{ const v=vol[m]; if(v<=0||v>=cfg.min) return; const con=muscleContrib(m,wk); if(con.total<=0) return;
    if(con.secondary>con.direct && con.direct<cfg.min*0.6) out.push({m,cfg,con,v}); });
  return out.sort((a,b)=>b.con.secondary-a.con.secondary); }
function dayOfWeekCounts(){ const c=[0,0,0,0,0,0,0]; completedSessions().forEach(s=>{ c[(new Date(s.completedAt).getDay()+6)%7]++; }); return c; }
function bestTrainingDay(){ const c=dayOfWeekCounts(); const total=c.reduce((a,b)=>a+b,0); if(total<6) return null;
  const names=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]; let bi=0; c.forEach((n,i)=>{ if(n>c[bi]) bi=i; });
  if(c[bi]<2) return null; return {day:names[bi], n:c[bi], total, share:c[bi]/total, counts:c}; }
const TOD_BUCKETS=[["Early (before 9am)",0,9],["Morning (9am–12pm)",9,12],["Afternoon (12–5pm)",12,17],["Evening (5pm+)",17,24]];
function timeOfDayCounts(){ return TOD_BUCKETS.map(([label,lo,hi])=>{ let n=0; completedSessions().forEach(s=>{ const h=new Date(s.startedAt||s.completedAt).getHours(); if(h>=lo&&h<hi) n++; }); return {label,n}; }); }
function bestTimeWindow(){ const total=completedSessions().length; const buckets=timeOfDayCounts(); const best=buckets.slice().sort((a,b)=>b.n-a.n)[0];
  if(!best||best.n===0) return null; return {window:best.label, n:best.n, total, early:total<8}; }
function progressionInsights(){ return exerciseProgression().filter(p=>p.n>=3); }
function bestWeekSoFar(){ const wk={}; completedSessions().forEach(s=>{ const k=weekKeyOf(s.completedAt); const o=wk[k]||(wk[k]={sessions:0,sets:0,muscles:new Set()}); o.sessions++; o.sets+=sessionSets(s);
    (s.entries||[]).forEach(en=>{ if(workingSets(en).length){ const ex=exById(en.exId); const pm=ex&&primaryMuscle(ex); if(pm) o.muscles.add(pm); } }); });
  const weeks=Object.values(wk); if(!weeks.length) return null; weeks.sort((a,b)=>b.sets-a.sets); const b=weeks[0]; if(b.sets<10) return null;
  return {sessions:b.sessions, sets:b.sets, muscles:b.muscles.size, isThis:weekKeyOf(new Date())===Object.keys(wk).find(k=>wk[k]===b)}; }
function recentSets(n){ const out=[]; const base=startOfWeek(); for(let i=n-1;i>=0;i--){ const a=new Date(base); a.setDate(a.getDate()-i*7); const b=new Date(a); b.setDate(b.getDate()+7);
  out.push(completedSessions().filter(x=>new Date(x.completedAt)>=a&&new Date(x.completedAt)<b).reduce((s,x)=>s+sessionSets(x),0)); } return out; }
function momColor(sc){ return sc>=85?"var(--green)":sc>=70?"var(--accent)":sc>=50?"var(--gold)":sc>=30?"var(--amber)":"var(--red)"; }
function momentumScore(){ const w=weekStatus(); const target=w.target||4; const vol=weeklyVolume();
  const consist=Math.min(1,w.sess/target); const streak=calcStreak();
  const primaryAll=Object.values(S.muscles).filter(c=>c.tier==="primary").length;
  const primaryMet=Object.entries(S.muscles).filter(([m,c])=>c.tier==="primary"&&vol[m]>=c.min).length;
  const coverage=primaryAll?primaryMet/primaryAll:1;
  const last=completedSessions().slice().sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt))[0];
  const recH=last?hoursBetween(last.completedAt,new Date()):999; const recency=recH<72?1:recH<120?0.6:0.2;
  let score=Math.round(consist*42 + Math.min(streak,3)/3*16 + coverage*30 + recency*12); score=Math.max(0,Math.min(100,score));
  const label=score>=85?"On fire":score>=70?"Strong":score>=50?"Building":score>=30?"Warming up":"Time to restart";
  return {score,label,consist,streak,coverage,primaryMet,primaryAll}; }
function coachSummary(){ const m=momentumScore(); const w=weekStatus(); const parts=[];
  parts.push(w.sess>=w.target?("You’ve hit "+w.sess+"/"+w.target+" sessions this week — target met."):(w.sess+"/"+w.target+" sessions logged this week, "+(w.target-w.sess)+" to go."));
  const na=needsAttentionPrimary(); if(na.length) parts.push("Still needs direct work: "+na.slice(0,3).map(x=>S.muscles[x].label.toLowerCase()).join(", ")+".");
  else parts.push("Every primary muscle has met its weekly minimum.");
  const sd=secondaryDominant()[0]; if(sd) parts.push(S.muscles[sd.m].label+" volume is mostly secondary — add one direct exercise.");
  return parts.join(" "); }
/* ---- card renderer ---- */
function insightCard(o){ const c=o.tier==="good"?"var(--green)":o.tier==="warn"?"var(--amber)":o.tier==="bad"?"var(--red)":"var(--accent)";
  return '<div class="icard'+(o.muscle?' tap':'')+'" style="border-left-color:'+c+'"'+(o.muscle?' data-insight-muscle="'+o.muscle+'"':'')+'>'
    +'<div class="ihd"><span class="ibadge" style="background:'+c+'22;color:'+c+'">'+(o.badge||"Insight")+'</span>'+(o.metric?'<span class="imetric" style="color:'+c+'">'+o.metric+'</span>':'')+'</div>'

function orderScore(c){ const ex=exById(c.exId); if(!ex) return 100; const pm=primaryMuscle(ex); const tr=TIER_RANK[(S.muscles[pm]||{}).tier]; const t=(tr==null?1:tr);
  let s=0; s+=ex.type==="compound"?0:30; s+=t*12; s-=Math.min(ex.fatigue||1,4)*4;

/* ---------------- REST TIMER ---------------- */
function restBeep(){ try{ const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return; const ctx=new Ctx(); const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type="sine"; o.frequency.value=880;
  g.gain.setValueAtTime(0.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.3,ctx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.5); o.start(); o.stop(ctx.currentTime+0.52); setTimeout(()=>{try{ctx.close();}catch(e){}},800); }catch(e){} }
/* v8 — WALL-CLOCK REST TIMER.
   The old implementation counted down an in-memory `left` variable inside a 1s setInterval.
   Mobile browsers throttle (and iOS/Android fully suspend) timers in a backgrounded tab, so the
   countdown froze while you were away and resumed where it left off — losing all elapsed time.
   Now the *only* source of truth is `restState.endsAt`, an absolute epoch-ms completion timestamp.
   Every paint derives the remaining seconds from Date.now(), the interval is a repaint trigger only,
   and the state is mirrored into localStorage so a reload / relaunch restores the same deadline.
   DONE_GRACE_MS: how long after expiry the "Rest done" card still shows when you come back. */
const REST_DONE_GRACE_MS = 120000;
let restState=null;               /* {endsAt, total, name, next, notified} — endsAt is epoch ms */
let restAnnounced=false;          /* buzz/beep fires once per timer, even across backgrounding */
function restKey(){ return (authUser&&authUser.id) ? "iron_arc_rest_v1:"+authUser.id : "iron_arc_rest_v1"; }
function saveRest(){ try{ if(restState) localStorage.setItem(restKey(), JSON.stringify(restState)); else localStorage.removeItem(restKey()); }catch(e){} }
/* pure + testable: seconds left on a state at a given instant (never negative) */
function restRemaining(st,now){ if(!st||!st.endsAt) return 0; return Math.max(0,Math.ceil((st.endsAt-(now==null?Date.now():now))/1000)); }
function restExpired(st,now){ if(!st||!st.endsAt) return true; return (now==null?Date.now():now)>=st.endsAt; }
/* how far past expiry we are, in ms (0 while still running) */
function restOverdue(st,now){ if(!st||!st.endsAt) return 0; return Math.max(0,(now==null?Date.now():now)-st.endsAt); }
function restMount(){ return document.getElementById("restmount"); }
/* We tick at 500ms (so a resync lands fast) but only touch the DOM when the displayed second
   actually changes — half the churn of the old build, and taps on the controls never get eaten. */
let restPaintKey="";
function restPaintKeyFor(st,now){ if(!st) return ""; return (restExpired(st,now)?"done":restRemaining(st,now))+"|"+st.endsAt; }
function clearRest(){ if(restTimer){ clearInterval(restTimer); restTimer=null; } restState=null; restAnnounced=false; restPaintKey=""; saveRest(); const m=restMount(); if(m) m.innerHTML=""; }
function restBar(st,now){ const left=restRemaining(st,now); const total=Math.max(1,st.total||1); return Math.max(0,Math.min(100,Math.round((1-left/total)*100))); }
/* single render pass — reads the clock, never mutates it */
function paintRest(force){ const m=restMount(); if(!m) return; const st=restState;
  if(!st){ restPaintKey=""; m.innerHTML=""; return; }
  const now=Date.now(); const done=restExpired(st,now);
  if(done && restOverdue(st,now)>REST_DONE_GRACE_MS){ clearRest(); return; }   /* long gone — don't nag on return */
  const key=restPaintKeyFor(st,now);
  if(!force && key===restPaintKey && m.innerHTML) return;                      /* nothing visibly changed */
  restPaintKey=key;
  const left=restRemaining(st,now); const mm=Math.floor(left/60), ss=String(left%60).padStart(2,"0");
  m.innerHTML='<div class="rest'+(done?' done':'')+'"><div class="restcard">'
    +'<div class="restbar"><i style="width:'+(done?100:restBar(st,now))+'%"></i></div>'
    +'<div class="restrow"><div style="flex:1"><div class="resttitle">'+(done?"✅ Rest done — next set ready":"Resting")+'</div><div class="restmeta">'+(st.name||"")+(st.next?" · "+st.next:"")+'</div></div>'
    +(done?'<button data-restgo class="btn accent sm">Go</button>':'<div class="restt">'+mm+":"+ss+'</div>')+'</div>'
    +(done?'':'<div class="restctl"><button data-restsub>−15s</button><button data-restadd>+30s</button><button data-restskip>Skip rest</button></div>')
    +'</div></div>';
  if(done){ const g=m.querySelector("[data-restgo]"); if(g) g.onclick=clearRest; }
  else { const ad=m.querySelector("[data-restadd]"); if(ad) ad.onclick=()=>restAdjust(30);
         const sb=m.querySelector("[data-restsub]"); if(sb) sb.onclick=()=>restAdjust(-15);
         const sk=m.querySelector("[data-restskip]"); if(sk) sk.onclick=clearRest; } }
/* ±seconds shifts the DEADLINE, so accuracy is preserved across backgrounding */
function restAdjust(delta){ if(!restState) return; const now=Date.now();
  const left=Math.max(0,restState.endsAt-now); const nl=Math.max(1000,left+delta*1000);
  restState.endsAt=now+nl; restState.total=Math.max(1,Math.round(restState.total+delta));
  if(restRemaining(restState,now)>0) restAnnounced=false;                     /* re-armed, so it can chime again */
  saveRest(); ensureRestTicking(); paintRest(true); }
/* one interval, idempotent — rapid background/foreground cycles can't stack or drop it */
function ensureRestTicking(){ if(restTimer) return; if(!restState) return;
  restTimer=setInterval(restTick,500); }
function restTick(){ if(!restState){ if(restTimer){ clearInterval(restTimer); restTimer=null; } return; }
  const now=Date.now();
  if(restExpired(restState,now)){
    if(!restAnnounced){ restAnnounced=true; restState.notified=true; saveRest();
      /* only alert if we're actually looking at it — a silent expiry while away is expected */
      if(restOverdue(restState,now)<3000){ try{ navigator.vibrate&&navigator.vibrate([200,100,200,100,300]); }catch(e){} restBeep(); } }
    paintRest();
    if(restState && restOverdue(restState,now)>REST_DONE_GRACE_MS) clearRest();
    return; }
  paintRest(); }
function startRest(sec,name,next){ const total=Math.max(1,Math.round(sec||0));
  if(restTimer){ clearInterval(restTimer); restTimer=null; }
  restAnnounced=false;
  restState={ endsAt:Date.now()+total*1000, total:total, name:name||"", next:next||"", notified:false };
  restPaintKey=""; saveRest(); paintRest(true); ensureRestTicking(); }
/* Called on load and whenever the app becomes visible/focused again. Re-derives everything from
   the stored deadline, so time that passed while suspended is fully accounted for. */
function resumeRest(){
  if(!restState){ try{ const raw=localStorage.getItem(restKey()); if(raw) restState=JSON.parse(raw); }catch(e){ restState=null; } }
  if(!restState||!restState.endsAt){ restState=null; return; }
  if(restExpired(restState)){ restAnnounced=true;                              /* expired while away: no retro-buzz */
    if(restOverdue(restState)>REST_DONE_GRACE_MS){ clearRest(); return; } }
  paintRest(true); ensureRestTicking(); }
function renderRest(){ /* the timer owns #restmount; re-assert it after any full re-render */ if(restState) paintRest(true); }
function tickClock(){ const el=document.getElementById("elapsed"); if(!el||!activeSession){ stopClock(); return; } const sec=Math.max(0,Math.floor((Date.now()-new Date(activeSession.startedAt))/1000)); el.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); const sp=document.getElementById("setprog"); if(sp){ const c=loggerCounts(); sp.textContent=c.done+"/"+c.total; } }
function startClock(){ stopClock(); tickClock(); loggerClock=setInterval(tickClock,1000); }
function stopClock(){ if(loggerClock){ clearInterval(loggerClock); loggerClock=null; } }
function renderFinish(){ const m=document.getElementById("finmount"); if(!m) return;
  if(activeSession&&viewingLogger){ const c=loggerCounts(); const isEdit=activeSession.mode==="edit";
    if(c.done>=1||isEdit){ m.innerHTML='<div class="stickfin"><button class="b" data-finish>'+(isEdit?"Save changes":"Finish workout")+' · '+c.done+' set'+(c.done===1?"":"s")+'</button></div>'; m.querySelector("[data-finish]").onclick=finishWorkout; return; } }
  m.innerHTML=""; }

/* ============================================================================ WIRING ============================================================================ */
function deriveTitle(entries){ const ms={}; entries.forEach(en=>{ const ex=exById(en.exId); const n=workingSets(en).length; if(!ex||!n) return; const pm=primaryMuscle(ex); if(pm) ms[pm]=(ms[pm]||0)+n; });
  const top=Object.entries(ms).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([m])=>S.muscles[m]?S.muscles[m].label:m); return top.length?top.join(" · "):"Workout"; }
function startSession(rec){ loggerOpen={}; rerollCounts={}; const entries=(rec?rec.exercises:[]).map(c=>{ const e=exById(c.exId); return { exId:c.exId, sets:Array.from({length:c.sets||e.sl||2},()=>({weight:"",reps:"",type:"work",done:false})) }; });
  activeSession={ id:uid(), startedAt:iso(new Date()), dateISO:new Date().toISOString().slice(0,10), title:rec?rec.title:"Empty workout", mode:rec?"adaptive":"manual", entries }; viewingLogger=true; pendingRec=null; saveActive();
  try{ history.pushState({iron:"workout"},""); }catch(e){} route="today"; render(); }
function finishWorkout(){ const logged=activeSession.entries.reduce((n,en)=>n+workingSets(en).length,0);
  if(!logged){ confirmSheet("Nothing’s been logged yet. Finish this workout anyway?","Finish anyway",()=>doFinish(),{danger:true,title:"Finish empty workout?"}); return; }
  doFinish(); }
function doFinish(){ let saved=null;
  if(activeSession.mode==="edit"){ const d=activeSession.dateISO; const base=d?new Date(d+"T12:00:00"):new Date();   // edits keep their chosen date (noon if re-dated)
    const idx=S.sessions.findIndex(s=>s.id===activeSession.editingId); const orig=idx>=0?S.sessions[idx]:null;
    const completedAt=orig&&dayKey(orig.completedAt)===dayKey(base)?orig.completedAt:iso(base);
    /* v10: synced:false is set explicitly — an edit used to inherit an undefined flag, which the
       old rehydrate filter (synced===false) did not rescue, so a failed edit push was lost too. */
    const updated={...activeSession, id:activeSession.editingId, completedAt, mode:"edit", synced:false}; delete updated.editingId; delete updated.dateISO;
    if(idx>=0) S.sessions[idx]=updated; else S.sessions.push(updated);   // v10: never drop an edit whose original went missing
    journalPut(updated); persistLocal(); pushWorkout(updated); saved=updated; }
  else { if(!activeSession.title||activeSession.title==="Empty workout") activeSession.title=deriveTitle(activeSession.entries);
    /* v7: a live session finishes at the moment you hit Finish — never the noon placeholder */
    const sess={ id:activeSession.id, startedAt:activeSession.startedAt, completedAt:iso(new Date()), title:activeSession.title, mode:activeSession.mode, entries:activeSession.entries, synced:false };
    /* v10 ordering matters: journal → local → cloud. The workout is durable on disk in two
       independent places before a single network call is made. */
    journalPut(sess); S.sessions.push(sess); persistLocal();
    pushWorkout(sess); if(readinessDraft&&route!=="settings") pushCheckin(readinessDraft,sess.id); saved=sess; }
  const recap=buildRecap(saved); activeSession=null; viewingLogger=false; loggerOpen={}; saveActive(); stopClock(); go("today"); openSheet("recap",recap); }
/* v9 - the recap now answers "was that session actually any good?" by putting the raw totals next
   to two references: the last comparable workout, and your rolling 4-week per-session average. */
function buildRecap(sess){ const setsN=sess.entries.reduce((a,en)=>a+workingSets(en).length,0);
  const totals=sessionTotals(sess);
  const cmp=previousComparable(sess);
  const cmpTotals=cmp?sessionTotals(cmp.sess):null;
  const base4=baselineAvg(sess,28,0);
  const prev4=baselineAvg(sess,28,28);
  const customUsed=(sess.entries||[]).filter(function(en){ const ex=exById(en.exId); return workingSets(en).length&&isCustomEx(ex)&&ex.customStatus==="unmapped"; }).length;
  const dur=sess.startedAt?Math.max(1,Math.round(hoursBetween(sess.startedAt,sess.completedAt)*60)):null;
  const muscles=[...new Set(sess.entries.flatMap(en=>{ const ex=exById(en.exId); const n=workingSets(en).length; return (ex&&n)?Object.entries(ex.m).filter(([m,c])=>c>=0.5).map(([m])=>m):[]; }))].map(m=>S.muscles[m]?S.muscles[m].label:m);

  const vbp=weeklyVolume([sess]); const parts=Object.entries(vbp).filter(([m,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([m,v])=>({label:S.muscles[m].label,v}));
  let coach=""; const mom=momentumScore(); const na=needsAttentionPrimary();
  if(prs.length) coach="🏆 "+prs.length+" new achievement"+(prs.length>1?"s":"")+" this session — momentum "+mom.score+"/100.";
  else if(na.length) coach="Momentum "+mom.score+"/100. Still needs direct work this week: "+na.slice(0,2).map(m=>S.muscles[m].label.toLowerCase()).join(", ")+".";
  else coach="Momentum "+mom.score+"/100 — every primary muscle is on track this week. 🔥";
  return {id:sess.id, setsN, exN:sess.entries.filter(en=>workingSets(en).length).length, dur, muscles, prs, ach, parts, title:sess.title, coach,
          totals, cmp, cmpTotals, base4, prev4, customUsed, date:sess.completedAt}; }
function editWorkout(id){ const s=S.sessions.find(x=>x.id===id); if(!s) return; loggerOpen={}; activeSession={ id:uid(), editingId:id, startedAt:s.startedAt||s.completedAt, dateISO:new Date(s.completedAt).toISOString().slice(0,10), title:s.title, mode:"edit", entries:JSON.parse(JSON.stringify(s.entries)) }; viewingLogger=true; saveActive(); go("today"); }
function duplicateWorkout(id){ const s=S.sessions.find(x=>x.id===id); if(!s) return; loggerOpen={}; activeSession={ id:uid(), startedAt:iso(new Date()), dateISO:new Date().toISOString().slice(0,10), title:s.title, mode:"manual", entries:s.entries.map(en=>({exId:en.exId, sets:en.sets.map(()=>({weight:"",reps:"",type:"work",done:false}))})) }; viewingLogger=true; saveActive(); try{ history.pushState({iron:"workout"},""); }catch(e){} go("today"); }
