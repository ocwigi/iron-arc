function setCustomGroup(id,group){ var c=customRec(id); if(!c||CUSTOM_GROUP_KEYS.indexOf(group)<0) return false;
  c.group=group; delete c.m; rebuildCustomExercises(); save(); return true; }
/* keep it as a first-class custom exercise, just stop nagging about it */
function keepCustomExercise(id){ var c=customRec(id); if(!c) return false;
  c.status="kept"; c.reviewedAt=iso(new Date()); rebuildCustomExercises(); save(); return true; }
/* promote to a permanent library exercise. Same id, so every existing session already points at it
   and NOTHING has to be rewritten or migrated. */
function promoteCustomExercise(id,opts){ var c=customRec(id); if(!c) return false; opts=opts||{};
  c.status="promoted"; c.reviewedAt=iso(new Date());
  if(opts.name) c.name=String(opts.name).trim();
  if(opts.group&&CUSTOM_GROUP_KEYS.indexOf(opts.group)>=0){ c.group=opts.group; delete c.m; }
  if(opts.equip) c.equip=opts.equip;
  c.rec=!!opts.rec;
  addUserAlias(c.id,c.origName||c.name);
  rebuildCustomExercises(); save(); return true;
}
/* Map a custom exercise onto a canonical one.
   Every historical entry is rewritten IN PLACE on its existing session — the same workout record,
   the same sets, the same dates — so nothing is duplicated and nothing is deleted. The text you
   originally typed is preserved on the entry as `asName`, and is added to the canonical exercise's
   search aliases so the name you know still finds it. */
function mapCustomExercise(id,canonicalId){
  var c=customRec(id); var canon=exById(canonicalId);
  if(!c||!canon||canon.id===id||canon.custom&&canon.customStatus==="mapped") return {ok:false,moved:0};
  var label=c.name, moved=0, touched=[];
  (S.sessions||[]).forEach(function(sess){
    (sess.entries||[]).forEach(function(en){
      if(en.exId!==id) return;
      en.exId=canonicalId;
      if(!en.asName) en.asName=label;                 /* the name you actually entered, kept forever */
      en.mappedFrom=id;
      moved++;
      if(touched.indexOf(sess)<0) touched.push(sess);
    });
  });
  /* live session too, so mapping mid-workout cannot strand the current entries */
  if(activeSession&&activeSession.entries) activeSession.entries.forEach(function(en){
    if(en.exId===id){ en.exId=canonicalId; if(!en.asName) en.asName=label; en.mappedFrom=id; } });
  c.status="mapped"; c.mappedTo=canonicalId; c.reviewedAt=iso(new Date());
  addUserAlias(canonicalId,label);
  if(c.origName&&c.origName!==label) addUserAlias(canonicalId,c.origName);
  rebuildCustomExercises();
  persistLocal(); save(); saveActive();
  touched.forEach(function(sess){ sess.synced=false; pushWorkout(sess); });
  return {ok:true,moved:moved,sessions:touched.length};
}
/* Suggested canonical matches — ranked, never applied automatically. Name and alias tokens only;
   a shared muscle group is a tie-breaker, never a reason on its own. */
function suggestMatches(id,limit){
  var c=customRec(id); if(!c) return [];
  var q=canonTokens(c.name); if(!q.length) return [];
  var qs=q.join(" ");
  return S.exercises.filter(function(e){ return e.id!==id && !e.custom; }).map(function(e){
    var hay=exHay(e), score=0;
    q.forEach(function(t){ if(hay.indexOf(" "+t+" ")>=0) score+=3; else if(hay.indexOf(t)>=0) score+=1; });
    if(normSearch(e.name)===normSearch(c.name)) score+=12;
    if(canonTokens(e.name).join(" ")===qs) score+=8;
    if(exGroup(e)===c.group) score+=2;
    return {ex:e, score:score};
  }).filter(function(x){ return x.score>=4; })
    .sort(function(a,b){ return b.score-a.score || a.ex.name.localeCompare(b.ex.name); })
    .slice(0,limit||5);
}
try{ rebuildCustomExercises(); }catch(e){}
/* the label to show for an entry: the text you typed if this was a custom capture, else the
   library name. Used everywhere history is rendered. */
function entryName(en){ var ex=exById(en.exId);
  if(en.asName && ex && normSearch(en.asName)!==normSearch(ex.name)) return ex.name+" ("+en.asName+")";
  return ex?ex.name:(en.asName||en.exId); }

function escAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* ============================================================================================
   v9 — REPORTING PRIMITIVES
   Three rules the whole reporting layer follows:
     1. Never call an exercise "declining" off one weaker session — verdicts come from
        exerciseTrendData(), which compares blocks of sessions, not last-vs-previous.
     2. Never show a delta without saying what it is a delta AGAINST.
     3. "Not enough data" is a first-class, visible state, not a silent omission.
   ============================================================================================ */
const TB_CLASS={above:"up", below:"dn", steady:"st", insufficient:"na", stale:"na"};
function pctStr(p){ const v=Math.round(Math.abs(p)); return (p>0?"+":p<0?"−":"")+v+"%"; }
function trendBadge(exId){ const t=exerciseTrend(exId); const cls=TB_CLASS[t.state]||"na";
  if(t.raw==="insufficient") return '<span class="tb na" title="needs '+TREND_MIN_N+' exposures">○ '+(t.n||0)+'/'+TREND_MIN_N+'</span>';
  if(t.state==="stale") return '<span class="tb na" title="not trained recently">○ '+Math.round((t.days||0)/7)+'w</span>';
  const showPct=(t.state==="above"||t.state==="below");
  return '<span class="tb '+cls+'">'+t.icon+(showPct?" "+pctStr(t.pct):"")+'</span>'; }
/* inline 8-point sparkline on the exercise's own default metric (effective load for assisted) */
function miniSpark(exId){ const ex=exById(exId); if(!ex) return "";
  const ser=exerciseSeries(exId,defaultMetricFor(ex)).slice(-8).map(function(p){ return p.val; });
  if(ser.length<2) return "";
  const mn=Math.min.apply(null,ser), mx=Math.max.apply(null,ser), rng=(mx-mn)||1;
  return '<span class="mspark">'+ser.map(function(v,i){
    return '<i class="'+(i===ser.length-1?"hi":"")+'" style="height:'+Math.max(12,Math.round(((v-mn)/rng)*100))+'%"></i>'; }).join("")+'</span>'; }

/* ---- session totals + comparisons (post-workout summary) ---- */
function sessionTotals(sess){ let sets=0,reps=0,vol=0,exN=0;
  (sess.entries||[]).forEach(function(en){ const ws=workingSets(en); if(!ws.length) return; exN++;
    sets+=ws.length; reps+=sessionReps(ws); vol+=rawVolume(ws); });
  return {sets:sets, reps:reps, vol:Math.round(vol), exN:exN}; }
/* ---------------------------------------------------------------- v11 LIKE-FOR-LIKE MATCHING
   Total session tonnage is dominated by exercise selection: a leg day out-tonnages an arm day by
   a wide margin no matter how well either was performed. So "volume down 16%" against a
   mismatched session is not a performance signal, it is a selection artefact. v11 grades how
   comparable two sessions actually are, and only lets a metric carry a delta where that metric
   is genuinely comparable. Everything below is derived — no stored field changes. */
function loggedExIds(sess){ return new Set((sess.entries||[]).filter(function(en){ return workingSets(en).length; }).map(function(en){ return en.exId; })); }
/* muscle-composition similarity: cosine of the two effective-set vectors. 1.0 = identical mix. */
function compositionSimilarity(a,b){
  const va=weeklyVolume([a]), vb=weeklyVolume([b]);
  let dot=0,na=0,nb=0;
  Object.keys(va).forEach(function(m){ const x=va[m]||0, y=vb[m]||0; dot+=x*y; na+=x*x; nb+=y*y; });
  if(na<=0||nb<=0) return 0;
  return dot/(Math.sqrt(na)*Math.sqrt(nb)); }
/* The dominant muscle groups of a session, for the "same composition" wording. */
function sessionComposition(sess){
  const v=weeklyVolume([sess]); const tot=Object.values(v).reduce(function(a,b){ return a+b; },0);
  if(tot<=0) return [];
  return Object.entries(v).filter(function(e){ return e[1]/tot>=0.15; }).sort(function(a,b){ return b[1]-a[1]; })
    .slice(0,3).map(function(e){ return S.muscles[e[0]]?S.muscles[e[0]].label:e[0]; }); }
/* Grade one candidate against the session under review.
     tier 1 exercise    — most of the same exercises. Everything is comparable, tonnage included.
     tier 2 composition — same muscle mix, different exercise choices. Sets/reps comparable; tonnage NOT.
     tier 3 title       — same named session only. Sets/reps comparable; tonnage NOT.
   Anything weaker is rejected outright rather than compared badly. */
function comparabilityOf(sess,other){
  const mine=loggedExIds(sess), theirs=loggedExIds(other);
  if(!mine.size||!theirs.size) return null;
  let overlap=0; mine.forEach(function(id){ if(theirs.has(id)) overlap++; });
  const share=overlap/mine.size;
  const comp=compositionSimilarity(sess,other);
  const sameTitle=!!(sess.title&&other.title&&sess.title===other.title);
  if(share>=0.6&&overlap>=2)
    return {tier:1, share:share, overlap:overlap, mineN:mine.size, comp:comp, volComparable:true,
            why:overlap+" of "+mine.size+" exercises matched"};
  if(comp>=0.75)
    return {tier:2, share:share, overlap:overlap, mineN:mine.size, comp:comp, volComparable:false,
            why:"same muscle composition"+(overlap?" · "+overlap+" shared exercise"+(overlap===1?"":"s"):"")};
  if(sameTitle)
    return {tier:3, share:share, overlap:overlap, mineN:mine.size, comp:comp, volComparable:false,
            why:"same session type"};
  return null; }
/* The best earlier session to compare against: strongest tier, then recency. */
function previousComparable(sess){
  const t=new Date(sess.completedAt).getTime();
  if(!loggedExIds(sess).size) return null;
  let best=null;
  completedSessions().forEach(function(o){
    if(o.id===sess.id||new Date(o.completedAt).getTime()>=t) return;
    const c=comparabilityOf(sess,o); if(!c) return;
    const score=(4-c.tier)*1000 + c.share*100 + c.comp*50 + (new Date(o.completedAt).getTime()/1e13);
    if(!best||score>best.score) best=Object.assign({sess:o, score:score}, c);
  });
  return best; }

/* ---------------------------------------------------------------- v11 EXERCISE-LEVEL PROGRESSION
   The headline the user actually asked for: what happened to each exercise, in its own units and
   its own direction (assistance counts down, added load counts up). This is composition-proof —
   it compares an exercise only against itself. */
function bestSetOf(ex,sets,bw){
  let best=null;
  (sets||[]).forEach(function(s){ const sc=setLoadScore(ex,+s.weight||0,bw);
    if(!best||sc>best.score||(sc===best.score&&(+s.reps||0)>best.reps)) best={score:sc, w:+s.weight||0, reps:+s.reps||0}; });
  return best; }
/* Compare this session's performance of one exercise against the most recent earlier performance. */
function exerciseDeltaVs(exId,sess,prevSess){
  const ex=exById(exId); if(!ex) return null;
  const findEn=function(s){ return (s.entries||[]).filter(function(en){ return en.exId===exId&&workingSets(en).length; })[0]; };
  const a=findEn(sess), b=findEn(prevSess); if(!a||!b) return null;
  const bwA=bodyweightAt(sess.completedAt), bwB=bodyweightAt(prevSess.completedAt);
  const wsA=workingSets(a), wsB=workingSets(b);
  const bA=bestSetOf(ex,wsA,bwA), bB=bestSetOf(ex,wsB,bwB);
  if(!bA||!bB) return null;
  const kind=loadKind(ex);
  const repsA=sessionReps(wsA), repsB=sessionReps(wsB);
  const name=ex.name;
  /* load moved (direction-aware: for an assist machine, less assistance is the improvement) */
  const rawDelta=bA.w-bB.w;
  const loadImproved=bA.score>bB.score, loadWorse=bA.score<bB.score;
  if(Math.abs(rawDelta)>=0.5&&(loadImproved||loadWorse)){
    const mag=Math.round(Math.abs(rawDelta)*10)/10;
    const word=kind==="assist"?(loadImproved?"−"+mag+" kg assistance":"+"+mag+" kg assistance")
                              :(rawDelta>0?"+"+mag+" kg":"−"+mag+" kg");
    return {exId:exId, name:name, state:loadImproved?"up":"down", text:word, detail:bB.w+"→"+bA.w+" kg"}; }
  /* same load — did the reps move? */
  const repDelta=repsA-repsB;
  if(repDelta!==0){
    return {exId:exId, name:name, state:repDelta>0?"up":"down",
            text:(repDelta>0?"+":"−")+Math.abs(repDelta)+" rep"+(Math.abs(repDelta)===1?"":"s"),
            detail:repsB+"→"+repsA+" reps at the same load"}; }
  /* same load, same reps — but more or fewer sets is still a real change */
  if(wsA.length!==wsB.length){
    const sd=wsA.length-wsB.length;
    return {exId:exId, name:name, state:sd>0?"up":"down",
            text:(sd>0?"+":"−")+Math.abs(sd)+" set"+(Math.abs(sd)===1?"":"s"), detail:wsB.length+"→"+wsA.length+" sets"}; }
  return {exId:exId, name:name, state:"same", text:"held steady", detail:bA.w+" kg × "+repsA+" reps"}; }
/* Every exercise in this session that has an earlier performance to compare against. Each is
   matched against its OWN most recent previous session, not against the chosen comparison
   session, so an exercise you did last week still reports even if it is new to this pairing. */
function sessionExerciseProgress(sess){
  const t=new Date(sess.completedAt).getTime();
  const rows=[];
  loggedExIds(sess).forEach(function(exId){
    const prior=completedSessions().filter(function(o){
      return o.id!==sess.id && new Date(o.completedAt).getTime()<t &&
        (o.entries||[]).some(function(en){ return en.exId===exId&&workingSets(en).length; }); })
      .sort(function(a,b){ return new Date(b.completedAt)-new Date(a.completedAt); })[0];
    if(!prior){ const ex=exById(exId);
      rows.push({exId:exId, name:ex?ex.name:exId, state:"new", text:"first time logged", detail:""}); return; }
    const d=exerciseDeltaVs(exId,sess,prior);
    if(d){ d.since=prior.completedAt; rows.push(d); }
  });
  const order={up:0, same:1, down:2, new:3};
  rows.sort(function(a,b){ return (order[a.state]-order[b.state])||a.name.localeCompare(b.name); });
  return { rows:rows,
    up:rows.filter(function(r){ return r.state==="up"; }).length,
    same:rows.filter(function(r){ return r.state==="same"; }).length,
    down:rows.filter(function(r){ return r.state==="down"; }).length,
    fresh:rows.filter(function(r){ return r.state==="new"; }).length }; }
/* rolling per-session averages over the N days before this session.
   v11: `similarOnly` restricts the baseline to sessions of comparable composition. Averaging an
   arm day into the same number as a leg day and then comparing today's arm day to it produced a
   guaranteed-negative volume delta that said nothing about performance. When enough similar
   sessions exist we use those and volume stays meaningful; otherwise we fall back to all
   sessions and mark the result as sets/reps-only. */
function baselineAvg(sess,days,offsetDays,similarOnly){
  const end=new Date(sess.completedAt).getTime()-(offsetDays||0)*864e5;
  const start=end-days*864e5;
  let list=completedSessions().filter(function(o){ if(o.id===sess.id) return false;
    const t=new Date(o.completedAt).getTime(); return t>=start&&t<end; });
  let similar=false;
  if(similarOnly){
    const sim=list.filter(function(o){ return compositionSimilarity(sess,o)>=0.6; });
    if(sim.length>=2){ list=sim; similar=true; }
  }
  if(!list.length) return null;
  const tot=list.reduce(function(a,o){ const x=sessionTotals(o); a.sets+=x.sets; a.reps+=x.reps; a.vol+=x.vol; return a; },{sets:0,reps:0,vol:0});
  return {n:list.length, similar:similar, sets:tot.sets/list.length, reps:tot.reps/list.length, vol:tot.vol/list.length}; }
function deltaPct(now,base){ if(base==null||base===0) return null; return ((now-base)/Math.abs(base))*100; }
/* a delta chip: absolute change on top, percentage underneath, colour only when it is meaningful */
function deltaChip(now,base,unit){
  if(base==null) return '<em style="color:var(--faint)">no baseline</em>';
  const d=now-base, p=deltaPct(now,base);
  const c=(p==null||Math.abs(p)<3)?"var(--muted)":(p>0?"var(--green)":"var(--red)");
  const sign=d>0?"+":(d<0?"−":"±");
  const mag=Math.abs(d)>=100?Math.round(Math.abs(d)):Math.round(Math.abs(d)*10)/10;
  return '<em style="color:'+c+'">'+sign+mag+(unit||"")+(p!=null?" · "+pctStr(p):"")+'</em>'; }

/* ---- training dashboard ---- */
const DASH_PERIODS=[["4w","4 weeks",28],["12w","12 weeks",84],["26w","6 months",182]];
function dashDays(){ const p=DASH_PERIODS.find(function(x){ return x[0]===dashPeriod; }); return p?p[2]:28; }
function dashLabel(){ const p=DASH_PERIODS.find(function(x){ return x[0]===dashPeriod; }); return p?p[1]:"4 weeks"; }
function sessionsInWindow(days,offsetDays){
  const end=Date.now()-(offsetDays||0)*864e5, start=end-days*864e5;
  return completedSessions().filter(function(s){ const t=new Date(s.completedAt).getTime(); return t>=start&&t<=end; }); }
/* v13 — delegates to the canonical helper so there is exactly one implementation. */
function volumeByGroup(sessions){ return effectiveSetsByGroup(sessions); }
function prsInWindow(days,offsetDays){
  const end=Date.now()-(offsetDays||0)*864e5, start=end-days*864e5;
  return achievementTimeline(0).filter(function(a){ const t=new Date(a.date).getTime(); return t>=start&&t<=end; }); }
/* consistency = share of the weeks in the window where you hit your own session target */
function consistencyPct(days){
  const weeks=Math.max(1,Math.round(days/7)); const target=Math.max(1,(S.settings&&S.settings.sessionsPerWeek)||4);
  const counts=weeklyCounts(weeks);
  const hit=counts.filter(function(w){ return w.count>=target; }).length;
  return {pct:Math.round(hit/weeks*100), hit:hit, weeks:weeks, target:target}; }
function dashboardStats(){
  const d=dashDays();
  const cur=sessionsInWindow(d), prev=sessionsInWindow(d,d);
  const curVol=volumeByGroup(cur), prevVol=volumeByGroup(prev);
  const totals=cur.reduce(function(a,s){ const x=sessionTotals(s); a.sets+=x.sets; a.reps+=x.reps; a.vol+=x.vol; return a; },{sets:0,reps:0,vol:0});
  const prevTotals=prev.reduce(function(a,s){ const x=sessionTotals(s); a.sets+=x.sets; a.reps+=x.reps; a.vol+=x.vol; return a; },{sets:0,reps:0,vol:0});
  return { days:d, workouts:cur.length, prevWorkouts:prev.length,
    perWeek:Math.round(cur.length/(d/7)*10)/10, prevPerWeek:Math.round(prev.length/(d/7)*10)/10,
    totals:totals, prevTotals:prevTotals, curVol:curVol, prevVol:prevVol,
    prs:prsInWindow(d).length, prevPrs:prsInWindow(d,d).length,
    consistency:consistencyPct(d) }; }
/* compact calendar heatmap: one column per week, one cell per day, intensity = working sets */
function heatmapWeeks(nWeeks){
  const byDay={}; completedSessions().forEach(function(s){ const k=dayKey(s.completedAt); byDay[k]=(byDay[k]||0)+sessionSets(s); });
  const out=[]; const base=startOfWeek();
  for(let w=nWeeks-1;w>=0;w--){ const mon=new Date(base); mon.setDate(mon.getDate()-w*7);
    const days=[]; for(let i=0;i<7;i++){ const dte=new Date(mon); dte.setDate(dte.getDate()+i);
      days.push({date:dte, future:dte>new Date(), sets:byDay[dayKey(dte)]||0}); }
    out.push({monday:mon, days:days}); }
  return out; }
function heatLevel(sets){ return sets<=0?0:sets<=6?1:sets<=12?2:3; }

/* ---- ranked improvements / needs attention ---- */
/* Only exercises with enough history get a verdict. Everything thinner is surfaced separately as
   "not enough data" rather than being quietly dropped or, worse, called a decline. */
/* v11 — the boards describe CURRENT training. An exercise you last did six weeks ago (because the
   machine was occupied, or the gym removed it) is real history but says nothing about how you are
   training now, so it is moved to its own "not recently trained" bucket instead of sitting at the
   top of "Biggest improvements". Anything without TREND_MIN_N exposures is "not enough data". */
function progressionBoard(){
  const all=exerciseProgression();
  const withTrend=all.map(function(p){ const d=exerciseTrendData(p.ex.id);
    return Object.assign({},p,{tstate:d.state, stale:d.stale, days:d.days, recentPct:d.pct,
      recentMean:d.recentMean, baseMean:d.baseMean, recentN:d.recentN, baseN:d.baseN, n:d.n}); });
  const thin=withTrend.filter(function(p){ return p.tstate==="insufficient"; });
  const rated=withTrend.filter(function(p){ return p.tstate!=="insufficient"; });
  const stale=rated.filter(function(p){ return p.stale; })
    .sort(function(a,b){ return a.days-b.days; });
  const current=rated.filter(function(p){ return !p.stale; });
  const improving=current.filter(function(p){ return p.tstate==="above"; })
    .sort(function(a,b){ return b.recentPct-a.recentPct; });
  const attention=current.filter(function(p){ return p.tstate==="below"; })
    .sort(function(a,b){ return a.recentPct-b.recentPct; });
  const steady=current.filter(function(p){ return p.tstate==="steady"; });
  return {improving:improving, attention:attention, steady:steady, thin:thin, stale:stale, graded:current.length}; }
/* the plain-English "what changed" line for one exercise */
function progDeltaStr(p){
  if(p.kind==="assist") return p.firstRaw+"kg → "+p.latestRaw+"kg assistance over "+p.n+" sessions";
  if(p.kind==="bw") return (p.firstRaw>0?"+"+p.firstRaw+"kg":"bodyweight")+" → "+(p.latestRaw>0?"+"+p.latestRaw+"kg":"bodyweight")+" over "+p.n+" sessions";
  return Math.round(p.first)+" → "+Math.round(p.latest)+"kg "+p.metric+" over "+p.n+" sessions"; }

/* The three headline totals, each carrying its change against the last comparable workout, then the
   same three against the rolling 4-week per-session average. Two references, clearly labelled. */
/* v11 — exercise-level progression leads, because it is the only view of the session that
   exercise selection cannot distort. Tonnage still appears, but a ± delta is attached to it only
   when the comparison session is genuinely like-for-like (tier 1). */
const PROG_META={ up:{c:"var(--green)",i:"▲"}, down:{c:"var(--red)",i:"▼"}, same:{c:"var(--muted)",i:"="}, new:{c:"var(--accent)",i:"✦"} };
function recapProgress(r){
  const p=r.prog; if(!p||!p.rows.length) return "";
  const bits=[];
  if(p.up) bits.push(p.up+" improved");
  if(p.same) bits.push(p.same+" held");
  if(p.down) bits.push(p.down+" down");
  if(p.fresh) bits.push(p.fresh+" new");
  const rows=p.rows.map(function(x){ const m=PROG_META[x.state]||PROG_META.same;
    return '<div class="exline" data-exhist="'+x.exId+'" style="padding:7px 0;cursor:pointer">'
      +'<div style="flex:1;min-width:0"><div class="nm" style="font-size:13px">'+x.name+'</div>'
      +(x.detail?'<div class="histline">'+x.detail+'</div>':'')+'</div>'
      +'<span class="mono" style="margin-left:8px;color:'+m.c+';font-size:12px;white-space:nowrap">'+m.i+' '+x.text+'</span></div>'; }).join("");
  return '<div class="tiny" style="margin-top:16px">Exercise progression · vs your last time on each</div>'
    +'<div class="histline" style="margin-top:2px;color:var(--text);font-weight:600">'+(bits.join(" · ")||"—")+'</div>'
    +'<div style="margin-top:4px">'+rows+'</div>'; }
function recapDeltas(r){
  const t=r.totals; if(!t) return "";
  const cell=function(val,unit,base){ return '<div class="dcell"><b>'+val+'</b><span>'+unit+'</span>'+deltaChip(val,base,"")+'</div>'; };
  const flat=function(val,unit,note){ return '<div class="dcell"><b>'+val+'</b><span>'+unit+'</span><em style="color:var(--faint)">'+(note||"")+'</em></div>'; };
  const c=r.cmpTotals, cm=r.cmp;
  const volTxt=(t.vol>=1000?(Math.round(t.vol/100)/10)+'k':t.vol);
  let h=recapProgress(r);
  h+='<div class="tiny" style="margin-top:16px">Session totals</div>'
    +'<div class="dgrid"><div class="dcell"><b>'+t.sets+'</b><span>sets</span></div>'
    +'<div class="dcell"><b>'+t.reps+'</b><span>reps</span></div>'
    +'<div class="dcell"><b>'+volTxt+'</b><span>kg volume</span></div></div>';
  if(c&&cm){
    /* the comparison always says which session it picked and why it was considered comparable */
    h+='<div class="tiny" style="margin-top:14px">Compared with '+fmtDate(cm.sess.completedAt)+' · '+cm.why+'</div>';
    if(cm.volComparable){
      h+='<div class="dgrid">'+cell(t.sets,"sets",c.sets)+cell(t.reps,"reps",c.reps)+cell(t.vol,"kg",c.vol)+'</div>';
    } else {
      /* different exercise selection — sets and reps still compare, tonnage does not */
      h+='<div class="dgrid">'+cell(t.sets,"sets",c.sets)+cell(t.reps,"reps",c.reps)+flat(volTxt,"kg volume","not compared")+'</div>'
        +'<div class="histline" style="margin-top:6px">Different exercise selection, so total kg is shown for reference only — exercise-by-exercise above is the real read.</div>';
    }
  } else {
    h+='<div class="histline" style="margin-top:10px">No comparable earlier workout yet — repeat this session type and the comparison appears.</div>';
  }
  if(r.base4){ const b=r.base4;
    h+='<div class="tiny" style="margin-top:14px">vs '+(b.similar?'your last '+b.n+' similar session'+(b.n===1?'':'s'):'4-week average · '+b.n+' session'+(b.n===1?'':'s'))+'</div>'
      +'<div class="dgrid">'+cell(t.sets,"sets",Math.round(b.sets*10)/10)+cell(t.reps,"reps",Math.round(b.reps))
      +(b.similar?cell(t.vol,"kg",Math.round(b.vol)):flat(volTxt,"kg volume","mixed types"))+'</div>';
    if(!b.similar) h+='<div class="histline" style="margin-top:6px">That average mixes different session types, so only sets and reps are compared.</div>';
    if(r.prev4&&b.similar){ const pd=deltaPct(b.vol,r.prev4.vol);
      h+='<div class="histline" style="margin-top:8px">Your rolling average volume on this kind of session is '+(pd==null?'—':pctStr(pd))+' against the previous 4 weeks.</div>'; } }
  return h; }

function dashboardCard(){

  /* v12 — "+3 · +25%" made you decode it. Each KPI now names its own unit and the period it
     is being compared against, on its own line. */
  const kpi=function(val,label,now,base,unit){
    let dd='';
    if(base!=null){ const diff=now-base, pc=deltaPct(now,base);
      const c=(pc==null||Math.abs(pc)<3)?"var(--muted)":(pc>0?"var(--green)":"var(--red)");
      const sign=diff>0?"+":(diff<0?"\u2212":"\u00b1");
      const mag=Math.abs(diff)>=100?Math.round(Math.abs(diff)):Math.round(Math.abs(diff)*10)/10;
      dd='<em style="color:'+c+';display:block;line-height:1.35">'+sign+mag+' '+(unit||label)+'</em>'
        +'<em style="color:var(--faint);display:block;line-height:1.3">'+(pc==null?'\u2014':pctStr(pc))+' vs previous '+dashLabel()+'</em>'; }
    return '<div class="dcell"><b>'+val+'</b><span>'+label+'</span>'+dd+'</div>'; };
  const groups=MUSCLE_GROUPS.map(function(g){ return {key:g.key, label:g.label, v:d.curVol[g.key]||0, p:d.prevVol[g.key]||0}; })
    .filter(function(x){ return x.v>0||x.p>0; }).sort(function(a,b){ return b.v-a.v; });

      +'<span class="mono" style="font-size:10.5px;min-width:46px;text-align:right;color:'+c+'">'+(p==null?'new':pctStr(p))+'</span></div>'; }).join("")
    :'<div class="empty" style="padding:14px">No sets logged in this window.</div>';

  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="tiny">Training dashboard</div><div class="seg mini" style="width:60%">'+pBtns+'</div></div>'

    + '<div class="dcell"><b>'+d.perWeek+'</b><span>per week</span><em style="color:var(--muted)">target '+cons.target+'</em></div>'
    + kpi(d.prs,"personal bests",d.prs,d.prevPrs||null,"PBs")
    + '<div class="dcell"><b style="color:'+(cons.pct>=75?"var(--green)":cons.pct>=50?"var(--amber)":"var(--red)")+'">'+cons.pct+'%</b><span>consistency</span><em style="color:var(--muted)">'+cons.hit+'/'+cons.weeks+' wks</em></div>'
    + '</div>'
    +'<div class="tiny" style="margin-top:16px">Effective sets by muscle GROUP · last '+dashLabel()+'</div>'
    +'<div class="histline" style="margin-top:2px">Chest, back, legs and so on — individual muscles rolled up. Rolling '+dashLabel()+' ending today, compared with the '+dashLabel()+' before it. For per-muscle numbers see <b>Volume &amp; distribution</b> below, which uses its own window.</div>'

/* v11 row shape, applied identically everywhere so the boards scan in one pass:

       1  exercise name (+ badges)

       3  "Previous N: <value> <unit>"

  return '<div class="rrow" data-exhist="'+p.ex.id+'"><span class="rk">'+(i+1)+'</span>'
    +'<div class="rmain"><div class="rnm">'+p.ex.name+(isCustomEx(p.ex)?' <span class="tag" style="color:var(--gold)">custom</span>':'')+'</div>'
    +'<div class="rsub mono">'+(ev.lineACompact||ev.lineA)+'</div>'
    +'<div class="rsub mono" style="opacity:.75">'+(ev.lineBCompact||ev.lineB)+'</div>'
    +(p.stale?'<div class="rsub" style="color:var(--faint)">last trained '+fmtAgo(hist[0]?hist[0].date:null)+'</div>':'')
    +(oc?'<div class="rsub"><span class="tag" style="color:var(--muted);border:1px solid var(--line)">'+oc.text+'</span></div>':'')
    +'</div>'
    +miniSpark(p.ex.id)
    +'<span class="tb '+(TB_CLASS[t.state]||"na")+'" style="margin-left:8px">'+t.icon+' '+(ev.ok?pctStr(p.recentPct):(p.n+"/"+TREND_MIN_N))+'</span></div>'; }

    return '<div class="exline" data-muscle-stat="'+x.m+'" style="padding:7px 0;cursor:pointer"><div style="flex:1"><div class="nm" style="font-size:13px">'+S.muscles[x.m].label+'</div><div class="bar" style="margin-top:5px;display:flex"><i style="width:'+dp+'%;background:var(--accent)"></i><i style="width:'+sp+'%;background:var(--grey)"></i></div></div><span class="mono" style="margin-left:10px">'+x.total.toFixed(1)+'</span></div>'; }).join(""):'<div class="empty" style="padding:16px">No sets logged this week yet.</div>';
  var muscleH='<div class="card"><div class="tiny">Effective sets by INDIVIDUAL muscle · this week (Mon–Sun)</div><p class="muted" style="font-size:11px;margin:4px 0 0"><span style="color:var(--accent)">▮</span> direct (1.0) · <span style="color:var(--grey)">▮</span> indirect (0.5 / 0.25)</p><div style="margin-top:6px">'+mrows+'</div></div>';
  return '<div class="reportshd" style="margin:10px 2px 2px;display:flex;align-items:center;gap:8px"><span style="font-size:18px">📊</span><div class="tiny" style="font-size:13px;text-transform:none;color:var(--text);font-weight:700">Reports · experimental analysis</div></div>'

function incrementFor(e){ return (e.m.quads||e.m.hamstrings||e.m.glutes||e.m.back_lats>=1)?5:2.5; }
/* Next-session target. Direction comes from the exercise's own progression model, so an assisted
   movement is NEVER told to add assistance - progress there means taking assistance away, and at
   zero assistance it graduates to the bodyweight version of the movement. */
function progressionFor(exId){ const e=exById(exId); const last=exerciseHistory(exId)[0];
  if(!last||!last.sets.length) return {weight:"",reps:"",note:"Find a working "+loadNoun(e)+" in "+e.rl+"-"+e.rh+" reps.",add:false,dir:0};
  const ws=last.sets; const tr=Math.max(...ws.map(s=>+s.reps||0));
  const cur=bestRawLoad(e,ws);                       /* heaviest weight, or LOWEST assistance */
  const allTop=ws.length>=2&&ws.every(s=>(+s.reps||0)>=e.rh);
  let inc=incrementFor(e);
  if(isAssisted(e)){
    if(cur<=inc) inc=Math.min(inc,2.5);              /* ease the step down on the last stretch to zero */
    if(cur<=0){ const nx=PROG_CHAINS[e.id];
      return {weight:0,reps:e.rl,dir:1,graduate:nx?nx.next:null,add:true,
        note:"Zero assistance \u2014 you are doing these unassisted. Time to move to the "+(nx?nx.label:"bodyweight version")+"."}; }
    if(allTop){ const t=Math.max(0,Math.round((cur-inc)*10)/10);
      return {weight:t,reps:e.rl,dir:-1,add:true,
        note:"Maxed reps at "+cur+"kg assist \u2192 drop to "+t+"kg assistance, aim "+e.rl+"+ reps."+(t===0?" That is a full bodyweight rep.":"")}; }
    return {weight:cur,reps:"",dir:0,add:false,note:"Hold "+cur+"kg assistance, beat "+tr+" reps on your best set."};
  }
  if(isBodyweightLoaded(e)){
    if(allTop){ const t=Math.round((cur+inc)*10)/10;
      return {weight:t,reps:e.rl,dir:1,add:true,
        note:(cur<=0?"Maxed reps at bodyweight \u2192 add "+inc+"kg":"Maxed reps at +"+cur+"kg \u2192 go to +"+t+"kg")+", aim "+e.rl+"+ reps."}; }
    return {weight:cur,reps:"",dir:0,add:false,
      note:(cur>0?"Hold +"+cur+"kg":"Hold bodyweight")+", beat "+tr+" reps on your top set."};
  }
  if(allTop) return {weight:cur+inc,reps:e.rl,dir:1,add:true,note:"Maxed reps last time \u2192 up to "+(cur+inc)+"kg, aim "+e.rl+"+ reps."};
  return {weight:cur,reps:"",dir:0,add:false,note:"Match "+cur+"kg, beat "+tr+" reps on your top set."}; }
function fatigueFlag(exId){ const ex=exById(exId); const h=exerciseHistory(exId).slice(0,3); if(h.length<3) return null;

  if(e1[2]>0 && e1[0]<e1[1] && e1[1]<=e1[2] && (e1[2]-e1[0])/Math.abs(e1[2])>=0.03)
    return (isAssisted(ex)?"Needing more assistance two sessions running":"Est. 1RM down two sessions")+" \u2014 consider a lighter day or deload.";
  return null; }

/* RECOMMENDATION — recovery is the gate, weekly volume is the tie-breaker (P-bug fix).
   Recovering/overloaded muscles score a sentinel low and are never trainable today;
   caution muscles are heavily penalised and their volume-need boost is muted. */
const TIER_BASE={primary:100,secondary:62,maintenance:34};
/* ---------------------------------------------------------------- v12 FAMILIARITY MODEL
   The recommender was picking library-correct exercises the athlete never actually uses, so
   every session needed swapping. Familiarity is now a first-class term: how often you have
   trained an exercise, how recently, whether you use that equipment, and your stated preference.
   Novel exercises are not banned — they simply stop being the default pick. */
const FAM_WEIGHT_EX=78, FAM_WEIGHT_EQUIP=26, FAM_NOVEL_PENALTY=52, FAM_CONFIDENCE_SESSIONS=8;
const FAMILIAR_WINDOW_DAYS=84;      /* 12 weeks of history informs "what I actually use" */
let _famCache=null, _famStamp=null;
function familiarityIndex(){
  const stamp=(S.sessions||[]).length+"|"+((S.sessions||[]).slice(-1)[0]||{}).completedAt;
  if(_famCache&&_famStamp===stamp) return _famCache;
  const cutoff=Date.now()-FAMILIAR_WINDOW_DAYS*864e5;
  const byEx={}, byEquip={}; let totalSessions=0, maxEx=0;
  completedSessions().forEach(function(s){
    if(new Date(s.completedAt).getTime()<cutoff) return;
    totalSessions++;
    const seen={};
    (s.entries||[]).forEach(function(en){ if(!workingSets(en).length) return;
      if(seen[en.exId]) return; seen[en.exId]=1;
      byEx[en.exId]=(byEx[en.exId]||0)+1;
      const e=exById(en.exId); const eq=(e&&e.equip)||"other";
      byEquip[eq]=(byEquip[eq]||0)+1; });
  });
  Object.keys(byEx).forEach(function(k){ if(byEx[k]>maxEx) maxEx=byEx[k]; });
  _famStamp=stamp;
  _famCache={ byEx:byEx, byEquip:byEquip, sessions:totalSessions, maxEx:maxEx };
  return _famCache; }
/* 0 = never used, 1 = your most-used exercise. Equipment familiarity is a softer, separate term. */
function familiarityScore(ex){
  const f=familiarityIndex();
  if(!f.sessions||!f.maxEx) return {ex:0, equip:0, uses:0};
  const uses=f.byEx[ex.id]||0;
  const eq=(ex.equip||"other");
  const eqUses=f.byEquip[eq]||0;
  /* Confidence: with two sessions of history "most used" is noise, so the whole familiarity
     term is scaled by how much history actually exists. At 8+ recent sessions it applies in
     full; below that it fades out and recovery/volume logic keeps its original authority. */
  const conf=Math.min(1, f.sessions/FAM_CONFIDENCE_SESSIONS);
  return { ex:Math.min(1,uses/f.maxEx)*conf, equip:Math.min(1,eqUses/Math.max(1,f.sessions))*conf,

function isFamiliar(ex){ return familiarityScore(ex).uses>=2; }
/* v12 — USAGE PROVES AVAILABILITY. Two separate faults were excluding exercises the athlete
   actually trains from ever being recommended:
     1. FORCE_AVAIL was declared with a comment saying it overrides stale availability, but was
        never referenced anywhere in the file — so machine_lat_raise, bitri_machine_curl and the
        rest stayed avail:"no" and could not be picked.
     2. Even without that, a stale avail flag outranked the evidence of your own logbook.
   If you have logged working sets on an exercise inside the familiarity window, you plainly have
   access to it, and that beats any flag. Applied at the pool filter only — the Settings toggle
   still shows and controls the underlying value. */
const REGULAR_USE_MIN=3;   /* logged this often in the window = part of your actual routine */
function usableInPool(e){
  if(!e) return false;
  if(e.pref==="avoid") return false;              /* an explicit dislike is always final */
  const uses=familiarityIndex().byEx[e.id]||0;
  const availOk = AVAIL_OK[e.avail] || FORCE_AVAIL.indexOf(e.id)>=0 || uses>0;
  if(!availOk) return false;
  /* `rec:false` means "do not auto-programme this". Seeded defaults mark a lot of gym machines
     that way, which is why exercises trained every week were never being offered. Regular logged
     use overrides the seeded flag; `pref:"avoid"` above remains the way to veto something. */
  if(e.rec===false && uses<REGULAR_USE_MIN) return false;
  return true; }

/* ================================================================ v13 ASSISTED WORKOUT BUILDER
   The auto-recommender decides the whole session for you. In practice the workflow was: generate
   a session, delete most of it, then hand-add the exercises actually wanted. That is the
   recommender being used as a very expensive exercise picker.

   So "Build Workout" now ranks INDIVIDUAL exercises and lets you assemble the session yourself.
   Same inputs as the recommender, different output shape: ingredients, not a finished meal.
   "Tell me what to train" is untouched and remains the fully automatic path.

   Ranking, in the order the brief specified:
     1  muscles below weekly minimum volume   -> muscleScores() volume-need term
     2  muscles currently recovered / ready   -> muscleScores() readiness term (blocked = excluded)
     3  configured muscle priorities          -> muscleScores() TIER_BASE term
     4  exercises performed frequently        -> familiarityScore().ex   (weighted HARD here)
     5  equipment regularly used              -> familiarityScore().equip
     6  exercise preferences                  -> PREF_SCORE
     7  avoid + limitation rules              -> usableInPool() + limBlock(), both hard filters

   Familiarity is weighted noticeably higher than in recommend(), because the explicit brief is
   "strongly favour exercises I actually train regularly". It still cannot resurrect a muscle that
   the recovery engine says is blocked, and it never overrides pref:"avoid" or an active
   limitation, both of which remain hard exclusions. */
const BUILD_FAM_WEIGHT_EX=132;        /* how often you do THIS exercise (dominant term) */
const BUILD_FAM_WEIGHT_EQUIP=38;      /* how much you use this equipment */
const BUILD_NOVEL_PENALTY=74;         /* never logged, and we have enough history to know */
const BUILD_MAX_PER_MUSCLE=2;         /* keep the shortlist spread across what needs work */
const BUILD_SHORTLIST=8;

/* Shared scoring for one exercise, used by both the shortlist and the Today one-tap add. */
function builderExValue(e,byM,lastExMap,now){
  const pm=primaryMuscle(e); const lead=byM[pm];
  if(!lead||!lead.trainable) return null;          /* 2 + 7: direct muscle not trainable today */
  let val=0;
  /* 1 + 2 + 3 — reuse the exact muscle scores the recommender uses, so Build Workout and
     Tell me what to train can never disagree about what needs work. */
  for(const mk in e.m){ if(!Object.prototype.hasOwnProperty.call(e.m,mk)) continue;
    const sc=byM[mk]; if(!sc||!sc.trainable) continue; val+=sc.score*e.m[mk]; }
  /* 4 + 5 */
  const fam=familiarityScore(e);
  val+=fam.ex*BUILD_FAM_WEIGHT_EX;
  val+=fam.equip*BUILD_FAM_WEIGHT_EQUIP;
  if(fam.uses===0 && familiarityIndex().sessions>=4) val-=BUILD_NOVEL_PENALTY*fam.conf;
  else if(fam.uses===1) val-=BUILD_NOVEL_PENALTY*0.4*fam.conf;
  /* 6 */
  val+=PREF_SCORE[e.pref]*1.4;
  if(e.rec) val+=8;
  /* exact-exercise cooldown, mirroring recommend() so you are not offered yesterday's work */
  const lx=lastExMap[e.id];
  if(lx){ const h=hoursBetween(lx.date,now); if(h<24) val-=140; else if(h<48) val-=70; else if(h<72) val-=25; }
  return {ex:e, exId:e.id, muscle:pm, label:(S.muscles[pm]||{}).label||pm,
    val:val, gap:Math.max(0,lead.cfg.min-lead.v), v:lead.v, min:lead.cfg.min,
    status:lead.status, uses:fam.uses}; }

/* Every exercise that is legal to offer right now, best first. excludeIds is a plain object of
   exercise ids already in the draft, so "Added" rows drop out of the shortlist. */
function builderRanked(excludeIds){
  const scored=muscleScores({}); const byM={}; scored.forEach(function(x){ byM[x.m]=x; });
  const excl=excludeIds||{}; const now=new Date(); const lastExMap=lastExerciseMap();
  const out=[];
  S.exercises.forEach(function(e){
    if(excl[e.id]) return;
    if(!usableInPool(e)) return;                    /* 7: pref avoid, availability, rec flag */
    if(limBlock(e)) return;                         /* 7: active injury / equipment limitation */
    const c=builderExValue(e,byM,lastExMap,now);
    if(c) out.push(c); });
  out.sort(function(a,b){ return (b.val-a.val)||a.ex.name.localeCompare(b.ex.name); });
  return out; }

/* Shortlist for the "Recommended to add" panel. Capped per muscle so eight rows cover several
   things that need work rather than eight variations of the same press. */
function builderShortlist(excludeIds,limit){
  const ranked=builderRanked(excludeIds); const perM={}; const picked=[];
  const cap=limit||BUILD_SHORTLIST;
  for(let i=0;i<ranked.length;i++){ const c=ranked[i];
    const n=perM[c.muscle]||0; if(n>=BUILD_MAX_PER_MUSCLE) continue;
    perM[c.muscle]=n+1; picked.push(c); if(picked.length>=cap) break; }
  return picked; }

/* The single best familiar, eligible exercise for one specific muscle — what the Today priority
   row's "+ Add" uses. Direct work (credit >= 1) is preferred over an exercise that only catches
   indirect credit, because a muscle below its minimum wants training, not spillover. */
/* You tapped the TRICEPS row, so you get a triceps exercise.
   This was a real bug found in v13 testing: the first implementation added the target muscle's
   credit as a bonus on top of the general score, which meant a familiar chest press — scoring
   highly because it also serves chest and front delts, both also below minimum — beat a direct
   tricep extension on the triceps row. Adding a chest press does not close a triceps gap, and
   it is not what the tap said it would do.

   So direct work is now a HARD TIER, not a bonus: if any exercise trains this muscle directly
   (credit >= 1) then only those are considered, and indirect-credit exercises are used solely
   when no direct option is eligible at all. Within the chosen tier the ordinary ranking decides,
   so you still get the FAMILIAR direct exercise rather than an unfamiliar one. */
function bestForMuscleFromRanked(ranked,muscle){
  const direct=[], secondary=[];
  for(let i=0;i<ranked.length;i++){ const c=ranked[i];
    const credit=c.ex.m[muscle]||0;
    if(credit>=1) direct.push({c:c,credit:credit});
    else if(credit>=0.5) secondary.push({c:c,credit:credit}); }
  const tier=direct.length?direct:secondary;
  let best=null;
  for(let i=0;i<tier.length;i++){ const t=tier[i];
    /* within the tier, credit still breaks ties: 1.0 beats 0.75 on the same score */
    const adj=t.c.val+t.credit*40;
    if(!best||adj>best.adj) best={adj:adj, ex:t.c.ex, exId:t.c.exId, muscle:muscle, credit:t.credit}; }
  return best; }
/* Convenience wrapper. Takes its own single pass when no ranked list is to hand — the Today
   snapshot builds one list and reuses it across every priority row instead of paying for
   muscleScores() and the familiarity pass once per row on a phone. */
function bestExerciseForMuscle(muscle,excludeIds){
  return bestForMuscleFromRanked(builderRanked(excludeIds),muscle); }

/* -------------------------------------------------------------- v13 DRAFT HELPERS
   A "draft" is just an activeSession that has not been finished. These helpers exist so the
   Today one-tap add and the builder panel share exactly one code path into it, and so every
   mutation goes through saveActive() — the v10+ durability net (localStorage mirror + journal
   + periodic snapshot) is unchanged and still the only writer. */
const BUILD_TITLE="Build workout";
function draftExIds(){ const o={}; if(activeSession) (activeSession.entries||[]).forEach(function(en){ o[en.exId]=true; }); return o; }
function inDraft(exId){ return !!draftExIds()[exId]; }
/* Creates the draft only if one is not already open. Never touches a finished session. */
function ensureDraft(){
  if(activeSession) return activeSession;
  loggerOpen={}; rerollCounts={};
  activeSession={ id:uid(), startedAt:iso(new Date()), dateISO:new Date().toISOString().slice(0,10),
    title:BUILD_TITLE, mode:"manual", entries:[] };
  saveActive();
  return activeSession; }
/* Returns true if it actually added. Duplicates are refused, which is what makes "Added" safe
   to show and what stops a double-tap on a phone creating two copies. */
function addToDraft(exId){
  const e=exById(exId); if(!e) return false;
  ensureDraft();
  if(inDraft(exId)) return false;
  activeSession.entries.push({ exId:exId,
    sets:Array.from({length:DEFAULT_WORK_SETS},function(){ return {weight:"",reps:"",type:"work",done:false}; }) });
  loggerOpen[activeSession.entries.length-1]=true;
  saveActive();
  return true; }

function muscleScores(r){ const vol=weeklyVolume(); const wk=weekSessions().length; const remaining=Math.max(1,S.settings.sessionsPerWeek-wk); const avoid=(r&&r.avoid)||[]; const out=[];
  for(const [m,cfg] of Object.entries(S.muscles)){ const v=vol[m]; const status=recoveryStatus(m);
    const avoided=avoid.includes(m); const trainable=status!=="recovering"&&status!=="overloaded"&&!avoided;
    let score=TIER_BASE[cfg.tier];
    if(trainable){ const cautionK=status==="caution"?0.28:1;        // mute volume-need while recovering
      if(v<cfg.min) score+=85*cautionK; else if(v<cfg.gl) score+=42*cautionK; else if(v<cfg.gh) score+=16*cautionK;
      if(v>=cfg.cap) score-=130; else if(v>=cfg.cap*0.85) score-=55;
      score+=({ready:18,caution:-70,untrained:25}[status]||0);
      if(v<cfg.min&&status!=="caution") score+=38/remaining;
    } else { score=-999; }
    if(avoided) score-=1000;
    out.push({m,cfg,v,status,score,trainable}); }
  out.sort((a,b)=>b.score-a.score); return out; }
function recommend(r,opts){ r=r||{}; opts=opts||{}; const time=r.time||60; const maxEx=time<=30?3:time<=45?4:5;
  const lowEnergy=(r.energy&&r.energy<=2)||(r.sleep&&r.sleep<=2); const highSore=(r.soreness&&r.soreness>=4);
  const scored=muscleScores(r); const wk=weekSessions().length; const remaining=S.settings.sessionsPerWeek-wk;
  const belowMin=scored.filter(s=>s.v<s.cfg.min&&s.trainable);
  const lim=activeLimitation();
  const pool=S.exercises.filter(e=>usableInPool(e)&&!limBlock(e)); const chosen=[]; const covered={}; const now=new Date();  // v6: only recommendable/familiar gym exercises · v7: pref "avoid" = hard exclusion, never just a penalty
  /* v7 reroll: memoised per-call jitter (deterministic when opts.reroll is off, so tests/engine stay stable) */
  const _jmap={}; function jit(id){ if(!opts.reroll) return 0; if(!(id in _jmap)) _jmap[id]=Math.random()*36-18; return _jmap[id]; }
  const lastExMap=lastExerciseMap(), lastPatMap=lastPatternMap(), ltMap=lastTrainedMap();
  /* relaxed=true lets the fallback pass program a caution/recovering muscle when nothing fresher exists */
  function exValue(ex,relaxed){ let val=0,bad=false,cautionLead=false;
    const lx=lastExMap[ex.id]; if(lx){ const h=hoursBetween(lx.date,now); if(h<48){ val-=110; if(h<24&&!relaxed) bad=true; } else if(h<72) val-=34; }   // exact-exercise cooldown (strongest)
    const lp=lastPatMap[ex.pattern]; if(lp){ const h=hoursBetween(lp.date,now); if(h<30) val-=55; else if(h<48) val-=22; }                          // movement-pattern cooldown
    for(const [m,c] of Object.entries(ex.m)){ const sc=scored.find(x=>x.m===m); if(!sc) continue;
      if(c>=1){ if(sc.status==="recovering"||sc.status==="overloaded"){ if(relaxed){ cautionLead=true; val-=40; } else { bad=true; } }
        else if(sc.status==="caution"){ if(relaxed){ cautionLead=true; val-=18; } else { val-=85; } } }
      else if(c>=0.5){ if(sc.status==="recovering"||sc.status==="overloaded") val-=42; else if(sc.status==="caution") val-=16; }   // indirect partial fatigue
      const usable=sc.trainable||relaxed; if(!usable) continue; const dim=(covered[m]||0)>0?0.35:1;
      val+=(sc.trainable?sc.score:Math.max(sc.score,-40))*c*dim; }
    val+=PREF_SCORE[ex.pref]*1.2;
    /* v12 familiarity — dominant enough to decide between two otherwise comparable exercises,
       but never enough to override recovery (bad=true) or a below-minimum muscle's need. */
    const fam=familiarityScore(ex);
    val += fam.ex*FAM_WEIGHT_EX;                                  /* how often you do this exercise */
    val += fam.equip*FAM_WEIGHT_EQUIP;                            /* how much you use this equipment */
    if(fam.uses===0 && familiarityIndex().sessions>=4) val-=FAM_NOVEL_PENALTY*fam.conf;   /* never used, and we have enough history to know */
    else if(fam.uses===1) val-=FAM_NOVEL_PENALTY*0.35*fam.conf;   /* tried once — mild */
    if(ex.rec) val+=10;                                           /* flagged as a default gym option */
    /* v7 reroll: push away from proposals you've already rejected + shuffle near-ties */
    const rrN=opts.avoidIds?(opts.avoidIds[ex.id]||0):0; if(rrN) val-=90*Math.min(rrN,2);
    val+=jit(ex.id);
    /* intra-session variety: avoid two near-identical exercises in one workout */
    const pm=primaryMuscle(ex);
    for(const c of chosen){ const ce=exById(c.exId); if(!ce) continue;
      if(ce.pattern===ex.pattern){ val-=130; break; } }                                  // same movement pattern already in session
    if(val>-9999){ const samePrimary=chosen.some(c=>{ const ce=exById(c.exId); return ce&&primaryMuscle(ce)===pm&&ce.pattern!==ex.pattern; });
      if(samePrimary) val-=42; }                                                          // same direct muscle, different pattern — mild (variety across angles)
    if(highSore&&ex.type==="compound") val-=22; if(lowEnergy&&ex.fatigue>=2.5) val-=18; return {val,bad,cautionLead}; }
  function fill(relaxed,thresh){ let safety=0;
    while(chosen.length<maxEx && safety++<60){ let best=null,bestEx=null,bestCaution=false;
      for(const ex of pool){ if(chosen.find(c=>c.exId===ex.id)) continue; const {val,bad,cautionLead}=exValue(ex,relaxed); if(bad||val<=thresh) continue; if(best===null||val>best){ best=val; bestEx=ex; bestCaution=cautionLead; } }
      if(!bestEx) break; const leadM=primaryMuscle(bestEx); const sc=scored.find(x=>x.m===leadM); let sets=DEFAULT_WORK_SETS;
      if(sc&&sc.cfg.tier==="primary"&&sc.v<sc.cfg.gh&&sc.status==="ready") sets=3; if(sc&&sc.v>=sc.cfg.cap*0.85) sets=2; if(lowEnergy||highSore) sets=Math.min(sets,2);
      chosen.push({exId:bestEx.id,sets,caution:bestCaution}); for(const [m,c] of Object.entries(bestEx.m)){ if(c>=0.5) covered[m]=(covered[m]||0)+sets*c; } } }
  fill(false,0);
  /* DIRECT-COVERAGE: a below-min, ready, PRIORITY-tier muscle must get an exercise where it is the direct target (c>=1) */
  const needDirect=scored.filter(s=>s.v<s.cfg.min&&s.trainable&&(s.status==="ready"||s.status==="untrained")&&s.cfg.tier==="primary");
  const protectedM=new Set(needDirect.map(x=>x.m));
  needDirect.forEach(nd=>{ if(chosen.some(c=>exById(c.exId).m[nd.m]>=1)) return;
    const cand=pool.filter(e=>e.m[nd.m]>=1&&!chosen.find(c=>c.exId===e.id)&&!exValue(e,false).bad).sort((a,b)=>(exValue(b,false).val-exValue(a,false).val)||(PREF_SCORE[b.pref]-PREF_SCORE[a.pref]))[0];
    if(!cand) return;                                                  // no direct option (limitation / library) — explained below
    const fillSets=(lowEnergy||highSore)?Math.min(DEFAULT_WORK_SETS,2):DEFAULT_WORK_SETS;   /* v11: gap-fillers honour the same fatigue rule as the main picks */
    if(chosen.length<maxEx){ chosen.push({exId:cand.id,sets:fillSets,caution:false}); for(const [m,c] of Object.entries(cand.m)){ if(c>=0.5) covered[m]=(covered[m]||0)+fillSets*c; } }
    else { let worstIdx=-1,worstVal=Infinity;
      chosen.forEach((c,ci)=>{ const e=exById(c.exId); const guards=[...protectedM].some(pm=>pm!==nd.m&&e.m[pm]>=1); if(guards) return; const v=exValue(e,false).val; if(v<worstVal){ worstVal=v; worstIdx=ci; } });
      if(worstIdx>=0) chosen.splice(worstIdx,1,{exId:cand.id,sets:fillSets,caution:false}); } });
  if(chosen.length<Math.min(maxEx,3)) fill(true,-150);   // nothing fresh left — program caution work, flagged
  let tot=chosen.reduce((s,c)=>s+c.sets,0); while(tot>MAX_SESSION_SETS){ const b=chosen.filter(c=>c.sets>2)[0]; if(!b) break; b.sets--; tot--; }
  chosen.sort((a,b)=>orderScore(a)-orderScore(b));   // strategic order
  /* ---- explainability (direct vs indirect precision) ---- */
  const covF={}; chosen.forEach(c=>{ const e=exById(c.exId); for(const [m,k] of Object.entries(e.m)){ if(k>=0.5) covF[m]=(covF[m]||0)+c.sets*k; } });
  const isDirect=(m)=>chosen.some(c=>exById(c.exId).m[m]>=1);
  const secVia=(m)=>{ const e=chosen.map(c=>exById(c.exId)).find(e=>e.m[m]>=0.5&&e.m[m]<1); return e?e.name:null; };
  const why=[]; const lead=Object.keys(covF).filter(isDirect).sort((a,b)=>covF[b]-covF[a]).slice(0,3).map(m=>S.muscles[m].label.toLowerCase());
  if(lead.length) why.push({t:"go",x:"Today’s focus (trained directly): "+lead.join(", ")+"."});
  belowMin.filter(b=>isDirect(b.m)).slice(0,3).forEach(b=>why.push({t:"go",x:b.cfg.label+" below minimum ("+b.v.toFixed(1)+"/"+b.cfg.min+") and recovered — included directly."}));
  belowMin.filter(b=>!isDirect(b.m)&&(b.cfg.tier==="primary"||secVia(b.m))).slice(0,3).forEach(b=>{ const via=secVia(b.m);
    if(via){ why.push({t:"warn",x:b.cfg.label+" below minimum — partially covered via "+via+" (indirect credit only), no direct exercise."}); }
    else { let reason="no direct option available"; const directOpts=S.exercises.filter(e=>e.m[b.m]>=1&&usableInPool(e)&&e.pref!=="avoid");
      if(lim&&directOpts.length&&directOpts.every(e=>limBlock(e))) reason="active limitation blocks all direct options";
      else if(chosen.length>=maxEx) reason="session already at its exercise cap";
      else if(!directOpts.length) reason="no direct exercise available";
      why.push({t:"warn",x:b.cfg.label+" below minimum but not directly trained — "+reason+"."}); } });
  scored.filter(s=>s.status==="recovering"||s.status==="overloaded").sort((a,b)=>(b.cfg.tier==="primary")-(a.cfg.tier==="primary")).slice(0,2).forEach(s=>{ const w=readyInHours(s.m); const lt=ltMap[s.m];
    why.push({t:"neg",x:s.cfg.label+" trained "+fmtAgo(lt&&lt.date)+" — "+(s.status==="overloaded"?"at weekly cap, still ":"")+"recovering"+(w>0?", wait ~"+w+"h":"")+" (not included due to recovery)."}); });
  if(lim){ const nm=limitationBlockedNames(); const ex2=nm.slice(0,2).join(" and ")||"some exercises"; why.push({t:"neg",x:ex2+(nm.length>2?" + others":"")+" excluded due to active limitation: "+lim.name+(lim.area?" ("+lim.area+")":"")+"."}); }
  chosen.filter(c=>c.caution).slice(0,2).forEach(c=>{ const m=primaryMuscle(exById(c.exId)); why.push({t:"warn",x:S.muscles[m].label+" still in caution window — included only because nothing fresher was available."}); });
  scored.filter(s=>s.v>=s.cfg.cap*0.85&&s.trainable&&s.status!=="caution").slice(0,1).forEach(s=>why.push({t:"warn",x:s.cfg.label+" near cap ("+s.v.toFixed(1)+"/"+s.cfg.cap+") — capped."}));
  if(remaining<=1&&wk<S.settings.sessionsPerWeek) why.push({t:"warn",x:"Only "+Math.max(0,remaining)+" session left this week — high-leverage catch-up."});
  if(highSore) why.push({t:"warn",x:"High soreness — leaning isolation, sets capped at 2."});
  if(lowEnergy) why.push({t:"warn",x:"Low energy/sleep — volume trimmed."});
  const musclesHit=Object.keys(covF).filter(m=>covF[m]>0).sort((a,b)=>covF[b]-covF[a]).map(m=>S.muscles[m].label);
  const orderNote=chosen.length>1?"Order set for performance: compounds and priority muscles while you’re fresh, isolation and pump work last.":"";
  /* v12 — one plain sentence saying why THIS session, before the detailed bullets. */
  const leadM=scored.filter(function(x){ return x.trainable && x.v<x.cfg.min; })
    .sort(function(a,b){ return (b.cfg.min-b.v)-(a.cfg.min-a.v); }).slice(0,2);
  const famN=chosen.filter(function(c){ const e=exById(c.exId); return e&&isFamiliar(e); }).length;
  let reason;
  if(leadM.length) reason="Prioritising "+leadM.map(function(x){ return x.cfg.label.toLowerCase(); }).join(" and ")
      +" because "+(leadM.length>1?"both are":"it is")+" below weekly target and recovered.";
  else if(musclesHit.length) reason="Everything is at target, so this session spreads work across "+musclesHit.slice(0,3).join(", ").toLowerCase()+" while they are fresh.";
  else reason="Nothing is fully recovered — this is a light session.";
  if(chosen.length) reason+=" "+famN+" of "+chosen.length+" are exercises you train regularly.";
  return {title:musclesHit.slice(0,3).join(" · ")||"Recovery session", why, reason, exercises:chosen, musclesHit, time, orderNote}; }

    .map(function(pr){ return {m:pr[0], c:pr[1], label:S.muscles[pr[0]].label, tier:creditTier(pr[1])}; }); }
/* compact, single line: "Rear delts Direct 1.0 · Upper back Indirect 0.5" — for picker rows, the

function weekStatus(){ const sess=weekSessions(); const vol=weeklyVolume(sess); const target=S.settings.sessionsPerWeek;
  const primaryBelow=[], otherBelow=[], trained=[];
  Object.entries(S.muscles).forEach(([m,cfg])=>{ const v=vol[m]; if(v>=0.5) trained.push(m); if(v<cfg.min){ (cfg.tier==="primary"?primaryBelow:otherBelow).push(m); } });
  const needsAttention=primaryBelow.concat(otherBelow).filter(m=>{ const st=recoveryStatus(m); return st!=="recovering"&&st!=="overloaded"; });
  return {sess:sess.length, target, vol, primaryBelow, otherBelow, trained, needsAttention}; }
/* ---------------------------------------------------------------- v12 WEEKLY SNAPSHOT
   Today's job is to answer "what should I focus on?" in one glance. Everything here comes from
   the volume minimums you already configured and the existing recovery engine — no new targets
   are invented. Muscles are ranked by how far below minimum they are, gated by whether they are
   actually trainable right now, because a big gap on a muscle that is still recovering is not
   today's priority. */
function weeklySnapshot(){
  const sess=weekSessions(), vol=weeklyVolume(sess), target=S.settings.sessionsPerWeek||4;
  const remaining=Math.max(0,target-sess.length);
  const rows=[];
  Object.entries(S.muscles).forEach(function(pr){
    const m=pr[0], cfg=pr[1], v=vol[m]||0;
    const con=muscleContrib(m,sess);
    const st=recoveryStatus(m);
    const gap=Math.max(0,cfg.min-v);
    rows.push({m:m, label:cfg.label, tier:cfg.tier, v:v, min:cfg.min, gap:gap,
      direct:con.direct, secondary:con.secondary, status:st,
      ready:(st==="ready"||st==="untrained"), moderate:(st==="caution"),
      blocked:(st==="recovering"||st==="overloaded")});
  });
  const tierRank={primary:0,secondary:1,maintenance:2};
  /* priority = below minimum AND trainable, worst gap first, priority muscles ahead of the rest */
  const priority=rows.filter(function(r){ return r.gap>0.01 && !r.blocked; })
    .sort(function(a,b){ return (tierRank[a.tier]-tierRank[b.tier]) || (b.gap-a.gap) || (a.ready?-1:1); });
  const covered=rows.filter(function(r){ return r.gap<=0.01 && r.v>0; })
    .sort(function(a,b){ return b.v-a.v; });
  const recovering=rows.filter(function(r){ return r.blocked; })
    .sort(function(a,b){ return (tierRank[a.tier]-tierRank[b.tier]) || b.gap-a.gap; });
  return {sessions:sess.length, target:target, remainingSessions:remaining,
    rows:rows, priority:priority, covered:covered, recovering:recovering}; }
const READY_META={ ready:{t:"Ready",c:"var(--green)"}, untrained:{t:"Ready",c:"var(--green)"},
  caution:{t:"Moderate recovery",c:"var(--amber)"}, recovering:{t:"Recovering",c:"var(--violet)"},
  overloaded:{t:"At cap",c:"var(--red)"} };
function snapshotCard(){
  const s=weeklySnapshot();
  /* v13 - one ranked pass, reused by every priority row. Building it per row would re-run
     muscleScores() and the whole familiarity pass five times on every Today render, which is
     exactly the sort of thing that feels sluggish on a phone. */
  const _draft=draftExIds();
  const _ranked=builderRanked(_draft);
  const _pick={}, _cov={};
  s.priority.slice(0,5).forEach(function(r){
    _pick[r.m]=bestForMuscleFromRanked(_ranked,r.m);
    /* "Added" is about the MUSCLE, not one exercise: once the draft contains direct work for a
       muscle, that muscle is handled for this session. Without this the row would immediately
       offer the next-best exercise for the same muscle, and because weekly volume only counts
       FINISHED sessions the gap would not visibly move — so you could stack five calf exercises
       into one draft without the screen ever telling you. */
    _cov[r.m]=Object.keys(_draft).some(function(id){ const e=exById(id); return e&&(e.m[r.m]||0)>=1; }); });
  const pill=function(st){ const m=READY_META[st]||READY_META.ready;
    return '<span class="mono" style="font-size:10.5px;color:'+m.c+';white-space:nowrap">'+m.t+'</span>'; };
  const setsWord=function(n){ const x=Math.round(n*10)/10; return x+' set'+(x===1?'':'s'); };
  /* v13 - a priority row now carries its own action. The row still opens the muscle detail; the
     "+ Add" button carries data-nodrill so the two never fire together. The button appears only
     when there IS a familiar, eligible exercise for that muscle - an action that might silently
     do nothing is worse than no action. Same ranking as the Build Workout shortlist, so Today
     and the builder can never recommend different things for the same muscle. */
  const prow=function(r){
    const cand=_pick[r.m];
    const added=!!_cov[r.m];
    const act=(!cand&&!added)?''
      :(added?'<span class="tag" data-nodrill="1" style="color:var(--green);border:1px solid rgba(46,204,113,.35);margin-left:8px;white-space:nowrap">Added \u2713</span>'
             :'<button class="btn sm accent" data-addmuscle="'+r.m+'" data-nodrill="1" style="margin-left:8px;white-space:nowrap">+ Add</button>');
    return '<div class="exline" data-muscle="'+r.m+'" style="padding:6px 0;cursor:pointer">'
      +'<div style="flex:1;min-width:0"><div class="nm" style="font-size:13px">'+r.label
      +(r.tier==="primary"?' <span class="tag" style="color:var(--gold)">priority</span>':'')+'</div>'
      +'<div class="histline">'+r.v.toFixed(1)+'/'+r.min+' \u00b7 '+setsWord(r.gap)+' below minimum'
      +(r.secondary>0.05?' \u00b7 '+r.direct.toFixed(1)+' direct + '+r.secondary.toFixed(1)+' indirect':'')+'</div>'
      +(added?'<div class="histline" style="color:var(--faint)">already in this workout</div>'
             :(cand?'<div class="histline" style="color:var(--faint)">adds: '+escAttr(cand.ex.name)+'</div>':''))+'</div>'
      +pill(r.status)+act+'</div>'; };
  const chips=function(list){ return list.map(function(r){
    return '<span class="tag" data-muscle="'+r.m+'" style="cursor:pointer;color:var(--muted);border:1px solid var(--line);margin:2px 4px 2px 0;display:inline-block">'+r.label+' '+r.v.toFixed(1)+'</span>'; }).join(""); };
  const tcol=s.sessions>=s.target?"var(--green)":s.sessions>=s.target-1?"var(--amber)":"var(--accent)";
  let h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'
    +'<div class="tiny">This week · Mon–Sun</div>'
    +'<div class="mono" style="font-size:13px;color:'+tcol+';font-weight:700">'+s.sessions+'/'+s.target+' sessions</div></div>';
  if(s.priority.length){
    h+='<div class="tiny" style="margin-top:12px;color:var(--accent)">Priority · below weekly minimum &amp; trainable</div>'
      +'<div style="margin-top:2px">'+s.priority.slice(0,5).map(prow).join("")+'</div>';
    if(s.priority.length>5) h+='<div class="histline" style="margin-top:4px">+'+(s.priority.length-5)+' more below minimum</div>';
  } else {
    h+='<div class="histline" style="margin-top:12px;color:var(--green)">Every muscle is at or above its weekly minimum.</div>';
  }
  if(s.covered.length) h+='<div class="tiny" style="margin-top:14px">Already covered</div><div style="margin-top:4px">'+chips(s.covered.slice(0,8))+'</div>';
  if(s.recovering.length) h+='<div class="tiny" style="margin-top:12px;color:var(--violet)">Still recovering</div><div style="margin-top:4px">'+chips(s.recovering.slice(0,6))+'</div>';
  h+='<div class="histline" style="margin-top:12px">'+(s.remainingSessions?s.remainingSessions+' session'+(s.remainingSessions===1?'':'s')+' left to hit your target.':'Weekly session target met.')+'</div>';
  return h+'</div>'; }

/* ---------------- LOGGER (new + edit) ---------------- */
function loggerCurrentIndex(){ for(let i=0;i<activeSession.entries.length;i++){ const en=activeSession.entries[i]; if(en.sets.some(s=>s.type!=="warm"&&!isLogged(s))) return i; } return activeSession.entries.length-1; }
function entryDone(en){ const work=en.sets.filter(s=>s.type!=="warm"); return work.length>0 && work.every(isLogged); }
/* v11 — the next exercise still needing work, searching forward first so the session flows in
   order, then wrapping to pick up anything skipped earlier. -1 when the workout is complete. */
function nextIncompleteIndex(from){
  const e=(activeSession&&activeSession.entries)||[];
  for(let i=from+1;i<e.length;i++){ if(!entryDone(e[i])) return i; }
  for(let i=0;i<=from&&i<e.length;i++){ if(!entryDone(e[i])) return i; }
  return -1; }
/* Called after a set is logged. If that completed the exercise, drop any manual override on it
   (so it falls back to the collapsed default), clear the override on the next incomplete one
   (so it opens), re-render and bring it into view. Returns true if it advanced.
   Deliberately a no-op while editing a past workout — there is no "flow" to follow there. */
function maybeAdvance(ei){
  if(!activeSession||activeSession.mode==="edit") return false;
  const en=activeSession.entries[ei];
  if(!en||!entryDone(en)) return false;
  delete loggerOpen[ei];
  const nx=nextIncompleteIndex(ei);
  if(nx>=0) delete loggerOpen[nx];
  render();
  if(nx>=0) setTimeout(function(){ const el=document.querySelector('.logex[data-ex="'+nx+'"]');
    if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"center"}); },70);
  return true; }
function loggerCounts(){ let total=0,done=0; activeSession.entries.forEach(en=>en.sets.filter(s=>s.type!=="warm").forEach(s=>{ total++; if(isLogged(s)) done++; })); return {total,done}; }
/* P1 — ghost/prefill: suggested weight+reps so a planned set is one tap */
function ghostFor(en,si){ const e=exById(en.exId);
  const last=exerciseHistory(en.exId).filter(h=>h.sessionId!==activeSession.editingId)[0]; const prog=progressionFor(en.exId);
  let prevW="",prevR=""; for(let k=si-1;k>=0;k--){ const s=en.sets[k]; if(isLogged(s)){ prevW=+s.weight; prevR=+s.reps; break; } }
  let lw="",lr=""; if(last&&last.sets){ const ls=last.sets[workIndex(en,si)]||last.sets[last.sets.length-1]; if(ls){ lw=+ls.weight||""; lr=+ls.reps||""; } }
  const w = prevW!==""?prevW : (lw!==""?lw : (prog.weight!==""?prog.weight:"")); 
  const r = prevR!==""?prevR : (lr!==""?lr : (prog.reps!==""?prog.reps : (e?e.rl:"")));
  return {w:w===""?"":String(w), r:r===""?"":String(r)}; }

/* ---------------------------------------------------------------- v13 BUILDER PANEL
   The "good ingredients" half of Build Workout. Sits at the top of the open draft so you can
   tap + Add, + Add, + Add and have a session, then scroll down and start logging it.

   What it deliberately keeps from the old flow, because the brief asked for all four:
     - search by exercise name          (the search box, alias-tolerant via exMatches)
     - muscle-group filters             (the same filterChips control the library uses)
     - the full exercise library        ("Browse full library" opens the existing add sheet)
     - custom exercise creation         ("+ Add custom exercise", same composer as the sheet)

   three weeks ago would be nonsense. */
function builderPanel(){
  if(!activeSession||activeSession.mode==="edit") return "";
  const excl=draftExIds();

    +'<div class="histline" style="margin-top:2px">'+(nIn?nIn+' exercise'+(nIn===1?'':'s')+' in this workout · ':'')
    +'ranked by what you need and what you actually train</div></div>'

  if(!builderOpen) return '<div class="card" style="padding:0;overflow:hidden;border-color:var(--line2)">'+hdr+'</div>';

  let rows, note;
  if(narrowed){
    /* Searching or filtering widens the net to the whole library, still ranked so the familiar

    const ranked=builderRanked({});
    const rank={}; ranked.forEach(function(c,i){ rank[c.exId]=i; });
    const byId={}; ranked.forEach(function(c){ byId[c.exId]=c; });
    const hits=S.exercises.filter(function(e){ return exPassesFilters(e,bldGroup,bldEquip)&&exMatches(e,q); })
      .sort(function(a,b){

      :'<div class="empty" style="padding:14px">No matches. Try a broader term, clear the filters, or add it as a custom exercise.</div>';
    note='Showing '+hits.length+' match'+(hits.length===1?'':'es')+' from the full library, best-fit first.';
  } else {
    const list=builderShortlist(excl,BUILD_SHORTLIST);
    rows=list.length?list.map(function(c){ return builderRow(c,false); }).join("")
      :'<div class="empty" style="padding:14px">Nothing left to suggest — every trainable muscle is at its weekly minimum, or everything eligible is already in this workout. Search below to add anything you like.</div>';
    note='Below weekly minimum, recovered, and weighted towards what you train regularly.';

    +filterChips("bld",bldGroup,bldEquip)
    +'<div class="row" style="margin-top:10px;gap:8px">'
    +'<button class="btn sm" data-act="add-ex" style="flex:1">Browse full library</button>'
    +'<button class="btn sm" data-bldcustom="'+escAttr(q)+'" style="flex:1;color:var(--gold)">+ Custom exercise</button></div>'
    +'</div></div>'; }
/* An exercise reachable by search but not by the shortlist (e.g. its direct muscle is still
   recovering) still needs a row. It is shown with honest context rather than hidden. */
function builderFallbackRow(e){ const pm=primaryMuscle(e); const cfg=S.muscles[pm]||{};
  const v=(weeklyVolume()[pm]||0);
  return {ex:e, exId:e.id, muscle:pm, label:cfg.label||pm, val:0,
    gap:Math.max(0,(cfg.min||0)-v), v:v, min:cfg.min||0,
    status:recoveryStatus(pm), uses:(familiarityIndex().byEx[e.id]||0)}; }
/* One shortlist row. Format is the one the brief asked for:
       Calf Extension
       Calves - 5 sets below minimum - Ready
       [+ Add]
   Once added the control becomes a non-interactive "Added" marker, which is what prevents a
   double tap from creating a duplicate entry (addToDraft() refuses duplicates as well). */

function prevForSet(en,si){ const last=exerciseHistory(en.exId).filter(h=>h.sessionId!==activeSession.editingId)[0]; if(!last) return ""; const ps=last.sets[workIndex(en,si)]; return ps?fmtSet(ps.weight,ps.reps):""; }
function isCurrentSet(en,si){ const s=en.sets[si]; if(s.type==="warm"||isLogged(s)) return false; for(let k=0;k<si;k++){ if(en.sets[k].type!=="warm"&&!isLogged(en.sets[k])) return false; } return true; }
function setRow(ei,si,s){ const en=activeSession.entries[ei]; const warm=s.type==="warm"; const g=warm?{w:"",r:""}:ghostFor(en,si); const wEmpty=(s.weight===""||s.weight==null), rEmpty=(s.reps===""||s.reps==null);
  const prev=warm?"":prevForSet(en,si); const cur=isCurrentSet(en,si);
  const wInp='<input class="inp'+(wEmpty&&g.w!==""?' ghosted':'')+'" inputmode="decimal" data-f="weight" data-ei="'+ei+'" data-si="'+si+'" value="'+(s.weight==null?"":s.weight)+'" placeholder="'+(g.w!==""?g.w:"–")+'">';
  const rInp='<input class="inp'+(rEmpty&&g.r!==""?' ghosted':'')+'" inputmode="numeric" data-f="reps" data-ei="'+ei+'" data-si="'+si+'" value="'+(s.reps==null?"":s.reps)+'" placeholder="'+(g.r!==""?g.r:"–")+'">';
  const ro=inputOrder()==="rw"; const first=ro?rInp:wInp, second=ro?wInp:rInp;
  return '<div class="setrow '+(warm?'warm ':'')+(cur?'cur':'')+'"><span class="sn" data-snum="'+ei+'-'+si+'" title="long-press to mark warm-up">'+(warm?'W':si+1)+'</span><span class="prevc">'+(prev||"·")+'</span>'+first+second
    +'<button class="chk '+(isLogged(s)?'on':'')+'" data-log="'+ei+'-'+si+'" aria-label="log set">✓</button></div>'; }
function evalWins(en,bests){ const ex=exById(en.exId); const ws=workingSets(en); if(!ws.length||!ex||bests.bestRaw==null) return [];
  const bw=bodyweightAt(new Date());
  const out=[]; let mRaw=null,m1=0,vol=0,mScore=null;
  ws.forEach(s=>{ const w=+s.weight||0,r=+s.reps||0; vol+=w*r;
    if(betterLoad(ex,w,mRaw)) mRaw=w;
    const e=exE1RM(ex,w,r,bw); if(e>m1)m1=e;
    const sc=setLoadScore(ex,w,bw); if(mScore==null||sc>mScore) mScore=sc; });
  if(betterLoad(ex,mRaw,bests.bestRaw)) out.push({t:isAssisted(ex)?"LOWEST ASSIST":"WEIGHT PR",c:"pr"});
  if(m1>bests.best1rm&&bests.best1rm>0) out.push({t:"e1RM PR",c:"pr"});
  if(loadKind(ex)==="ext"&&vol>bests.bestVol) out.push({t:"VOLUME PR",c:"pr"});
  if(!out.length&&mScore!=null&&bests.bestScore!=null&&mScore>=bests.bestScore) out.push({t:"Beat last time",c:"beat"});
  return out; }

      +'<div style="height:56px;width:100%;display:flex;align-items:flex-end">'
