      +'<span class="mono" style="font-size:10px;color:var(--muted)">'+x[valKey]+'</span></div>'; }).join("");
  return '<div class="card"><div class="tiny">'+title+'</div>'
    +(sub?'<div class="histline" style="margin-top:2px">'+sub+'</div>':'')
    +'<div style="display:flex;gap:4px;margin-top:10px;align-items:flex-end">'+bars+'</div></div>'; }
/* v14 — the whole logged history, one column per week, in a horizontal scroller that opens on
   the latest ten. Both training-pattern charts read from this one series so they scroll in step
   with each other. Capped at WEEK_SCROLL_MAX columns (two years) so an old account can't render
   thousands of divs; below WEEK_SCROLL_MIN it pads back with empty weeks so the window is still
   ten wide. Bars are scaled to the max of EVERYTHING logged, not just what is in view, so a
   column looks the same before and after you swipe. */
const WEEK_SCROLL_MIN=10, WEEK_SCROLL_MAX=104, WEEK_SCROLL_VIEW=10;
function weeksLogged(){ const list=completedSessions(); if(!list.length) return 0;
  let first=null; list.forEach(function(x){ const t=new Date(x.completedAt); if(!first||t<first) first=t; });
  const a=startOfWeek(first), b=startOfWeek();
  return Math.max(1,Math.round((b-a)/(7*86400000))+1); }
function weekSeriesAll(){ const n=Math.max(WEEK_SCROLL_MIN,Math.min(WEEK_SCROLL_MAX,weeksLogged())); return weeklySetsSeries(n); }
function fmtWeekLabel(d){ const x=new Date(d); return x.getDate()+"/"+(x.getMonth()+1); }
function weekScrollChartCard(title,series,valKey,unit){
  const n=series.length, logged=weeksLogged();
  const max=Math.max.apply(null,[1].concat(series.map(function(x){ return x[valKey]; })));
  const cols=series.map(function(x,i){
    const v=x[valKey]||0; const prev=i>0?series[i-1].start:null;
    const mstart=!prev||new Date(prev).getMonth()!==new Date(x.start).getMonth();
    return '<div class="wcol'+(x.current?' cur':'')+(v?'':' zero')+(mstart?' mstart':'')+'" title="Week of '+fmtDate(x.start)+'">'
      +'<div class="wb"><i style="height:'+(v?Math.max(4,Math.round(v/max*100)):0)+'%"></i></div>'
      +'<span class="wv">'+v+'</span><span class="wd">'+fmtWeekLabel(x.start)+'</span></div>'; }).join("");
  const view=series.slice(-WEEK_SCROLL_VIEW), avgView=view.reduce(function(a,x){ return a+(x[valKey]||0); },0)/Math.max(1,view.length);
  const all=series.filter(function(x){ return x[valKey]>0; }), avgAll=all.length?all.reduce(function(a,x){ return a+x[valKey]; },0)/all.length:0;
  const r1=function(v){ return Math.round(v*10)/10; };
  const more=n>WEEK_SCROLL_VIEW;
  return '<div class="card"><div class="tiny">'+title+'</div>'
    +'<div class="histline" style="margin-top:2px">'+(more?('Last '+WEEK_SCROLL_VIEW+' of '+Math.min(logged,n)+' weeks in view · swipe left for older'):(logged+' week'+(logged===1?'':'s')+' logged · scrolls once there are more than '+WEEK_SCROLL_VIEW))+'</div>'
    +'<div class="wscroll" data-wscroll><div class="wgrid">'+cols+'</div></div>'
    +'<div class="wfoot"><span>'+WEEK_SCROLL_VIEW+'-wk avg <b>'+r1(avgView)+' '+unit+'</b></span><span>All-time avg <b>'+r1(avgAll)+' '+unit+'/wk</b></span></div>'
    +'</div>'; }
/* Weekday distribution — most AND least common, stated neutrally. */
function weekdayCard(){
  const w=weekdayPattern();
  if(!w) return '<div class="card"><div class="tiny">Training days</div><div class="empty" style="padding:14px">Log ~6 sessions to see your weekday pattern.</div></div>';
  const bars=w.counts.map(function(n,i){
    const isHi=w.names[i]===w.names[w.counts.indexOf(w.max)];
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">'
      +'<div style="height:44px;width:100%;display:flex;align-items:flex-end">'
      +'<i style="width:100%;height:'+Math.round(n/Math.max(1,w.max)*100)+'%;min-height:3px;background:'+(isHi?'var(--accent)':'var(--grey)')+';border-radius:4px 4px 0 0;display:block"></i></div>'
      +'<span class="mono" style="font-size:10px;color:var(--muted)">'+w.names[i]+'</span>'
      +'<span class="mono" style="font-size:10px;color:var(--faint)">'+n+'</span></div>'; }).join("");
  return '<div class="card"><div class="tiny">Training days · all '+w.total+' sessions</div>'
    +'<div style="display:flex;gap:4px;margin-top:10px;align-items:flex-end">'+bars+'</div>'
    +'<div class="histline" style="margin-top:10px">Most: <b>'+w.most.day+'</b> · '+w.most.n+' sessions ('+Math.round(w.most.share*100)+'%)</div>'
    +'<div class="histline">Least: <b>'+w.least.day+'</b> · '+w.least.n+' session'+(w.least.n===1?'':'s')+' ('+Math.round(w.least.share*100)+'%)</div></div>'; }
/* Time-of-day distribution, as counts rather than a claim. */
function timeOfDayCard(){
  const b=timeOfDayCounts(); const total=b.reduce(function(a,x){ return a+x.n; },0);
  if(!total) return "";
  const max=Math.max.apply(null,[1].concat(b.map(function(x){ return x.n; })));
  const rows=b.map(function(x){
    return '<div class="exline" style="padding:6px 0"><div style="flex:1"><div class="nm" style="font-size:13px">'+x.label+'</div>'
      +'<div class="bar" style="margin-top:5px"><i style="width:'+Math.round(x.n/max*100)+'%"></i></div></div>'
      +'<span class="mono" style="margin-left:10px">'+x.n+'</span></div>'; }).join("");
  const top=b.slice().sort(function(p,q){ return q.n-p.n; })[0];
  return '<div class="card"><div class="tiny">Training time · all '+total+' sessions</div><div style="margin-top:6px">'+rows+'</div>'
    +'<div class="histline" style="margin-top:8px">Most common: <b>'+top.label+'</b> · '+top.n+' of '+total+'</div></div>'; }
/* Consistency stated as a verifiable record rather than a streak that is usually zero. */
function consistencyCard(){
  const c=consistencyRecord(8);
  const col=c.hit>=c.weeks*0.75?"var(--green)":c.hit>=c.weeks*0.5?"var(--amber)":"var(--red)";
  return '<div class="card"><div class="tiny">Consistency</div>'
    +'<div style="margin-top:6px;font-weight:700;font-size:15px">Hit '+c.target+'+ sessions in <span style="color:'+col+'">'+c.hit+' of the last '+c.weeks+' weeks</span></div>'
    +'<div class="histline" style="margin-top:4px">Target is '+c.target+' sessions per week (Settings).</div></div>'; }

/* ============================================================================ v16 — ANALYTICS & DATA QUALITY ============================================================================
   Five questions the Stats screen now answers, each with its own pure engine (unit-tested against
   synthetic AND real history) and a card:
     1. Am I training consistently?                      → priorityCoverage() + coverageMatrix()
     2. Are the muscles I care about getting enough work? → coverageMatrix() (muscle × week, banded)
     3. Am I progressing or quietly stalling?            → stallAssess()
     4. Am I training within the rep ranges we set?      → repRangeCompliance()   [exercise level only, v17]
     5. Is anything in the data wrong or suspicious?     → dataQualityScan() + review sheet + Settings centre
   Plus two prototypes still under review: blockReport() and calendarStrip() with finer time-of-day
   buckets. v17 review (Adam, 14 Sep 2026): the strength index prototype and the Stats-wide rep-range
   compliance board were removed — indexed numbers were not actionable, and a dashboard judging every
   exercise against its range does not fit double progression. The rep-range engine stays for the
   exercise detail sheet (a subtle mismatch note + range editor), the coverage matrix gained a
   Total | Direct | Indirect view, and the data-quality scan now also runs at set entry and at finish.
   House rules carried over from v11: numbers not verdicts, evidence beside every claim, no invented
   coefficients, and "not enough data" is a legitimate answer. */

/* ---------------------------------------------------------------- 1+2 · COVERAGE MATRIX
   One row per muscle, one column per week since the first logged session (same window and scroll
   behaviour as the v14 week charts), each cell = effective sets that week from the ONE canonical
   credit sum, banded against the muscle's own minimum and cap. */
const COV_MIN_WEEKS=WEEK_SCROLL_MIN, COV_MAX_WEEKS=WEEK_SCROLL_MAX, COV_VIEW=WEEK_SCROLL_VIEW;
/* Where a muscle sits in the matrix. A muscle you have set to minimum 0 is "out of scope" whatever
   its tier — it can never count against you. */
function muscleGroupOf(m){ const c=S.muscles[m]; if(!c) return "maintenance";
  if(!(c.min>0)) return "maintenance";
  return c.tier==="primary"?"priority":(c.tier==="secondary"?"secondary":"maintenance"); }
function weekSessionsFor(start){ const st=new Date(start); const en=new Date(st); en.setDate(en.getDate()+7);
  return completedSessions().filter(function(x){ const t=new Date(x.completedAt); return t>=st&&t<en; }); }
function cellStatus(v,cfg){ if(!(v>0.01)) return "zero"; if(v>cfg.cap) return "over"; if(v>=cfg.min) return "ok"; return "low"; }
/* v17 — `view` is "total" (default: min/cap banding, hit count, the scored matrix), "direct" or
   "indirect". The two partial views carry the same weeks, rows and 10-week average but are shown
   neutrally: the configured minimum and cap were set for TOTAL effective sets, so a direct-only
   number is never coloured against them and never counted as a hit or a miss. */
function coverageMatrix(view){ view=(view==="direct"||view==="indirect")?view:"total"; const scored=view==="total";
  const weeks=weekSeriesAll().map(function(w){ return {start:w.start, current:w.current, sessions:w.sessions}; });
  const perWeek=weeks.map(function(w){ return effectiveSetsByMuscleView(weekSessionsFor(w.start),view); });
  const groups={priority:[], secondary:[], maintenance:[]};
  Object.keys(S.muscles).forEach(function(m){ const cfg=S.muscles[m]; const g=muscleGroupOf(m);
    const cells=perWeek.map(function(vol,i){ const v=Math.round((vol[m]||0)*10)/10;
      return {v:v, status:scored?cellStatus(v,cfg):(v>0.01?"neutral":"zero"), week:weeks[i].start, current:!!weeks[i].current}; });
    const complete=cells.filter(function(c){ return !c.current; });
    const hit=scored?complete.filter(function(c){ return c.status==="ok"||c.status==="over"; }).length:null;
    const trained=complete.filter(function(c){ return c.status!=="zero"; }).length;
    const last10=complete.slice(-COV_VIEW); const avg10=last10.length?last10.reduce(function(a,c){ return a+c.v; },0)/last10.length:0;
    groups[g].push({m:m, label:cfg.label, min:cfg.min, cap:cfg.cap, tier:cfg.tier, outOfScope:!(cfg.min>0),
      cells:cells, hit:hit, complete:complete.length, trained:trained, avg10:Math.round(avg10*10)/10}); });
  return {weeks:weeks, groups:groups, view:view, scored:scored}; }
/* The headline consistency number. A week counts as covered when EVERY active priority muscle
   (tier primary, minimum > 0) reached its minimum. The in-progress week is reported separately so
   a Tuesday never reads as a missed week. */
function priorityCoverage(mx){ mx=(mx&&mx.scored!==false)?mx:coverageMatrix("total");   /* only the total view is scored */
  const rows=mx.groups.priority; const weeks=mx.weeks;
  const per=weeks.map(function(w,i){ if(!rows.length) return null;
    const covered=rows.filter(function(r){ const s=r.cells[i].status; return s==="ok"||s==="over"; }).length;
    return {week:w.start, current:!!w.current, covered:covered, of:rows.length, hit:covered===rows.length,
      missed:rows.filter(function(r){ const s=r.cells[i].status; return !(s==="ok"||s==="over"); }).map(function(r){ return r.label; })}; }).filter(Boolean);
  const complete=per.filter(function(p){ return !p.current; });
  const cur=per.find(function(p){ return p.current; })||null;
  const hit=complete.filter(function(p){ return p.hit; }).length;
  const last4=complete.slice(-4), last4hit=last4.filter(function(p){ return p.hit; }).length;
  const last10=complete.slice(-10), last10hit=last10.filter(function(p){ return p.hit; }).length;
  /* per-muscle streak of misses ending at the latest complete week — the sentence under the number */
  const streaks=rows.map(function(r){ const cc=r.cells.filter(function(c){ return !c.current; }); let k=0;
    for(let i=cc.length-1;i>=0;i--){ const s=cc[i].status; if(s==="ok"||s==="over") break; k++; }
    return {label:r.label, misses:k}; }).filter(function(x){ return x.misses>0; }).sort(function(a,b){ return b.misses-a.misses; });
  return {active:rows.length, weeks:complete.length, hit:hit, pct:complete.length?Math.round(100*hit/complete.length):0,
    last4:{hit:last4hit, of:last4.length}, last10:{hit:last10hit, of:last10.length}, current:cur, per:per, streaks:streaks}; }
/* Which exercises produced a cell's number — the app's own attribution helper on that week's sessions. */
function cellContributors(m,weekStart,view){ const sess=weekSessionsFor(weekStart); const con=muscleContrib(m,sess); view=(view==="direct"||view==="indirect")?view:"total";
  const rows=con.rows.filter(function(r){ return creditInView(r.credit,view); });
  const shown=view==="total"?con.total:view==="direct"?con.direct:con.secondary;
  return {rows:rows, direct:con.direct, indirect:con.secondary, secondary:con.secondary, total:con.total, shown:shown, view:view, sessions:sess.length}; }

/* ---------------------------------------------------------------- 3 · STALL DETECTOR
   Double-progression is the yardstick: a session IMPROVES an exercise when the top set carries
   more load (less assistance) at comparable reps, or more reps at the same load. That works for a
   12–20-rep lateral raise exactly as it does for a 6-rep press, which e1RM (capped at 10 reps in
   this app) does not. e1RM bests are tracked alongside as the secondary signal.
   States describe the number, never the athlete:
     progressing            improved the top set within the last 3 exposures, or above baseline
     stable                 5+ exposures, no plateau pattern, no improvement in the last 3
     plateau                6+ exposures without a top-set improvement AND 4+ at effectively the same top set
     below_context          below baseline, with a plausible contextual explanation on record
     below                  below baseline, no context on record
     insufficient           fewer than 5 exposures
     stale                  no exposure in the last 28 days — history, not current training */
const STALL_MIN_N=TREND_MIN_N, STALL_SINCE=6, STALL_SAME=4, STALL_E1_MEANINGFUL=0.02;
function topSetOf(ex,sets){ const w=bestRawLoad(ex,sets); let r=0;
  (sets||[]).forEach(function(s){ if((+s.weight||0)===w) r=Math.max(r,+s.reps||0); }); return {w:w, r:r}; }
/* One comparable number for a top set: direction-aware load × Epley rep factor, UNCAPPED so a
   15-rep lateral raise can improve as well as a 6-rep press. Assisted work with no bodyweight on
   record cannot be scored honestly, so it falls back to an ordering (less assistance, then reps). */
function topScore(ex,t,bw){ const L=setLoadScore(ex,t.w,bw); if(isAssisted(ex)&&bw==null) return L+(t.r||0)*0.01; return Math.max(0,L)*(1+(t.r||0)/30); }
/* did `cur` beat `best` by the double-progression rule? more reps at the same load, or a heavier
   load that keeps the score up — either way the score rises by more than rounding noise */
function topSetBeats(ex,cur,best,bw){ if(!best) return true; const a=topScore(ex,cur,bw), b=topScore(ex,best,bw);
  if(b<=0) return a>b+0.05; return a>b*1.01; }
function sameTopSet(ex,a,b){ return a.w===b.w && Math.abs(a.r-b.r)<=2; }
function stallAssess(exId){
  const ex=exById(exId); const h=exerciseHistory(exId);            /* newest first */
  const n=h.length; const tr=exerciseTrendData(exId); const oc=orderContext(exId);
  const base={exId:exId, ex:ex, n:n, days:tr.days, stale:!!tr.stale};
  if(!ex||n<STALL_MIN_N) return Object.assign(base,{state:"insufficient", need:STALL_MIN_N-n, tops:[], next:null});
  const asc=h.slice().reverse();                                     /* oldest first */
  const tops=asc.map(function(x){ const t=topSetOf(ex,x.sets); return {date:x.date, w:t.w, r:t.r, e1:sessionStrength(ex,x.sets,x.bw), bw:x.bw}; });
  /* running best by double progression */
  let best=null, sinceBest=0, lastImproveIdx=-1;
  tops.forEach(function(t,i){ if(topSetBeats(ex,t,best,t.bw)){ best={w:t.w,r:t.r,date:t.date}; lastImproveIdx=i; } });
  sinceBest=(tops.length-1)-lastImproveIdx;
  /* e1RM best (app definition) and sessions since a meaningful one */
  let e1best=0, e1idx=-1; tops.forEach(function(t,i){ if(t.e1>e1best*(1+STALL_E1_MEANINGFUL)&&t.e1>0){ e1best=t.e1; e1idx=i; } });
  const sinceE1=(e1idx>=0)?(tops.length-1)-e1idx:null;
  /* consecutive recent sessions at effectively the same top set */
  let same=1; for(let i=tops.length-1;i>0;i--){ if(sameTopSet(ex,tops[i],tops[i-1])) same++; else break; }
  const last=tops[tops.length-1];
  const streak=tops.slice(tops.length-same); const repLo=Math.min.apply(null,streak.map(function(t){ return t.r; })), repHi=Math.max.apply(null,streak.map(function(t){ return t.r; }));
  const streakStr=(isAssisted(ex)?last.w+" kg assist":isBodyweightLoaded(ex)?(last.w>0?"+"+last.w+" kg":"bodyweight"):last.w+" kg")+(repLo===repHi?" × "+repLo:" (top set "+repLo+"–"+repHi+" reps)");
  /* single-session outlier check: last e1/top score vs median of the previous 4 */
  const prevScores=tops.slice(Math.max(0,tops.length-5),tops.length-1).map(function(t){ return t.e1>0?t.e1:setLoadScore(ex,t.w,t.bw); }).filter(function(v){ return v>0; });
  const med=prevScores.length?median(prevScores):0; const lastScore=last.e1>0?last.e1:setLoadScore(ex,last.w,last.bw);
  const lastDrop=(med>0&&lastScore>0)?(lastScore-med)/med:0;
  let state="stable"; const why=[];
  if(tr.stale){ state="stale"; why.push("No exposure in the last "+TREND_STALE_DAYS+" days."); }
  else if(sinceBest<=2||tr.state==="above"){ state="progressing";
    if(sinceBest<=2) why.push("Top set improved "+(sinceBest===0?"last session":sinceBest+" session"+(sinceBest===1?"":"s")+" ago")+".");
    if(tr.state==="above") why.push("Last "+tr.recentN+" exposures average above the previous "+tr.baseN+"."); }
  else if(tr.state==="below"){
    const ctx=[]; if(oc&&oc.dir==="later") ctx.push(oc.text.toLowerCase());
    if(lastDrop<=-0.2) ctx.push("the last session alone is "+Math.round(Math.abs(lastDrop)*100)+"% under the previous four — one session, not a trend yet");
    state=ctx.length?"below_context":"below";
    why.push("Last "+tr.recentN+" exposures average "+Math.round(Math.abs(tr.pct))+"% below the previous "+tr.baseN+".");
    ctx.forEach(function(c){ why.push("Context: "+c+"."); }); }
  else if(sinceBest>=STALL_SINCE&&same>=STALL_SAME){ state="plateau";
    why.push(sinceBest+" sessions since the top set last improved ("+fmtTop(ex,best)+").");
    why.push(same+" sessions in a row at "+streakStr+"."); }
  else { if(sinceBest>=3) why.push(sinceBest+" sessions since the top set last improved."); else why.push("Holding — no improvement in the last "+sinceBest+" sessions, no plateau pattern yet."); }
  return Object.assign(base,{state:state, why:why, tops:tops, best:best, sinceBest:sinceBest, e1best:e1best, sinceE1:sinceE1,
    same:same, last:last, trendPct:tr.pct, trendState:tr.state, order:oc, lastDrop:lastDrop, next:stallNextStep(ex,state,tops,best,same,sinceBest)}); }
function median(a){ const s=a.slice().sort(function(x,y){ return x-y; }); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function fmtTop(ex,t){ if(!t) return "—"; return (isAssisted(ex)?t.w+" kg assist":isBodyweightLoaded(ex)?(t.w>0?"+"+t.w+" kg":"bodyweight"):t.w+" kg")+" × "+t.r; }
/* The suggestion, in the exercise's own terms: its configured rep range, its increment, and its
   load direction. Double progression first (reps to the top of the range, then load), and for a
   plateau the smallest change that breaks the pattern. Never a coefficient, never a guess at cause. */
function stallNextStep(ex,state,tops,best,same,sinceBest){
  if(!ex||!tops.length) return null; const last=tops[tops.length-1]; const rl=ex.rl||8, rh=ex.rh||12; const inc=incrementFor(ex);
  const dir=progDir(ex); const asst=isAssisted(ex); const step=asst?-inc:inc;
  const nextLoad=Math.max(0,Math.round((last.w+step)*10)/10);
  const loadStr=function(w){ return asst?(w+" kg assist"):(isBodyweightLoaded(ex)?(w>0?"+"+w+" kg":"bodyweight"):w+" kg"); };
  if(state==="insufficient"||state==="stale") return null;
  if(state==="progressing"){ const p=progressionFor(ex.id); return {kind:"keep", text:(p&&p.note)?p.note:"Keep the progression going — match the load, beat the reps."}; }
  if(state==="below_context") return {kind:"repeat", text:"Repeat "+fmtTop(ex,tops[tops.length-2]||last)+" next time before reading anything into one session."};
  if(state==="below") return {kind:"hold", text:"Hold "+loadStr(last.w)+" and rebuild the reps toward "+rh+" before adding load."};
  if(last.r>=rh) return {kind:"load", text:"Top set is at the top of the "+rl+"–"+rh+" range → "+(asst?"drop to ":"move to ")+loadStr(nextLoad)+", aim "+rl+"+ reps."};
  if(last.r<rl) return {kind:"reps", text:"Top set ("+fmtTop(ex,last)+") is under the "+rl+"–"+rh+" range. Hold "+loadStr(last.w)+" and build to "+rl+" reps, or "+(asst?"add ":"drop to ")+loadStr(Math.max(0,Math.round((last.w-step)*10)/10))+" and work "+rl+"–"+rh+"."};
  if(state==="plateau"){
    const target=Math.min(rh,last.r+1);
    return {kind:"break", text:same+" sessions at "+loadStr(last.w)+". Break the pattern: "+(last.r+1<=rh?"take the top set to "+loadStr(last.w)+" × "+target+" next time, then ":"")+(asst?"drop to ":"move to ")+loadStr(nextLoad)+" for "+rl+" reps"+(sinceBest>=10?" — or swap in a different variation for a block":"")+"."};
  }
  return {kind:"reps", text:"Hold "+loadStr(last.w)+", add a rep: target "+Math.min(rh,last.r+1)+" on the top set (range "+rl+"–"+rh+")."};
}
const STALL_META={
  progressing:{label:"Progressing", c:"var(--green)", icon:"▲"},
  stable:{label:"Stable", c:"var(--accent)", icon:"▬"},
  plateau:{label:"Likely plateau", c:"var(--amber)", icon:"■"},
  below_context:{label:"Below baseline · context", c:"var(--gold)", icon:"▼"},
  below:{label:"Below baseline", c:"var(--red)", icon:"▼"},
  insufficient:{label:"Not enough data", c:"var(--muted)", icon:"○"},
  stale:{label:"Not recently trained", c:"var(--muted)", icon:"○"} };
function stallBoard(){ const cnt={}; completedSessions().forEach(function(s){ (s.entries||[]).forEach(function(en){ if(workingSets(en).length) cnt[en.exId]=(cnt[en.exId]||0)+1; }); });
  return Object.keys(cnt).map(function(id){ return stallAssess(id); }).filter(function(a){ return a.ex; })
    .sort(function(a,b){ return (b.n-a.n)||a.ex.name.localeCompare(b.ex.name); }); }

/* ---------------------------------------------------------------- 5 · DATA-QUALITY SCAN
   Runs over the WHOLE history every time Stats renders (cheap: a few hundred sets). Every flag says
   what was seen, why it is suspicious, and what sits either side of it. Nothing is edited here — the
   review sheet hands you Edit and Dismiss. The one automatic repair is the exact k-fold repeated set
   block a racing sync leaves behind (see dqAutoRepair) — and only, from v17.1, when the save record

/* v17 — which flags are worth interrupting for at finish time: a likely error, or a warning whose

/* v17.1 — EVIDENCE REQUIRED. An exact k-fold repeated set block is only ever collapsed when something

/* v17 — SET-ENTRY PLAUSIBILITY. Judged the moment a set is ticked, against this exercise's own

/* ---------------------------------------------------------------- 4 · REP-RANGE COMPLIANCE (exercise level)
   Per exercise, the last 8 exposures: how many working sets fell under, inside and over its own
   configured range, and a reading that separates "load is too high" from "the range is not how you
   actually train this". Neither is changed automatically. v17: the Stats-wide board is gone; the
   engine feeds the exercise detail sheet only (repRangeNote), where a persistent mismatch earns one

function repRangeCompliance(exId){ const ex=exById(exId); if(!ex) return null;

/* v17 — the one quiet line the exercise sheet shows when recent training repeatedly sits outside the

/* ---------------------------------------------------------------- 5 · FOUR-WEEK BLOCK REPORT (prototype)

    const sets=sess.reduce(function(a,s){ return a+sessionSets(s); },0); const vol=effectiveSetsByGroup(sess); const n=ws.length;
    const cov=pc.per.filter(function(p){ return ws.some(function(w){ return w.start===p.week; }); }); const covHit=cov.filter(function(p){ return p.hit; }).length;
    const from=new Date(ws[0].start), to=new Date(ws[ws.length-1].start); to.setDate(to.getDate()+6);
    const bws=(S.bodyweight||[]).filter(function(b){ const t=new Date(b.date); return t>=from&&t<=to; }).map(function(b){ return +b.kg; });
    return {weeks:n, from:from, to:to, sessions:sess.length, perWeek:Math.round(10*sess.length/n)/10, sets:sets, setsPerWeek:Math.round(10*sets/n)/10, byGroup:vol, groupPerWeek:Object.keys(vol).reduce(function(a,k){ a[k]=Math.round(10*vol[k]/n)/10; return a; },{}),
      coverage:{hit:covHit, of:cov.length}, bodyweight:bws.length?Math.round(median(bws)*10)/10:null, sessionsList:sess}; };
  const R=blk(recentW), P=blk(prevW); if(!R||!P) return null;
  /* strength movers: best session score in each block, exercises with 2+ exposures in both */
  const movers=[]; const idx={}; const collect=function(list,key){ list.forEach(function(s){ (s.entries||[]).forEach(function(en){ const ex=exById(en.exId); const ws=workingSets(en); if(!ex||!ws.length) return;
      const o=(idx[en.exId]=idx[en.exId]||{ex:ex,R:[],P:[]}); o[key].push(sessionStrength(ex,ws,bodyweightAt(s.completedAt))); }); }); };
  collect(R.sessionsList,"R"); collect(P.sessionsList,"P");
  Object.values(idx).forEach(function(o){ if(o.R.length<2||o.P.length<2) return; const r=Math.max.apply(null,o.R), p=Math.max.apply(null,o.P); if(!(p>0)||!(r>0)) return;
    movers.push({ex:o.ex, recent:r, prev:p, pct:Math.round(100*(r-p)/p), nR:o.R.length, nP:o.P.length}); });

    .filter(function(g){ return g.r>0||g.p>0; }).sort(function(a,b){ return Math.abs(b.d)-Math.abs(a.d); });

/* ---------------------------------------------------------------- 6 · CALENDAR STRIP + FINER TRAINING TIME (prototype) */
const CAL_WEEKS=12;
function calendarStrip(nWeeks){ const n=nWeeks||CAL_WEEKS; const base=startOfWeek(); const cols=[];
  const byDay={}; completedSessions().forEach(function(s){ const k=dayKey(s.completedAt); (byDay[k]=byDay[k]||[]).push(s); });
  for(let i=n-1;i>=0;i--){ const st=new Date(base); st.setDate(st.getDate()-i*7); const days=[];
    for(let d=0;d<7;d++){ const dt=new Date(st); dt.setDate(dt.getDate()+d); const list=byDay[dayKey(dt)]||[]; const sets=list.reduce(function(a,s){ return a+sessionSets(s); },0);
      days.push({date:dt, n:list.length, sets:sets, future:dt>new Date(), today:dayKey(dt)===dayKey(new Date())}); }
    cols.push({start:st, current:i===0, days:days, sessions:days.reduce(function(a,d){ return a+d.n; },0)}); }
  /* gaps: longest run of days without training inside the window, ending in the past */
  let gap=0, best=0, bestEnd=null; cols.forEach(function(c){ c.days.forEach(function(d){ if(d.future) return; if(d.n) gap=0; else { gap++; if(gap>best){ best=gap; bestEnd=d.date; } } }); });
  return {cols:cols, longestGap:best, longestGapEnd:bestEnd, currentGap:gap}; }
/* Six buckets instead of four. A session whose recorded time is the exact-noon placeholder that
   old builds and re-dated edits write is only placed when its logging time falls on the same day;
   otherwise it is counted as "time unknown" rather than pretending. */
const TOD6=[["Before 9am",0,9],["9am–12pm",9,12],["12–3pm",12,15],["3–6pm",15,18],["6–9pm",18,21],["After 9pm",21,24]];
function sessionClock(s){ const c=new Date(s.completedAt); const placeholder=c.getHours()===12&&c.getMinutes()===0&&c.getSeconds()===0;
  if(!placeholder) return c; const st=s.startedAt?new Date(s.startedAt):null;
  if(st&&dayKey(st)===dayKey(c)&&!(st.getHours()===12&&st.getMinutes()===0&&st.getSeconds()===0)) return st; return null; }
function timeOfDayCounts6(){ const out=TOD6.map(function(b){ return {label:b[0], n:0}; }); let unknown=0;
  completedSessions().forEach(function(s){ const t=sessionClock(s); if(!t){ unknown++; return; } const h=t.getHours(); TOD6.forEach(function(b,i){ if(h>=b[1]&&h<b[2]) out[i].n++; }); });
  return {buckets:out, unknown:unknown, total:completedSessions().length}; }

/* v17 — Settings → Data quality: the permanent review centre. Open flags, dismissed flags (reopenable)

function dqRepairsList(){ const reps=(S.settings.dqRepairs||[]).slice().reverse(); if(!reps.length) return '<div class="empty">No automatic repairs. A repeated set block is only ever collapsed without asking when the save record proves the duplication — the journal copy written at Finish, a proven sync-duplication marker on the record, or duplicate cloud rows at the same set position. A repeat with no such evidence is flagged for you instead.</div>';

/* ---------------------------------------------------------------- PROTOTYPE 5 · BLOCK REPORT */
function fmtRange(a,b){ const f=function(d){ return new Date(d).toLocaleDateString("en-AU",{day:"numeric",month:"short"}); }; return f(a)+' – '+f(b); }
function deltaStr(r,p,unit,dec){ const d=Math.round((r-p)*(dec?10:1))/(dec?10:1); if(!d) return '<span class="muted">no change</span>'; return '<span style="color:'+(d>0?'var(--green)':'var(--red)')+'">'+(d>0?'+':'')+d+(unit||'')+'</span>'; }
function blockReportCard(){ const b=blockReport(); if(!b) return '<div class="card"><div class="empty">Needs 8 complete weeks (4 + 4) to compare blocks.</div></div>';
  const R=b.recent, P=b.prev;
  const kpi=function(label,rv,pv,unit,dec){ return '<div class="blk-k"><span>'+label+'</span><b>'+rv+(unit||'')+'</b><small>vs '+pv+(unit||'')+' · '+deltaStr(rv,pv,unit,dec)+'</small></div>'; };
  const groups=b.groups.slice(0,6).map(function(g){ return '<div class="contrib" style="padding:6px 0"><div><b>'+g.label+'</b><div class="muted" style="font-size:12px">'+g.r+' vs '+g.p+' effective sets / week</div></div><span class="c-ef">'+deltaStr(g.r,g.p,'',true)+'</span></div>'; }).join("");
  const mover=function(m){ return '<div class="contrib" style="padding:6px 0"><div><b>'+m.ex.name+'</b><div class="muted" style="font-size:12px">best '+Math.round(m.recent)+' vs '+Math.round(m.prev)+' ('+m.nR+' / '+m.nP+' exposures)</div></div><span class="c-ef" style="color:'+(m.pct>0?'var(--green)':'var(--red)')+'">'+(m.pct>0?'+':'')+m.pct+'%</span></div>'; };
  return '<div class="card"><div class="tiny">Block report · '+fmtRange(R.from,R.to)+' vs '+fmtRange(P.from,P.to)+'</div>'
    +'<div class="histline" style="margin-top:2px">Last four complete weeks against the four before them. Only what changed a lot is worth reading.</div>'
    +'<div class="blk-grid">'+kpi('Sessions / wk',R.perWeek,P.perWeek,'',true)+kpi('Working sets / wk',R.setsPerWeek,P.setsPerWeek,'',true)+'<div class="blk-k"><span>Priority coverage</span><b>'+R.coverage.hit+'/'+R.coverage.of+'</b><small>vs '+P.coverage.hit+'/'+P.coverage.of+' · '+deltaStr(R.coverage.hit,P.coverage.hit,' wk',false)+'</small></div>'
    +(R.bodyweight!=null&&P.bodyweight!=null?kpi('Bodyweight (median)',R.bodyweight,P.bodyweight,' kg',true):'<div class="blk-k"><span>Bodyweight</span><b>—</b><small>log bodyweight in both blocks to compare</small></div>')+'</div>'
    +'<div class="tiny" style="margin-top:12px">Effective sets by group · biggest moves</div><div style="margin-top:4px">'+(groups||'<div class="empty" style="padding:8px">—</div>')+'</div>'
    +'<div class="tiny" style="margin-top:12px">Strength movers · best session score, 2+ exposures in each block</div><div style="margin-top:4px">'+(b.up.map(mover).join("")+b.down.map(mover).join("")||'<div class="empty" style="padding:8px">No exercise moved 3% or more.</div>')+'</div>'
    +(b.stalled.length?'<div class="tiny" style="margin-top:12px">Stalled lifts</div><div class="histline" style="margin-top:4px">'+b.stalled.map(function(a){ return a.ex.name+' ('+a.sinceBest+' sessions since best)'; }).join(' · ')+'</div>':'')
    +'</div>'; }

/* ---------------------------------------------------------------- PROTOTYPE 6 · CALENDAR STRIP + TRAINING TIME */
function calendarCard(){ const cal=calendarStrip(CAL_WEEKS); const names=["M","T","W","T","F","S","S"];
  const grid='<div class="cal"><div class="cal-days">'+names.map(function(n){ return '<span>'+n+'</span>'; }).join("")+'</div>'

      +c.days.map(function(d){ const lvl=d.n?(d.sets>=18?3:d.sets>=12?2:1):0; return '<i class="cal-d l'+lvl+(d.future?' fut':'')+(d.today?' today':'')+'" title="'+fmtDate(d.date)+(d.n?' · '+d.sets+' sets':'')+'"></i>'; }).join("")+'</div>'; }).join("")+'</div>';
  const tod=timeOfDayCounts6(); const max=Math.max.apply(null,[1].concat(tod.buckets.map(function(b){ return b.n; })));
  const todRows=tod.buckets.map(function(b){ return '<div class="exline" style="padding:5px 0"><div style="flex:1"><div class="nm" style="font-size:13px">'+b.label+'</div><div class="bar" style="margin-top:4px"><i style="width:'+Math.round(b.n/max*100)+'%"></i></div></div><span class="mono" style="margin-left:10px">'+b.n+'</span></div>'; }).join("");

    +'<div class="histline" style="margin-top:6px">'+(top&&top.n?'Most common: <b>'+top.label+'</b> · '+top.n+' of '+placed+'. ':'')+(tod.unknown?tod.unknown+' session'+(tod.unknown===1?'':'s')+' carry the noon placeholder time from a re-dated edit or an older build and are left out rather than guessed.':'')+'</div></div>'; }

/* ---------------------------------------------------------------- v11 INSIGHTS
   Cut back to insights that carry a number, a chart or a date. Removed outright: the 0-100
   momentum score and its ring, "Momentum: strong", "Best next move", and the all-time
   "best week so far" milestone — none of them changed a decision, and they pushed the
   comparative data further down the screen. */
function insightsBlock(){ const cards=[];
  const na=needsAttentionPrimary();
  if(na.length) cards.push(insightCard({tier:"warn",badge:"Below weekly minimum",
    title:na.slice(0,3).map(m=>S.muscles[m].label).join(", "),
    body:na.slice(0,3).map(function(m){ const v=weeklyVolume()[m]||0; return S.muscles[m].label+" "+v.toFixed(1)+"/"+S.muscles[m].min+" sets"; }).join(" · "),muscle:na[0]}));
  const sd=secondaryDominant()[0];
  if(sd) cards.push(insightCard({tier:"warn",badge:"Mostly indirect volume",title:S.muscles[sd.m].label,
    body:sd.con.direct.toFixed(1)+" direct vs <b>"+sd.con.secondary.toFixed(1)+" indirect</b> sets this week.",muscle:sd.m}));
  let h=cards.join("");
  const unlock=[];
  if(!weekdayPattern()) unlock.push("weekday pattern (log ~6 sessions)");
  if(completedSessions().length<8) unlock.push("time-of-day pattern (8+ sessions)");
  const board=progressionBoard();
  if(!board.graded) unlock.push("progression verdicts ("+TREND_MIN_N+"+ logs of an exercise)");
  if(unlock.length) h+='<div class="card" style="background:var(--panel2)"><div class="ibody">Not yet available: '+unlock.join("; ")+'.</div></div>';
  return h; }

    +statsSection("stats:dq","Data quality",(dq.open.length?dq.open.length+' open flag'+(dq.open.length===1?'':'s')+' · nothing is edited automatically':'whole history scanned · nothing open'),dqCard,dq.counts.error+dq.counts.warn>0)

/* ---------------- BODY (P6 two-layer + P7 grid + P5 attribution) ---------------- */
const BODY_GROUPS=[["Chest & push",["upper_chest","chest","triceps","front_delts"]],["Back & pull",["back_lats","upper_back","biceps"]],["Delts",["side_delts","rear_delts"]],["Legs",["quads","hamstrings","glutes","calves"]],["Core & other",["abs","lower_back","forearms"]]];
const TIER_RANK={primary:0,secondary:1,maintenance:2};
/* Strategic exercise ordering (item 1): lower score = earlier in the session.
   Compounds and priority/fresh muscles first; isolation + low-fatigue pump work last.
   Putting compounds before isolation also avoids pre-fatiguing arms before big presses/pulls. */
function orderScore(c){ const ex=exById(c.exId); if(!ex) return 100; const pm=primaryMuscle(ex); const tr=TIER_RANK[(S.muscles[pm]||{}).tier]; const t=(tr==null?1:tr);
  let s=0; s+=ex.type==="compound"?0:30; s+=t*12; s-=Math.min(ex.fatigue||1,4)*4;
  if(ex.type==="isolation"&&(ex.fatigue||1)<=1.2&&t>0) s+=15; return s; }
function positionTag(ex,i,total){ if(i===0) return "First"; if(ex.type==="isolation"&&(ex.fatigue||1)<=1.2&&i>=total-1) return "Finisher"; return ""; }
/* ---------------------------------------------------------------- v12 BODY V2
   One question, answered in one screen: where am I below my weekly minimum, and what is ready
   to train? Same numbers as the V1 cards — configured minimum, effective sets, direct vs
   indirect attribution, existing recovery engine — just laid out as a scannable table and
   sorted so the actionable rows are at the top. V1 is still there behind the toggle. */
function bodyV2Rows(){
  const sess=weekSessions(), vol=weeklyVolume(sess);
  return Object.entries(S.muscles).map(function(pr){
    const m=pr[0], cfg=pr[1], v=vol[m]||0, con=muscleContrib(m,sess), st=recoveryStatus(m);
    const ready=(st==="ready"||st==="untrained"), moderate=(st==="caution");
    const remaining=Math.max(0,cfg.min-v);
    /* actionable = below minimum AND trainable; priority tier breaks ties above everything else */
    const rank=(remaining>0.01?0:1)*100 + (ready?0:moderate?10:20) + TIER_RANK[cfg.tier];
    return {m:m, label:cfg.label, tier:cfg.tier, direct:con.direct, secondary:con.secondary,
      eff:v, min:cfg.min, remaining:remaining, status:st, ready:ready, moderate:moderate,
      below:remaining>0.01, rank:rank}; })
    .sort(function(a,b){ return (a.rank-b.rank) || (b.remaining-a.remaining) || a.label.localeCompare(b.label); }); }
function bodyV2(){
  const rows=bodyV2Rows();
  const act=rows.filter(function(r){ return r.below && (r.ready||r.moderate); });
  const n=function(x){ return (Math.round(x*10)/10).toFixed(1); };
  const line=function(r){
    const meta=READY_META[r.status]||READY_META.ready;
    const tone=r.below?(r.ready?"var(--green)":r.moderate?"var(--amber)":"var(--violet)"):"var(--faint)";
    return '<div class="exline" data-muscle="'+r.m+'" style="padding:8px 0;cursor:pointer;align-items:center">'
      +'<div style="flex:1;min-width:0">'
      +'<div class="nm" style="font-size:13px">'+r.label
      +(r.tier==="primary"?' <span class="tag" style="color:var(--gold)">priority</span>':'')
      +(r.below?' <span class="tag" style="color:'+tone+';border:1px solid '+tone+'55">'+n(r.remaining)+' to go</span>':'')+'</div>'
      +'<div class="histline mono" style="font-size:10.5px">Direct '+n(r.direct)+' · Indirect '+n(r.secondary)+' · Effective '+n(r.eff)+'/'+r.min+' min</div>'
      +'<div class="bar" style="margin-top:5px"><i style="width:'+Math.max(3,Math.min(100,Math.round(r.eff/r.min*100)))+'%;background:'+(r.below?"var(--blue)":"var(--accent)")+'"></i></div></div>'
      +'<span class="mono" style="margin-left:10px;font-size:10.5px;color:'+meta.c+';white-space:nowrap">'+meta.t+'</span>'
      +'<span class="muted" style="margin-left:6px">›</span></div>'; };
  let h='<div class="card"><div class="tiny">Where you stand · this week</div>';
  h+= act.length
    ? '<div class="histline" style="margin-top:3px"><b style="color:var(--text)">'+act.length+' muscle'+(act.length===1?'':'s')+' below minimum and trainable now.</b></div>'
    : '<div class="histline" style="margin-top:3px;color:var(--green)">Nothing is both below minimum and ready — either covered or still recovering.</div>';
  h+='<div style="margin-top:6px">'+rows.map(line).join("")+'</div>';
  h+='<div class="histline" style="margin-top:10px">Direct = 1.0 credit, this muscle was the target · Indirect = 0.5 / 0.25 credit from other lifts · Effective = both combined, against your configured minimum. Tap any row for full attribution.</div>';
  return h+'</div>'; }
function bodyToggle(){
  return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px">'
    +'<span class="tiny">Layout</span><div class="seg" style="width:56%">'
    +'<button data-bodyview="v2" class="'+(bodyView==="v2"?"on":"")+'">Summary</button>'
    +'<button data-bodyview="v1" class="'+(bodyView==="v1"?"on":"")+'">Detailed</button></div></div>'; }

function viewBody(){
  if(bodyView==="v2") return bodyToggle()+bodyV2()+'<div id="bodydetail">'+(bodyDetail?muscleDetail(bodyDetail):"")+'</div>';
  return bodyToggle()+viewBodyV1(); }
function viewBodyV1(){

    const cards=ordered.map(m=>{ const cfg=S.muscles[m]; const rd=recoveryDisplay(m); const lt=lastTrainedMap()[m]; const v=weeklyVolume()[m]; const con=muscleContrib(m,weekSessions());

      const exc=below?'<span class="gb" style="background:rgba(90,200,250,.14);color:var(--blue)">Below min</span>':over?'<span class="gb" style="background:rgba(255,90,82,.14);color:var(--red)">Over cap</span>':'';
      return '<div class="mcard" data-muscle="'+m+'"><div class="bartop" style="background:'+rd.c+'"></div><div class="mbody">'
        +'<div class="mlabel">'+cfg.label+'</div>'
        +'<div style="font-size:11px;font-weight:600;color:'+rd.c+';margin-top:3px">'+rd.label+'</div>'
        +'<div class="histline" style="font-size:10.5px;margin-top:1px">'+(lt?fmtAgo(lt.date):"never trained")+'</div>'
        +'<div class="histline mono" style="font-size:10.5px;margin-top:7px">Direct '+con.direct.toFixed(1)+' · Indirect '+con.secondary.toFixed(1)+'</div>'
        +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:2px"><span class="histline" style="font-size:10px">effective sets</span><span class="mono" style="font-size:12.5px;color:var(--text)">'+v.toFixed(1)+'<span style="color:var(--faint)">/'+cfg.min+' min</span></span></div>'
        +'<div class="bar" style="margin-top:5px"><i style="width:'+fill+'%;background:'+barC+'"></i><span class="capmark" style="left:'+tgt+'%"></span></div>'
        +(exc?'<div style="margin-top:8px">'+exc+'</div>':'')
        +'</div></div>'; }).join("");
    return '<div class="muted tiny" style="margin:14px 2px 2px">'+title+'</div><div class="mgrid">'+cards+'</div>'; }).join("");
  return '<div class="card"><div class="tiny">Muscle status</div><p class="muted" style="font-size:12px;margin:6px 0 8px">Colour = <b>recovery</b> · Direct / Indirect = where the volume came from · Bar = <b>effective sets vs weekly minimum</b>. Tap a muscle for full attribution.</p>'

/* ---------------- REST TIMER ---------------- */
function restBeep(){ try{ const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return; const ctx=new Ctx(); const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type="sine"; o.frequency.value=880;
  g.gain.setValueAtTime(0.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.3,ctx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.5); o.start(); o.stop(ctx.currentTime+0.52); setTimeout(()=>{try{ctx.close();}catch(e){}},800); }catch(e){} }
/* v8 — WALL-CLOCK REST TIMER.
   The old implementation counted down an in-memory `left` variable inside a 1s setInterval.
   Mobile browsers throttle (and iOS/Android fully suspend) timers in a backgrounded tab, so the
   countdown froze while you were away and resumed where it left off — losing all elapsed time.
   Now the *only* source of truth is `restState.endsAt`, an absolute epoch-ms completion timestamp.
   Every paint derives the remaining seconds from Date.now(), the interval is a repaint trigger only,
   and the state is mirrored into localStorage so a reload / relaunch restores the same deadline.
   DONE_GRACE_MS: how long after expiry the "Rest done" card still shows when you come back. */
const REST_DONE_GRACE_MS = 120000;
let restState=null;               /* {endsAt, total, name, next, notified} — endsAt is epoch ms */
let restAnnounced=false;          /* buzz/beep fires once per timer, even across backgrounding */
function restKey(){ return (authUser&&authUser.id) ? "iron_arc_rest_v1:"+authUser.id : "iron_arc_rest_v1"; }
function saveRest(){ try{ if(restState) localStorage.setItem(restKey(), JSON.stringify(restState)); else localStorage.removeItem(restKey()); }catch(e){} }
/* pure + testable: seconds left on a state at a given instant (never negative) */
function restRemaining(st,now){ if(!st||!st.endsAt) return 0; return Math.max(0,Math.ceil((st.endsAt-(now==null?Date.now():now))/1000)); }
function restExpired(st,now){ if(!st||!st.endsAt) return true; return (now==null?Date.now():now)>=st.endsAt; }
/* how far past expiry we are, in ms (0 while still running) */
function restOverdue(st,now){ if(!st||!st.endsAt) return 0; return Math.max(0,(now==null?Date.now():now)-st.endsAt); }
function restMount(){ return document.getElementById("restmount"); }
/* We tick at 500ms (so a resync lands fast) but only touch the DOM when the displayed second

  // long-press a set number to toggle warm-up (off the permanent row)

  document.querySelectorAll("[data-muscle-group]").forEach(b=>b.onclick=()=>{ const g=MUSCLE_GROUPS.find(x=>x.key===b.dataset.muscleGroup); go("body");
    if(g&&g.muscles.length){ bodyDetail=g.muscles[0]; render(); setTimeout(()=>{ const el2=document.getElementById("bodydetail"); if(el2) el2.scrollIntoView({behavior:"smooth",block:"center"}); },60); } });
  /* v13 — a priority row is BOTH a drill-down and a container for the "+ Add" button. The row

  document.querySelectorAll("[data-muscle]").forEach(b=>b.onclick=(ev)=>{
    if(ev&&ev.target&&ev.target.closest&&ev.target.closest("[data-nodrill]")) return;
    bodyDetail=b.dataset.muscle; route="body"; render(); setTimeout(()=>{ const d=document.getElementById("bodydetail"); if(d) d.scrollIntoView({behavior:"smooth",block:"center"}); },60); });
  /* v13 — one-tap add from the Today priority list. Creates the draft if there is not one yet,
     then adds into that same draft on every subsequent tap. Stays on Today: the point is to

  document.querySelectorAll("[data-addmuscle]").forEach(b=>b.onclick=(ev)=>{

    if(!pick){ toast("Nothing eligible to add for "+((S.muscles[m]||{}).label||m)+" right now."); return; }
    if(addToDraft(pick.exId)) toast("Added "+pick.ex.name+" · "+DEFAULT_WORK_SETS+" sets");
    render(); });

  document.querySelectorAll("[data-bldtoggle]").forEach(b=>b.onclick=()=>{ setBuilderOpen(!builderOpen); render(); });
  document.querySelectorAll("[data-bldadd]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.bldadd; const ex=exById(id); if(!ex) return;
    if(addToDraft(id)) toast("Added "+ex.name+" \u00b7 "+DEFAULT_WORK_SETS+" sets");
    render(); });
  document.querySelectorAll("[data-bldcustom]").forEach(b=>b.onclick=()=>{ customDraft={name:b.dataset.bldcustom||"",group:"",load:"ext",id:null}; openSheet("custom"); });
  document.querySelectorAll("[data-fbldg]").forEach(b=>b.onclick=()=>{ bldGroup=b.dataset.fbldg||""; render(); });
  document.querySelectorAll("[data-fblde]").forEach(b=>b.onclick=()=>{ bldEquip=b.dataset.fblde||""; render(); });
  (function(){ const bs=document.getElementById("bldSearch"); if(!bs) return;
    bs.oninput=()=>{ bldSearch=bs.value; render();
      const n=document.getElementById("bldSearch");
      if(n){ n.focus(); try{ n.setSelectionRange(n.value.length,n.value.length); }catch(e){} } }; })();
  document.querySelectorAll("[data-muscle-stat]").forEach(b=>b.onclick=()=>openSheet("mperiod",b.dataset.muscleStat));
  document.querySelectorAll("[data-insight-muscle]").forEach(b=>b.onclick=()=>{ const cur=statsPeriod; statsPeriod="week"; openSheet("mperiod",b.dataset.insightMuscle); statsPeriod=cur; });
  document.querySelectorAll("[data-exhist]").forEach(b=>b.onclick=()=>openSheet("exhist",b.dataset.exhist));
  document.querySelectorAll("[data-cxreview]").forEach(b=>b.onclick=()=>{ reconcileSearch=""; openSheet("reconcile",b.dataset.cxreview); });
  document.querySelectorAll("[data-addcustom]").forEach(b=>b.onclick=()=>{ customDraft={name:b.dataset.addcustom||"",group:"",load:"ext",id:null}; openSheet("custom"); });
  document.querySelectorAll("[data-closedetail]").forEach(b=>b.onclick=()=>{ bodyDetail=null; render(); });
  document.querySelectorAll("[data-section]").forEach(b=>b.onclick=()=>{ toggleSection(b.dataset.section, b.dataset.secdef==="1"); render(); });
  /* v16 */
  document.querySelectorAll("[data-covcell]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openSheet("covcell",b.dataset.covcell); });
  document.querySelectorAll("[data-covview]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); covView=b.dataset.covview; render(); });   /* v17 */
  document.querySelectorAll("[data-dq]").forEach(b=>b.onclick=()=>openSheet("dq",b.dataset.dq));
  /* v17 — Settings → Data quality review centre */
  document.querySelectorAll("[data-dqtab]").forEach(b=>b.onclick=()=>{ dqCentreTab=b.dataset.dqtab; render(); });
  document.querySelectorAll("[data-dqedit]").forEach(b=>b.onclick=()=>editWorkout(b.dataset.dqedit));
  document.querySelectorAll("[data-dqdismiss]").forEach(b=>b.onclick=()=>{ dqDismiss(b.dataset.dqdismiss); render(); });
  document.querySelectorAll("[data-dqrestore]").forEach(b=>b.onclick=()=>{ dqRestore(b.dataset.dqrestore); render(); });
  document.querySelectorAll("[data-stallall]").forEach(b=>b.onclick=()=>{ stallShowAll=!stallShowAll; render(); });
  document.querySelectorAll("[data-bodyview]").forEach(b=>b.onclick=()=>{ bodyView=b.dataset.bodyview;
    try{ localStorage.setItem("iron_arc_bodyview",bodyView); }catch(e){} render(); });
  document.querySelectorAll("[data-showall]").forEach(b=>b.onclick=()=>{ showAllMuscles=!showAllMuscles; render(); });
  // settings
  // per-user training profile
  document.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>{ const m=b.dataset.tier; const order=["primary","secondary","maintenance"]; S.muscles[m].tier=order[(order.indexOf(S.muscles[m].tier)+1)%3]; save(); render(); });
  act("target-inc",()=>{ S.settings.sessionsPerWeek=Math.min(7,(S.settings.sessionsPerWeek||4)+1); save(); render(); });
  act("target-dec",()=>{ S.settings.sessionsPerWeek=Math.max(1,(S.settings.sessionsPerWeek||4)-1); save(); render(); });
  document.querySelectorAll("[data-inputorder]").forEach(b=>b.onclick=()=>{ S.settings.inputOrder=b.dataset.inputorder; save(); render(); });
  document.querySelectorAll("[data-pref]").forEach(b=>b.onclick=()=>{ const e=exById(b.dataset.pref); const order=["love","like","neutral","avoid"]; e.pref=order[(order.indexOf(e.pref)+1)%4]; syncCustomPrefs(e); save(); pushExercisePref(e); render(); });
  document.querySelectorAll("[data-avail]").forEach(b=>b.onclick=()=>{ const e=exById(b.dataset.avail); const order=["always","usually","sometimes","rarely","no"]; e.avail=order[(order.indexOf(e.avail)+1)%5]; syncCustomPrefs(e); save(); pushExercisePref(e); render(); });
  document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>{ const e=exById(b.dataset.rec); e.rec=!e.rec; syncCustomPrefs(e); save(); render(); });
  document.querySelectorAll("[data-repexid]").forEach(b=>b.onclick=()=>{ repExId=b.dataset.repexid; render(); });
  document.querySelectorAll("[data-repmetric]").forEach(b=>b.onclick=()=>{ repMetric=b.dataset.repmetric; render(); });
  (function(){ var ms=document.querySelector('#mgmtSearch'); if(ms) ms.oninput=function(){ mgmtSearch=ms.value; render(); var n=document.querySelector('#mgmtSearch'); if(n){ n.focus(); try{n.setSelectionRange(n.value.length,n.value.length);}catch(e){} } }; })();
  (function(){ var rs=document.querySelector('#repSearch'); if(rs) rs.oninput=function(){ repSearch=rs.value; render(); var n=document.querySelector('#repSearch'); if(n){ n.focus(); try{n.setSelectionRange(n.value.length,n.value.length);}catch(e){} } }; })();
  act("logbw",()=>{ const v=+document.getElementById("bwInput").value; if(v>0){ const row={id:uid(),date:iso(new Date()),kg:v,synced:false}; S.bodyweight.push(row); save(); pushMeasurementRow(row.id,row.date,"bodyweight",v); render(); } });
  act("export",()=>{ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="iron-arc-backup-"+dayKey(new Date())+".json"; a.click(); });
  act("import",()=>document.getElementById("importFile").click());
  const imp=document.getElementById("importFile"); if(imp) imp.onchange=(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.sessions){ S=d; S.sessions=normaliseSessions(S.sessions,"import"); try{ ensureSetupDefaults(); rebuildCustomExercises(); }catch(err2){} persistLocal(); migrateLocalToCloud(); render(); alert("Imported."); } }catch(err){ alert("Invalid backup file."); } }; r.readAsText(f); };
}

/* ============================================================================ BOOT — autosave recovery + back-guard + session ============================================================================ */
try{ document.title=APP_NAME+" — "+APP_TAGLINE; }catch(e){}
try{ recoverFromJournal(); journalBackfill(); }catch(e){}           // v10: rescue anything S lost, then make sure all of it is journalled
activeSession=loadActive(); if(activeSession) viewingLogger=false;   // P1: recover unfinished workout, show resume banner
window.addEventListener("beforeunload",(e)=>{ if(activeSession && activeSession.entries.reduce((n,en)=>n+workingSets(en).length,0)>0){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("popstate",()=>{ if(activeSession && viewingLogger){ try{ history.pushState({iron:"workout"},""); }catch(e){}
    confirmSheet("Your workout is saved — you can pick it back up from Today whenever you like.","Leave (it’s saved)",()=>{ viewingLogger=false; saveActive(); render(); },{title:"Leave this workout?"}); } });
/* v8 rest-timer resync. Any of these can fire when the app comes back from the background, a screen
   lock or a tab switch; resumeRest() recomputes the remaining time from the stored deadline, so
   throttled/suspended intervals can never cause drift. All paths are idempotent. */
try{
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) resumeRest(); });
  window.addEventListener("focus",resumeRest);
  window.addEventListener("pageshow",resumeRest);
  window.addEventListener("online",resumeRest);
  document.addEventListener("resume",resumeRest);            /* Cordova / PWA wrappers */
}catch(e){}
/* ============================================================ STALE-BUILD GUARD (v10)
   There is no service worker, so there is no SW cache to invalidate — but GitHub Pages
   still serves index.html with its own Cache-Control, and an iOS home-screen web app can
   hold a document for a long time. Running an OLD build is a data-safety problem here,
   because the pre-v10 sync layer deleted completed workouts. So the app asks the server
   which build is deployed and offers a cache-bypassing reload if it is behind.

   Rules, in priority order:
     · NEVER interrupt an active workout. The check is deferred until the logger is closed.
     · Never block on the network; offline is a silent no-op.
     · The reload is offered, not forced — a forced reload mid-session would itself be a
       way to lose work.
   Safety net either way: an old build does not know about iron_arc_journal_v1, so it can
   neither read nor delete it. If a stale build ever did wipe S again, the next v10 load
   restores everything from the journal. */
let deployedBuild=null, buildCheckedAt=0;
async function checkDeployedBuild(){
  if(Date.now()-buildCheckedAt < 15*60*1000) return;      // at most every 15 minutes
  buildCheckedAt=Date.now();
  try{
    const url=window.location.pathname+"?cachebust="+Date.now();
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok) return;
    const txt=await res.text();
    const m=txt.match(/const\s+BUILD\s*=\s*"([^"]+)"/);
    if(!m) return;
    if(m[1]!==BUILD){ deployedBuild=m[1]; render(); }
  }catch(e){ /* offline or blocked — silent */ }
}
function buildBanner(){
  if(!deployedBuild||activeSession) return "";
  return '<div class="card" style="border-color:rgba(90,169,255,.4);background:rgba(90,169,255,.06)">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
    +'<div class="histline" style="color:var(--blue)">Update available — this device is running '+BUILD+', '+deployedBuild+' is deployed.</div>'
    +'<button class="btn sm" data-act="loadupdate">Update</button></div></div>';
}
function loadUpdate(){
  /* only ever reached with no workout open; bypass every cache layer on the way out */
  try{ persistLocal(); saveActive(); }catch(e){}
  window.location.replace(window.location.pathname+"?v="+Date.now());
}
try{
  setTimeout(checkDeployedBuild,4000);
  window.addEventListener("online",()=>{ buildCheckedAt=0; checkDeployedBuild(); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&!activeSession) checkDeployedBuild(); });
}catch(e){}

/* v10 DURABILITY HOOKS. beforeunload alone is not enough — iOS Safari and Android Chrome
   discard backgrounded tabs without ever firing it, which is exactly what "I closed the app
   and my workout was gone" looks like. pagehide/visibilitychange are the reliable pair, and
   both are cheap and idempotent. The same moments are used to drain the retry queue. */
try{
  /* v15: flush() never deletes the draft (saveActive only writes), so a stale background tab can
     no longer clobber the workout being logged in another tab. On return to the foreground the
     draft is re-adopted if this tab lost it, and the retry queue is drained ONCE — every trigger
     below funnels through the single-flight retryUnsynced()/pushWorkout(). */
  const flush=()=>{ try{ saveActive(); persistLocal(); }catch(e){} };
  window.addEventListener("pagehide",flush);
  window.addEventListener("blur",flush);
  window.addEventListener("freeze",flush);
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) flush(); else { flush(); try{ if(adoptDraft()) render(); recoverFromJournal(); retryUnsynced("visible"); }catch(e){} } });
  window.addEventListener("pageshow",(e)=>{ try{ if(e&&e.persisted&&adoptDraft()) render(); }catch(e2){} });
  window.addEventListener("online",()=>{ try{ retryDelay=RETRY_MIN; retryUnsynced("online"); }catch(e){} });
  window.addEventListener("focus",()=>{ try{ retryUnsynced("focus"); }catch(e){} });
  document.addEventListener("resume",flush);
  /* belt and braces: while a workout is open, force a snapshot every 10s even if no input fires */
  setInterval(()=>{ try{ if(activeSession) saveActive(); }catch(e){} },10000);
}catch(e){}
try{ resumeRest(); }catch(e){}                                /* restore a timer left running before a reload */
if(sb){ sb.auth.getSession().then(({data})=>{ authUser=data.session?data.session.user:null; if(authUser) afterAuth(); else render(); });
  sb.auth.onAuthStateChange((_e,session)=>{ const was=authUser&&authUser.id; authUser=session?session.user:null;
    if(authUser&&authUser.id!==was) afterAuth();
    else if(!authUser&&was){ afterAuthFor=null; plog("auth.signed-out",{was:was}); try{ clearRest(); }catch(e){} setStorageScope(null); S=seed(); activeSession=null; viewingLogger=false; render(); } }); }
else { render(); }
</script>
