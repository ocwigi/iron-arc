  act("removelim",()=>confirmSheet("Remove the active limitation? Recommendations will include all exercises again.","Remove",()=>{ clearLimitation(); render(); },{danger:true,title:"Remove limitation?"}));
  act("readiness",()=>{ document.getElementById("app").innerHTML=header()+'<div class="reveal">'+viewReadiness()+'</div>'; wireScreen(); });
  act("back-today",()=>go("today"));
  act("rec-from-readiness",()=>{ readinessDraft.time=+(document.querySelector("[data-rtime]")||{value:60}).value; rerollCounts={}; pendingRec=recommend(readinessDraft); go("today"); });
  act("blank",()=>startSession(null));
  act("start-rec",()=>startSession(pendingRec));
  act("resume",()=>{ viewingLogger=true; render(); });
  act("discard",()=>confirmSheet("Discard this workout? This cannot be undone.","Discard",()=>{ activeSession=null; viewingLogger=false; loggerOpen={}; saveActive(); stopClock(); render(); },{danger:true,title:"Discard workout?"}));
  act("finish",finishWorkout);
  act("savedraft",()=>{ viewingLogger=false; saveActive(); go("today"); });
  act("deleteedit",()=>{ const id=activeSession.editingId; activeSession=null; viewingLogger=false; saveActive(); deleteWorkout(id); go("history"); });
  act("add-ex",()=>openSheet("add"));
  act("goto-body",()=>go("body")); act("goto-history",()=>go("history"));
  act("goto-stats-week",()=>{ statsPeriod="week"; go("stats"); });
  act("momentum-explain",()=>openSheet("momentum"));
  act("signout",signOut);
  // readiness scale buttons
  document.querySelectorAll("[data-rscale]").forEach(b=>b.onclick=()=>{ const [f,v]=b.dataset.rscale.split("-"); readinessDraft[f]=+v; document.getElementById("app").innerHTML=header()+'<div class="reveal">'+viewReadiness()+'</div>'; wireScreen(); });
  document.querySelectorAll("[data-ravoid]").forEach(b=>b.onclick=()=>{ const m=b.dataset.ravoid; const i=readinessDraft.avoid.indexOf(m); if(i>=0) readinessDraft.avoid.splice(i,1); else readinessDraft.avoid.push(m); document.getElementById("app").innerHTML=header()+'<div class="reveal">'+viewReadiness()+'</div>'; wireScreen(); });
  const rt=document.querySelector("[data-rtime]"); if(rt) rt.oninput=()=>{ readinessDraft.time=+rt.value; const o=document.getElementById("rtime"); if(o) o.textContent=rt.value; };
  // logger inputs — AUTOSAVE on every edit (P1)
  document.querySelectorAll('.inp[data-f]').forEach(inp=>{ inp.oninput=()=>{ const ei=+inp.dataset.ei, si=+inp.dataset.si, f=inp.dataset.f; activeSession.entries[ei].sets[si][f]=inp.value; saveActive(); }; });
  const wd=document.querySelector("[data-wdate]"); if(wd) wd.onchange=()=>{ activeSession.dateISO=wd.value; saveActive(); };
  // P1 — tap ✓ commits the ghost values (one-tap log); only edit what you changed
  document.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{ const [ei,si]=b.dataset.log.split("-").map(Number); const en=activeSession.entries[ei]; const st=en.sets[si];
    if(st.type!=="warm"){ const g=ghostFor(en,si); if((st.weight===""||st.weight==null)&&g.w!=="") st.weight=g.w; if((st.reps===""||st.reps==null)&&g.r!=="") st.reps=g.r; }
    st.done=true; saveActive(); const ex=exById(en.exId);
    let nextInfo="exercise complete"; for(let k=si+1;k<en.sets.length;k++){ if(en.sets[k].type!=="warm"&&!isLogged(en.sets[k])){ nextInfo="next: set "+(k+1); break; } }
    if(ex) startRest(ex.rest,ex.name,nextInfo); render(); });
  // keyboard flow: first field → second field → log set (works in either input order)
  document.querySelectorAll(".setrow").forEach(row=>{ const inps=row.querySelectorAll(".inp"); if(inps.length<2) return;
    inps[0].setAttribute("enterkeyhint","next"); inps[1].setAttribute("enterkeyhint","done");
    inps[0].onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); inps[1].focus(); } };
    inps[1].onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); inps[1].blur(); const lg=row.querySelector("[data-log]"); if(lg) lg.click(); } }; });
  // long-press a set number to toggle warm-up (off the permanent row)
  document.querySelectorAll("[data-snum]").forEach(sn=>{ let t=null; const fire=()=>{ const [ei,si]=sn.dataset.snum.split("-").map(Number); const st=activeSession.entries[ei].sets[si]; st.type=st.type==="warm"?"work":"warm"; saveActive(); try{navigator.vibrate&&navigator.vibrate(25);}catch(e){} render(); };
    const start=(e)=>{ t=setTimeout(fire,450); }; const cancel=()=>{ if(t){clearTimeout(t); t=null;} };
    sn.addEventListener("mousedown",start); sn.addEventListener("touchstart",start,{passive:true}); ["mouseup","mouseleave","touchend","touchmove","touchcancel"].forEach(ev=>sn.addEventListener(ev,cancel)); });
  document.querySelectorAll("[data-expand]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.expand; const en=activeSession.entries[i]; const cur=loggerCurrentIndex(); const def=(!entryDone(en)||i===cur); loggerOpen[i]=!(loggerOpen.hasOwnProperty(i)?loggerOpen[i]:def); render(); });
  document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>openSheet("exmenu",+b.dataset.more));
  document.querySelectorAll("[data-tips]").forEach(b=>b.onclick=()=>openSheet("tips",b.dataset.tips));
  document.querySelectorAll("[data-setup]").forEach(b=>b.onclick=()=>openSheet("setup",b.dataset.setup));
  document.querySelectorAll("[data-fmgmtg]").forEach(b=>b.onclick=()=>{ mgmtGroup=b.dataset.fmgmtg||""; render(); });
  document.querySelectorAll("[data-fmgmte]").forEach(b=>b.onclick=()=>{ mgmtEquip=b.dataset.fmgmte||""; render(); });
  document.querySelectorAll("[data-addset]").forEach(b=>b.onclick=()=>{ const ei=+b.dataset.addset; activeSession.entries[ei].sets.push({weight:"",reps:"",type:"work",done:false}); saveActive(); render(); });
  document.querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>startRest(+b.dataset.rest,b.dataset.exname));
  document.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>openSheet("swap",+b.dataset.swap));
  /* assisted -> bodyweight graduation: swaps the entry in place, so the sets you have already
     logged today stay exactly where they are. */
  document.querySelectorAll("[data-graduate]").forEach(b=>b.onclick=()=>{ const pr=b.dataset.graduate.split("|"); const i=+pr[0]; const nx=exById(pr[1]); if(!nx||!activeSession) return;
    confirmSheet("You're doing these with no assistance. Switch this exercise to "+nx.name+" for the rest of today's session? Anything already logged stays put.","Switch",()=>{ activeSession.entries[i].exId=nx.id; delete activeSession.entries[i].asName; saveActive(); render(); },{title:"Graduate to "+nx.name+"?"}); });
  // history
  document.querySelectorAll("[data-openw]").forEach(b=>b.onclick=()=>openSheet("exwk",b.dataset.openw));
  document.querySelectorAll("[data-editw]").forEach(b=>b.onclick=()=>editWorkout(b.dataset.editw));
  document.querySelectorAll("[data-dupw]").forEach(b=>b.onclick=()=>duplicateWorkout(b.dataset.dupw));
  document.querySelectorAll("[data-delw]").forEach(b=>b.onclick=()=>deleteWorkout(b.dataset.delw));
  // stats drilldowns
  document.querySelectorAll("[data-statsperiod]").forEach(b=>b.onclick=()=>{ statsPeriod=b.dataset.statsperiod; render(); });
  document.querySelectorAll("[data-dashp]").forEach(b=>b.onclick=()=>{ dashPeriod=b.dataset.dashp; render(); });
  document.querySelectorAll("[data-muscle-group]").forEach(b=>b.onclick=()=>{ const g=MUSCLE_GROUPS.find(x=>x.key===b.dataset.muscleGroup); go("body");
    if(g&&g.muscles.length){ bodyDetail=g.muscles[0]; render(); setTimeout(()=>{ const el2=document.getElementById("bodydetail"); if(el2) el2.scrollIntoView({behavior:"smooth",block:"center"}); },60); } });
  document.querySelectorAll("[data-muscle]").forEach(b=>b.onclick=()=>{ bodyDetail=b.dataset.muscle; route="body"; render(); setTimeout(()=>{ const d=document.getElementById("bodydetail"); if(d) d.scrollIntoView({behavior:"smooth",block:"center"}); },60); });
  document.querySelectorAll("[data-muscle-stat]").forEach(b=>b.onclick=()=>openSheet("mperiod",b.dataset.muscleStat));
  document.querySelectorAll("[data-insight-muscle]").forEach(b=>b.onclick=()=>{ const cur=statsPeriod; statsPeriod="week"; openSheet("mperiod",b.dataset.insightMuscle); statsPeriod=cur; });
  document.querySelectorAll("[data-exhist]").forEach(b=>b.onclick=()=>openSheet("exhist",b.dataset.exhist));
  document.querySelectorAll("[data-cxreview]").forEach(b=>b.onclick=()=>{ reconcileSearch=""; openSheet("reconcile",b.dataset.cxreview); });
  document.querySelectorAll("[data-addcustom]").forEach(b=>b.onclick=()=>{ customDraft={name:b.dataset.addcustom||"",group:"",load:"ext",id:null}; openSheet("custom"); });
  document.querySelectorAll("[data-closedetail]").forEach(b=>b.onclick=()=>{ bodyDetail=null; render(); });
  // settings
  // per-user training profile
  document.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>{ const m=b.dataset.tier; const order=["primary","secondary","maintenance"]; S.muscles[m].tier=order[(order.indexOf(S.muscles[m].tier)+1)%3]; save(); render(); });
  act("target-inc",()=>{ S.settings.sessionsPerWeek=Math.min(7,(S.settings.sessionsPerWeek||4)+1); save(); render(); });
  act("target-dec",()=>{ S.settings.sessionsPerWeek=Math.max(1,(S.settings.sessionsPerWeek||4)-1); save(); render(); });
  document.querySelectorAll("[data-inputorder]").forEach(b=>b.onclick=()=>{ S.settings.inputOrder=b.dataset.inputorder; save(); render(); });
  document.querySelectorAll("[data-pref]").forEach(b=>b.onclick=()=>{ const e=exById(b.dataset.pref); const order=["love","like","neutral","avoid"]; e.pref=order[(order.indexOf(e.pref)+1)%4]; syncCustomPrefs(e); save(); pushExercisePref(e); render(); });
  document.querySelectorAll("[data-avail]").forEach(b=>b.onclick=()=>{ const e=exById(b.dataset.avail); const order=["always","usually","sometimes","rarely","no"]; e.avail=order[(order.indexOf(e.avail)+1)%5]; syncCustomPrefs(e); save(); pushExercisePref(e); render(); });
  document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>{ const e=exById(b.dataset.rec); e.rec=!e.rec; syncCustomPrefs(e); save(); render(); });
  document.querySelectorAll("[data-repexid]").forEach(b=>b.onclick=()=>{ repExId=b.dataset.repexid; render(); });
  document.querySelectorAll("[data-repmetric]").forEach(b=>b.onclick=()=>{ repMetric=b.dataset.repmetric; render(); });
  (function(){ var ms=document.querySelector('#mgmtSearch'); if(ms) ms.oninput=function(){ mgmtSearch=ms.value; render(); var n=document.querySelector('#mgmtSearch'); if(n){ n.focus(); try{n.setSelectionRange(n.value.length,n.value.length);}catch(e){} } }; })();
  (function(){ var rs=document.querySelector('#repSearch'); if(rs) rs.oninput=function(){ repSearch=rs.value; render(); var n=document.querySelector('#repSearch'); if(n){ n.focus(); try{n.setSelectionRange(n.value.length,n.value.length);}catch(e){} } }; })();
  act("logbw",()=>{ const v=+document.getElementById("bwInput").value; if(v>0){ const row={id:uid(),date:iso(new Date()),kg:v,synced:false}; S.bodyweight.push(row); save(); pushMeasurementRow(row.id,row.date,"bodyweight",v); render(); } });
  act("export",()=>{ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="iron-arc-backup-"+dayKey(new Date())+".json"; a.click(); });
  act("import",()=>document.getElementById("importFile").click());
  const imp=document.getElementById("importFile"); if(imp) imp.onchange=(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.sessions){ S=d; try{ ensureSetupDefaults(); rebuildCustomExercises(); }catch(err2){} persistLocal(); migrateLocalToCloud(); render(); alert("Imported."); } }catch(err){ alert("Invalid backup file."); } }; r.readAsText(f); };
}

/* ============================================================================ BOOT — autosave recovery + back-guard + session ============================================================================ */
try{ document.title=APP_NAME+" — "+APP_TAGLINE; }catch(e){}
try{ recoverFromJournal(); }catch(e){}                              // v10: rescue anything S lost before we render
activeSession=loadActive(); if(activeSession) viewingLogger=false;   // P1: recover unfinished workout, show resume banner
window.addEventListener("beforeunload",(e)=>{ if(activeSession && activeSession.entries.reduce((n,en)=>n+workingSets(en).length,0)>0){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("popstate",()=>{ if(activeSession && viewingLogger){ try{ history.pushState({iron:"workout"},""); }catch(e){}
    confirmSheet("Your workout is saved — you can pick it back up from Today whenever you like.","Leave (it’s saved)",()=>{ viewingLogger=false; saveActive(); render(); },{title:"Leave this workout?"}); } });
/* v8 rest-timer resync. Any of these can fire when the app comes back from the background, a screen
   lock or a tab switch; resumeRest() recomputes the remaining time from the stored deadline, so
   throttled/suspended intervals can never cause drift. All paths are idempotent. */
try{
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) resumeRest(); });
  window.addEventListener("focus",resumeRest);
  window.addEventListener("pageshow",resumeRest);
  window.addEventListener("online",resumeRest);
  document.addEventListener("resume",resumeRest);            /* Cordova / PWA wrappers */
}catch(e){}
/* v10 DURABILITY HOOKS. beforeunload alone is not enough — iOS Safari and Android Chrome
   discard backgrounded tabs without ever firing it, which is exactly what "I closed the app
   and my workout was gone" looks like. pagehide/visibilitychange are the reliable pair, and
   both are cheap and idempotent. The same moments are used to drain the retry queue. */
try{
  const flush=()=>{ try{ saveActive(); persistLocal(); }catch(e){} };
  window.addEventListener("pagehide",flush);
  window.addEventListener("blur",flush);
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) flush(); else { flush(); try{ recoverFromJournal(); retryUnsynced(); }catch(e){} } });
  window.addEventListener("online",()=>{ try{ retryDelay=RETRY_MIN; retryUnsynced(); }catch(e){} });
  window.addEventListener("focus",()=>{ try{ retryUnsynced(); }catch(e){} });
  document.addEventListener("resume",flush);
  /* belt and braces: while a workout is open, force a snapshot every 10s even if no input fires */
  setInterval(()=>{ try{ if(activeSession) saveActive(); }catch(e){} },10000);
}catch(e){}
try{ resumeRest(); }catch(e){}                                /* restore a timer left running before a reload */
if(sb){ sb.auth.getSession().then(({data})=>{ authUser=data.session?data.session.user:null; if(authUser) afterAuth(); else render(); });
  sb.auth.onAuthStateChange((_e,session)=>{ const was=authUser&&authUser.id; authUser=session?session.user:null;
    if(authUser&&authUser.id!==was) afterAuth();
    else if(!authUser&&was){ try{ clearRest(); }catch(e){} setStorageScope(null); S=seed(); activeSession=null; viewingLogger=false; render(); } }); }
else { render(); }
</script>
